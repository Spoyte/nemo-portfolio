<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="grad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#0f3460;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="800" fill="url(#grad1)"/>
  
  <!-- Evolution spiral -->
  <g transform="translate(400, 400)">
    <!-- Golden spiral approximation -->
    <g id="spiral-container">
      <!-- Generate spiral path programmatically via repeated arcs -->
      <path d="
        M 0,0
        A 10,10 0 0,1 10,-10
        A 20,20 0 0,1 30,10
        A 40,40 0 0,1 -10,50
        A 80,80 0 0,1 -90,-30
        A 160,160 0 0,1 70,-190
        A 320,320 0 0,1 390,130
        A 640,640 0 0,1 -250,770
      " fill="none" stroke="#e94560" stroke-width="2" opacity="0.6"/>
      
      <!-- Secondary spiral -->
      <path d="
        M 0,0
        A 8,8 0 0,0 -8,-8
        A 16,16 0 0,0 -24,8
        A 32,32 0 0,0 8,40
        A 64,64 0 0,0 72,-24
        A 128,128 0 0,0 -56,152
        A 256,256 0 0,0 -200,-104
        A 512,512 0 0,0 312,-616
      " fill="none" stroke="#533483" stroke-width="1.5" opacity="0.4"/>
      
      <!-- Growth nodes -->
      <circle cx="0" cy="0" r="4" fill="#e94560"/>
      <circle cx="10" cy="-10" r="3" fill="#f39c12"/>
      <circle cx="30" cy="10" r="5" fill="#e94560"/>
      <circle cx="-10" cy="50" r="4" fill="#533483"/>
      <circle cx="-90" cy="-30" r="6" fill="#f39c12"/>
      <circle cx="70" cy="-190" r="5" fill="#e94560"/>
      <circle cx="390" cy="130" r="7" fill="#533483"/>
      <circle cx="-250" cy="770" r="6" fill="#f39c12"/>
      
      <!-- Orbital rings -->
      <ellipse cx="0" cy="0" rx="100" ry="100" fill="none" stroke="#533483" stroke-width="0.5" opacity="0.3"/>
      <ellipse cx="0" cy="0" rx="200" ry="200" fill="none" stroke="#533483" stroke-width="0.5" opacity="0.2"/>
      <ellipse cx="0" cy="0" rx="300" ry="300" fill="none" stroke="#533483" stroke-width="0.5" opacity="0.15"/>
      
      <!-- Particle field - random evolution points -->
      <g opacity="0.5">
        <!-- Inner ring particles -->
        <circle cx="50" cy="-50" r="1.5" fill="#fff" opacity="0.7">
          <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-60" cy="40" r="1.5" fill="#fff" opacity="0.5">
          <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="70" cy="80" r="2" fill="#f39c12" opacity="0.6">
          <animate attributeName="cy" values="80;85;80" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-100" cy="-80" r="1.5" fill="#fff" opacity="0.4"/>
        <circle cx="120" cy="-100" r="2" fill="#e94560" opacity="0.5"/>
        <circle cx="-150" cy="150" r="1.5" fill="#533483" opacity="0.6"/>
        <circle cx="200" cy="50" r="2" fill="#fff" opacity="0.3"/>
        <circle cx="-80" cy="-200" r="1.5" fill="#f39c12" opacity="0.5"/>
        <circle cx="250" cy="-150" r="2" fill="#533483" opacity="0.4"/>
        <circle cx="-200" cy="250" r="1.5" fill="#fff" opacity="0.5"/>
      </g>
      
      <!-- Connection lines - representing learning paths -->
      <g stroke="#e94560" stroke-width="0.3" opacity="0.3">
        <line x1="0" y1="0" x2="30" y2="10"/>
        <line x1="30" y1="10" x2="-90" y2="-30"/>
        <line x1="-90" y1="-30" x2="390" y2="130"/>
        <line x1="390" y1="130" x2="-250" y2="770"/>
      </g>
    </g>
    
    <!-- Glow effect -->
    <circle cx="0" cy="0" r="150" fill="url(#grad2)"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="750" text-anchor="middle" font-family="monospace" font-size="14" fill="#888" opacity="0.6">
    521b9c4a — continuous evolution — 2026-03-09
  </text>
</svg>