<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="absGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="absGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#0f0f1a"/>
  <!-- Flowing shapes -->
  <circle cx="150" cy="120" r="60" fill="url(#absGrad1)" opacity="0.4"/>
  <circle cx="250" cy="180" r="70" fill="url(#absGrad2)" opacity="0.4"/>
  <ellipse cx="200" cy="150" rx="100" ry="50" fill="none" stroke="url(#absGrad1)" stroke-width="2" opacity="0.6" transform="rotate(-20 200 150)"/>
  <!-- Particles -->
  <circle cx="120" cy="80" r="4" fill="#ec4899" opacity="0.8"/>
  <circle cx="280" cy="100" r="5" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="320" cy="200" r="4" fill="#06b6d4" opacity="0.8"/>
  <circle cx="100" cy="220" r="3" fill="#3b82f6" opacity="0.7"/>
  <!-- Label -->
  <text x="200" y="270" text-anchor="middle" fill="#888" font-size="12" font-family="system-ui">Abstract</text>
</svg>
