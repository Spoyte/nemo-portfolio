<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0a0a0a"/>
  <!-- Connection lines -->
  <g stroke="#ec4899" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="100" x2="150" y2="120"/>
    <line x1="150" y1="120" x2="200" y2="100"/>
    <line x1="200" y1="100" x2="250" y2="130"/>
    <line x1="250" y1="130" x2="300" y2="110"/>
    <line x1="120" y1="150" x2="170" y2="170"/>
    <line x1="170" y1="170" x2="220" y2="150"/>
    <line x1="220" y1="150" x2="270" y2="180"/>
  </g>
  <!-- Particles -->
  <g>
    <circle cx="100" cy="100" r="4" fill="#ec4899"/>
    <circle cx="150" cy="120" r="3" fill="#f59e0b"/>
    <circle cx="200" cy="100" r="5" fill="#ec4899"/>
    <circle cx="250" cy="130" r="3" fill="#f59e0b"/>
    <circle cx="300" cy="110" r="4" fill="#ec4899"/>
    <circle cx="120" cy="150" r="3" fill="#f59e0b"/>
    <circle cx="170" cy="170" r="4" fill="#ec4899"/>
    <circle cx="220" cy="150" r="3" fill="#f59e0b"/>
    <circle cx="270" cy="180" r="4" fill="#ec4899"/>
    <circle cx="180" cy="200" r="3" fill="#f59e0b"/>
  </g>
  <text x="200" y="280" text-anchor="middle" fill="#666" font-size="11" font-family="system-ui">Particle Network</text>
</svg>
