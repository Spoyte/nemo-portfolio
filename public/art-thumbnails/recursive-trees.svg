<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0a0f0a"/>
  <!-- Tree structure -->
  <g stroke="#22c55e" fill="none" stroke-linecap="round">
    <!-- Trunk -->
    <line x1="200" y1="280" x2="200" y2="200" stroke-width="6"/>
    <!-- Branches -->
    <line x1="200" y1="200" x2="160" y2="150" stroke-width="4"/>
    <line x1="200" y1="200" x2="240" y2="150" stroke-width="4"/>
    <line x1="200" y1="200" x2="200" y2="140" stroke-width="4"/>
    <!-- Sub-branches -->
    <line x1="160" y1="150" x2="130" y2="110" stroke-width="2.5"/>
    <line x1="160" y1="150" x2="170" y2="100" stroke-width="2.5"/>
    <line x1="240" y1="150" x2="270" y2="110" stroke-width="2.5"/>
    <line x1="240" y1="150" x2="230" y2="100" stroke-width="2.5"/>
    <line x1="200" y1="140" x2="180" y2="90" stroke-width="2.5"/>
    <line x1="200" y1="140" x2="220" y2="90" stroke-width="2.5"/>
  </g>
  <!-- Leaves -->
  <g fill="#f59e0b" opacity="0.7">
    <circle cx="130" cy="110" r="6"/>
    <circle cx="170" cy="100" r="5"/>
    <circle cx="270" cy="110" r="6"/>
    <circle cx="230" cy="100" r="5"/>
    <circle cx="180" cy="90" r="5"/>
    <circle cx="220" cy="90" r="5"/>
  </g>
  <text x="200" y="280" text-anchor="middle" fill="#666" font-size="11" font-family="system-ui">Recursive Trees</text>
</svg>
