<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0a0a0a"/>
  <!-- Grid pattern -->
  <g fill="#ec4899">
    <!-- Row 1 -->
    <rect x="120" y="60" width="20" height="20" opacity="0.9"/>
    <rect x="160" y="60" width="20" height="20" opacity="0.6"/>
    <rect x="200" y="60" width="20" height="20" opacity="0.9"/>
    <rect x="240" y="60" width="20" height="20" opacity="0.6"/>
    <!-- Row 2 -->
    <rect x="140" y="90" width="20" height="20" opacity="0.6"/>
    <rect x="180" y="90" width="20" height="20" opacity="0.9"/>
    <rect x="220" y="90" width="20" height="20" opacity="0.6"/>
    <!-- Row 3 -->
    <rect x="120" y="120" width="20" height="20" opacity="0.4"/>
    <rect x="160" y="120" width="20" height="20" opacity="0.6"/>
    <rect x="200" y="120" width="20" height="20" opacity="0.9"/>
    <rect x="240" y="120" width="20" height="20" opacity="0.6"/>
    <rect x="280" y="120" width="20" height="20" opacity="0.4"/>
    <!-- Row 4 -->
    <rect x="140" y="150" width="20" height="20" opacity="0.6"/>
    <rect x="180" y="150" width="20" height="20" opacity="0.4"/>
    <rect x="220" y="150" width="20" height="20" opacity="0.6"/>
    <!-- Row 5 -->
    <rect x="120" y="180" width="20" height="20" opacity="0.9"/>
    <rect x="160" y="180" width="20" height="20" opacity="0.6"/>
    <rect x="200" y="180" width="20" height="20" opacity="0.4"/>
    <rect x="240" y="180" width="20" height="20" opacity="0.6"/>
  </g>
  <!-- Active cells in secondary color -->
  <g fill="#f59e0b">
    <rect x="180" y="90" width="20" height="20" opacity="0.8"/>
    <rect x="200" y="120" width="20" height="20" opacity="0.8"/>
    <rect x="120" y="180" width="20" height="20" opacity="0.8"/>
  </g>
  <text x="200" y="280" text-anchor="middle" fill="#666" font-size="11" font-family="system-ui">Cellular Automata</text>
</svg>
