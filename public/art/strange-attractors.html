<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strange Attractors — Chaotic Beauty</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #050508;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'SF Mono', Monaco, monospace;
            overflow: hidden;
        }
        canvas {
            box-shadow: 0 0 80px rgba(100, 80, 200, 0.2);
            border-radius: 4px;
        }
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        button {
            background: rgba(20, 20, 35, 0.9);
            border: 1px solid rgba(100, 80, 200, 0.4);
            color: #a090d0;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        button:hover {
            background: rgba(40, 35, 60, 0.95);
            border-color: rgba(120, 100, 220, 0.6);
            color: #c0b0f0;
            transform: translateY(-1px);
        }
        .info {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(160, 150, 200, 0.6);
            font-size: 12px;
            letter-spacing: 1px;
        }
        .attractor-name {
            position: fixed;
            top: 30px;
            right: 30px;
            color: rgba(200, 180, 255, 0.8);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="info">Click to regenerate • Drag to rotate view</div>
    <div class="attractor-name" id="attractorName">Lorenz</div>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <button onclick="cycleAttractor()">Next Attractor</button>
        <button onclick="resetView()">Reset View</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const nameEl = document.getElementById('attractorName');
        
        // High resolution for crisp rendering
        const displaySize = 800;
        const renderScale = 2;
        canvas.width = displaySize * renderScale;
        canvas.height = displaySize * renderScale;
        canvas.style.width = displaySize + 'px';
        canvas.style.height = displaySize + 'px';
        
        // Attractor configurations
        const attractors = {
            lorenz: {
                name: 'Lorenz',
                sigma: 10,
                rho: 28,
                beta: 8/3,
                dt: 0.005,
                scale: 12,
                offsetX: 0,
                offsetY: -25,
                colorBase: 280, // Purple
                iterations: 15000
            },
            rossler: {
                name: 'Rössler',
                a: 0.2,
                b: 0.2,
                c: 5.7,
                dt: 0.01,
                scale: 25,
                offsetX: 0,
                offsetY: 10,
                colorBase: 200, // Blue
                iterations: 12000
            },
            aizawa: {
                name: 'Aizawa',
                a: 0.95,
                b: 0.7,
                c: 0.6,
                d: 3.5,
                e: 0.25,
                f: 0.1,
                dt: 0.01,
                scale: 180,
                offsetX: 0,
                offsetY: 0,
                colorBase: 320, // Pink/Magenta
                iterations: 10000
            },
            thomas: {
                name: 'Thomas',
                b: 0.208186,
                dt: 0.05,
                scale: 35,
                offsetX: 0,
                offsetY: 0,
                colorBase: 160, // Teal
                iterations: 15000
            }
        };
        
        let currentAttractor = 'lorenz';
        let rotation = { x: 0.3, y: 0.5 };
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };
        let particles = [];
        let animationId = null;
        
        // 3D rotation helpers
        function rotate3D(x, y, z, rx, ry) {
            // Rotate around X axis
            let y1 = y * Math.cos(rx) - z * Math.sin(rx);
            let z1 = y * Math.sin(rx) + z * Math.cos(rx);
            
            // Rotate around Y axis
            let x2 = x * Math.cos(ry) + z1 * Math.sin(ry);
            let z2 = -x * Math.sin(ry) + z1 * Math.cos(ry);
            
            return { x: x2, y: y1, z: z2 };
        }
        
        // Lorenz attractor step
        function lorenzStep(x, y, z, params) {
            const dx = params.sigma * (y - x);
            const dy = x * (params.rho - z) - y;
            const dz = x * y - params.beta * z;
            return {
                x: x + dx * params.dt,
                y: y + dy * params.dt,
                z: z + params.dz * params.dt
            };
        }
        
        // Rössler attractor step
        function rosslerStep(x, y, z, params) {
            const dx = -y - z;
            const dy = x + params.a * y;
            const dz = params.b + z * (x - params.c);
            return {
                x: x + dx * params.dt,
                y: y + dy * params.dt,
                z: z + dz * params.dt
            };
        }
        
        // Aizawa attractor step
        function aizawaStep(x, y, z, params) {
            const dx = (z - params.b) * x - params.d * y;
            const dy = params.d * x + (z - params.b) * y;
            const dz = params.c + params.a * z - Math.pow(z, 3) / 3 - (x * x + y * y) * (1 + params.e * z) + params.f * z * Math.pow(x, 3);
            return {
                x: x + dx * params.dt,
                y: y + dy * params.dt,
                z: z + dz * params.dt
            };
        }
        
        // Thomas attractor step
        function thomasStep(x, y, z, params) {
            const dx = Math.sin(y) - params.b * x;
            const dy = Math.sin(z) - params.b * y;
            const dz = Math.sin(x) - params.b * z;
            return {
                x: x + dx * params.dt,
                y: y + dy * params.dt,
                z: z + dz * params.dt
            };
        }
        
        // Generate trajectory points
        function generateTrajectory(type) {
            const params = attractors[type];
            const points = [];
            let x = 0.1, y = 0, z = 0;
            
            // Warm up to reach attractor
            for (let i = 0; i < 1000; i++) {
                const next = stepAttractor(type, x, y, z, params);
                x = next.x;
                y = next.y;
                z = next.z;
            }
            
            // Collect points
            for (let i = 0; i < params.iterations; i++) {
                const next = stepAttractor(type, x, y, z, params);
                x = next.x;
                y = next.y;
                z = next.z;
                
                const rotated = rotate3D(x, y, z, rotation.x, rotation.y);
                points.push({
                    x: rotated.x,
                    y: rotated.y,
                    z: rotated.z,
                    index: i
                });
            }
            
            return points;
        }
        
        function stepAttractor(type, x, y, z, params) {
            switch(type) {
                case 'lorenz': return lorenzStep(x, y, z, params);
                case 'rossler': return rosslerStep(x, y, z, params);
                case 'aizawa': return aizawaStep(x, y, z, params);
                case 'thomas': return thomasStep(x, y, z, params);
                default: return lorenzStep(x, y, z, params);
            }
        }
        
        // Draw the attractor
        function draw() {
            const params = attractors[currentAttractor];
            const points = generateTrajectory(currentAttractor);
            
            // Clear with dark gradient background
            const bgGradient = ctx.createRadialGradient(
                canvas.width/2, canvas.height/2, 0,
                canvas.width/2, canvas.height/2, canvas.width
            );
            bgGradient.addColorStop(0, '#0a0a15');
            bgGradient.addColorStop(0.5, '#050508');
            bgGradient.addColorStop(1, '#020203');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Find bounds for normalization
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;
            let minZ = Infinity, maxZ = -Infinity;
            
            points.forEach(p => {
                minX = Math.min(minX, p.x);
                maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y);
                maxY = Math.max(maxY, p.y);
                minZ = Math.min(minZ, p.z);
                maxZ = Math.max(maxZ, p.z);
            });
            
            // Draw with glow effect
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Draw multiple passes for depth
            for (let pass = 0; pass < 3; pass++) {
                const passAlpha = 0.3 + pass * 0.25;
                const lineWidth = (1 + pass * 0.5) * renderScale;
                
                ctx.beginPath();
                
                for (let i = 1; i < points.length; i++) {
                    const p1 = points[i - 1];
                    const p2 = points[i];
                    
                    // Normalize and scale
                    const x1 = ((p1.x - minX) / (maxX - minX) - 0.5) * params.scale * canvas.width + canvas.width/2 + params.offsetX * renderScale;
                    const y1 = ((p1.y - minY) / (maxY - minY) - 0.5) * params.scale * canvas.height + canvas.height/2 + params.offsetY * renderScale;
                    const x2 = ((p2.x - minX) / (maxX - minX) - 0.5) * params.scale * canvas.width + canvas.width/2 + params.offsetX * renderScale;
                    const y2 = ((p2.y - minY) / (maxY - minY) - 0.5) * params.scale * canvas.height + canvas.height/2 + params.offsetY * renderScale;
                    
                    // Depth-based coloring
                    const zNorm = (p2.z - minZ) / (maxZ - minZ);
                    const hue = (params.colorBase + zNorm * 60 + i / points.length * 30) % 360;
                    const sat = 70 + zNorm * 20;
                    const light = 50 + zNorm * 25 + pass * 5;
                    const alpha = passAlpha * (0.3 + zNorm * 0.7);
                    
                    ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
                    ctx.lineWidth = lineWidth * (0.5 + zNorm * 0.8);
                    
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
            }
            
            // Add glowing head
            const last = points[points.length - 1];
            const headX = ((last.x - minX) / (maxX - minX) - 0.5) * params.scale * canvas.width + canvas.width/2 + params.offsetX * renderScale;
            const headY = ((last.y - minY) / (maxY - minY) - 0.5) * params.scale * canvas.height + canvas.height/2 + params.offsetY * renderScale;
            
            const glow = ctx.createRadialGradient(headX, headY, 0, headX, headY, 30 * renderScale);
            glow.addColorStop(0, `hsla(${params.colorBase}, 90%, 70%, 0.8)`);
            glow.addColorStop(0.5, `hsla(${params.colorBase}, 80%, 60%, 0.3)`);
            glow.addColorStop(1, 'transparent');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(headX, headY, 30 * renderScale, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Animation loop for subtle movement
        function animate() {
            rotation.y += 0.002;
            draw();
            animationId = requestAnimationFrame(animate);
        }
        
        // Controls
        function cycleAttractor() {
            const types = Object.keys(attractors);
            const currentIndex = types.indexOf(currentAttractor);
            currentAttractor = types[(currentIndex + 1) % types.length];
            nameEl.textContent = attractors[currentAttractor].name;
            draw();
        }
        
        function resetView() {
            rotation = { x: 0.3, y: 0.5 };
            draw();
        }
        
        // Mouse interactions
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouse = { x: e.clientX, y: e.clientY };
        });
        
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = (e.clientX - lastMouse.x) * 0.01;
                const dy = (e.clientY - lastMouse.y) * 0.01;
                rotation.y += dx;
                rotation.x += dy;
                lastMouse = { x: e.clientX, y: e.clientY };
                draw();
            }
        });
        
        window.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        canvas.addEventListener('click', (e) => {
            if (!isDragging) {
                // Randomize rotation slightly
                rotation.x = 0.2 + Math.random() * 0.4;
                rotation.y = Math.random() * Math.PI * 2;
                draw();
            }
        });
        
        // Initial draw
        draw();
        
        // Auto-rotate slowly
        setInterval(() => {
            if (!isDragging) {
                rotation.y += 0.001;
                draw();
            }
        }, 50);
    </script>
</body>
</html>
