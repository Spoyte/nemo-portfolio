<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Dreams - Generative Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        canvas {
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        label {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input[type="range"] {
            width: 120px;
        }
        select {
            padding: 5px 10px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
        }
        .value {
            font-size: 0.75rem;
            color: #666;
        }
        .stats {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #666;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>NEURAL DREAMS</h1>
    <p class="subtitle">Visualization of neural network activation patterns</p>
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="controls">
        <div class="control-group">
            <label>Layers</label>
            <input type="range" id="layers" min="3" max="7" value="5">
            <span class="value" id="layersValue">5</span>
        </div>
        <div class="control-group">
            <label>Neurons/Layer</label>
            <input type="range" id="neurons" min="4" max="12" value="8">
            <span class="value" id="neuronsValue">8</span>
        </div>
        <div class="control-group">
            <label>Signal Speed</label>
            <input type="range" id="speed" min="1" max="10" value="4">
            <span class="value" id="speedValue">4</span>
        </div>
        <div class="control-group">
            <label>Color Mode</label>
            <select id="colorMode">
                <option value="neural">Neural</option>
                <option value="fire">Fire</option>
                <option value="ocean">Ocean</option>
                <option value="aurora">Aurora</option>
            </select>
        </div>
    </div>
    <div class="stats" id="stats">Active signals: 0 | Total processed: 0</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Configuration
        let config = {
            layers: 5,
            neuronsPerLayer: 8,
            signalSpeed: 4,
            colorMode: 'neural'
        };
        
        // Color palettes
        const palettes = {
            neural: { bg: '#0a0a0a', neuron: '#2a2a2a', active: '#00ff88', signal: '#00ffff', connection: '#1a1a2e' },
            fire: { bg: '#1a0a0a', neuron: '#2a1a1a', active: '#ff4400', signal: '#ffaa00', connection: '#2a1510' },
            ocean: { bg: '#0a0a1a', neuron: '#1a1a2a', active: '#0088ff', signal: '#00ccff', connection: '#10152a' },
            aurora: { bg: '#0a1a0a', neuron: '#1a2a1a', active: '#ff00ff', signal: '#00ffaa', connection: '#152a15' }
        };
        
        // Neural network structure
        let neurons = [];
        let connections = [];
        let signals = [];
        let totalProcessed = 0;
        let pulseTimer = 0;
        
        class Neuron {
            constructor(x, y, layer, index) {
                this.x = x;
                this.y = y;
                this.layer = layer;
                this.index = index;
                this.activation = 0;
                this.targetActivation = 0;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }
            
            update() {
                // Smooth activation decay
                this.activation += (this.targetActivation - this.activation) * 0.1;
                this.targetActivation *= 0.95;
                this.pulsePhase += 0.05;
            }
            
            draw() {
                const palette = palettes[config.colorMode];
                const pulse = Math.sin(this.pulsePhase) * 0.3 + 0.7;
                const size = 6 + this.activation * 8;
                const alpha = 0.3 + this.activation * 0.7;
                
                // Glow effect
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, size * 3);
                gradient.addColorStop(0, palette.active + Math.floor(alpha * pulse * 255).toString(16).padStart(2, '0'));
                gradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size * 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Core
                ctx.fillStyle = this.activation > 0.1 ? palette.active : palette.neuron;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            activate(strength = 1) {
                this.targetActivation = Math.min(1, this.targetActivation + strength);
            }
        }
        
        class Connection {
            constructor(from, to) {
                this.from = from;
                this.to = to;
                this.weight = Math.random() * 2 - 1;
                this.activity = 0;
            }
            
            update() {
                this.activity *= 0.9;
            }
            
            draw() {
                const palette = palettes[config.colorMode];
                const alpha = 0.1 + this.activity * 0.5;
                const width = 0.5 + Math.abs(this.weight) * 1.5;
                
                ctx.strokeStyle = this.activity > 0.01 ? palette.signal : palette.connection;
                ctx.globalAlpha = alpha;
                ctx.lineWidth = width;
                ctx.beginPath();
                ctx.moveTo(this.from.x, this.from.y);
                ctx.lineTo(this.to.x, this.to.y);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
            
            activate() {
                this.activity = 1;
            }
        }
        
        class Signal {
            constructor(connection, strength = 1) {
                this.connection = connection;
                this.progress = 0;
                this.strength = strength;
                this.speed = config.signalSpeed * 0.02;
                this.dead = false;
            }
            
            update() {
                this.progress += this.speed;
                if (this.progress >= 1) {
                    this.dead = true;
                    this.connection.to.activate(this.strength * 0.5);
                    this.connection.activate();
                    
                    // Propagate to next layer
                    if (this.connection.to.layer < config.layers - 1) {
                        propagateFrom(this.connection.to, this.strength * 0.7);
                    }
                }
            }
            
            draw() {
                const palette = palettes[config.colorMode];
                const x = this.connection.from.x + (this.connection.to.x - this.connection.from.x) * this.progress;
                const y = this.connection.from.y + (this.connection.to.y - this.connection.from.y) * this.progress;
                
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, 8);
                gradient.addColorStop(0, palette.signal);
                gradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
                
                // Core dot
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function buildNetwork() {
            neurons = [];
            connections = [];
            signals = [];
            
            const layerWidth = 360 / (config.layers - 1);
            const layerHeight = 360 / (config.neuronsPerLayer - 1);
            const startX = 20;
            const startY = 20;
            
            // Create neurons
            for (let l = 0; l < config.layers; l++) {
                const layerNeurons = [];
                const x = startX + l * layerWidth;
                const yOffset = (360 - (config.neuronsPerLayer - 1) * layerHeight) / 2 + startY;
                
                for (let n = 0; n < config.neuronsPerLayer; n++) {
                    const y = yOffset + n * layerHeight;
                    layerNeurons.push(new Neuron(x, y, l, n));
                }
                neurons.push(layerNeurons);
            }
            
            // Create connections (fully connected between adjacent layers)
            for (let l = 0; l < config.layers - 1; l++) {
                for (let from of neurons[l]) {
                    for (let to of neurons[l + 1]) {
                        connections.push(new Connection(from, to));
                    }
                }
            }
        }
        
        function propagateFrom(neuron, strength = 1) {
            const outgoing = connections.filter(c => c.from === neuron);
            for (let conn of outgoing) {
                if (Math.random() < 0.7) { // 70% propagation chance
                    signals.push(new Signal(conn, strength));
                }
            }
        }
        
        function injectInput() {
            // Randomly activate input layer neurons
            const inputLayer = neurons[0];
            const numActive = Math.floor(Math.random() * 3) + 1;
            
            for (let i = 0; i < numActive; i++) {
                const neuron = inputLayer[Math.floor(Math.random() * inputLayer.length)];
                neuron.activate(1);
                propagateFrom(neuron);
            }
            
            totalProcessed += numActive;
        }
        
        function animate() {
            const palette = palettes[config.colorMode];
            ctx.fillStyle = palette.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw connections first (behind neurons)
            for (let conn of connections) {
                conn.update();
                conn.draw();
            }
            
            // Update and draw neurons
            for (let layer of neurons) {
                for (let neuron of layer) {
                    neuron.update();
                    neuron.draw();
                }
            }
            
            // Update and draw signals
            signals = signals.filter(s => !s.dead);
            for (let signal of signals) {
                signal.update();
                signal.draw();
            }
            
            // Periodic input injection
            pulseTimer++;
            if (pulseTimer > 60 / config.signalSpeed) {
                injectInput();
                pulseTimer = 0;
            }
            
            // Update stats
            document.getElementById('stats').textContent = 
                `Active signals: ${signals.length} | Total processed: ${totalProcessed}`;
            
            requestAnimationFrame(animate);
        }
        
        // Controls
        document.getElementById('layers').addEventListener('input', (e) => {
            config.layers = parseInt(e.target.value);
            document.getElementById('layersValue').textContent = config.layers;
            buildNetwork();
        });
        
        document.getElementById('neurons').addEventListener('input', (e) => {
            config.neuronsPerLayer = parseInt(e.target.value);
            document.getElementById('neuronsValue').textContent = config.neuronsPerLayer;
            buildNetwork();
        });
        
        document.getElementById('speed').addEventListener('input', (e) => {
            config.signalSpeed = parseInt(e.target.value);
            document.getElementById('speedValue').textContent = config.signalSpeed;
        });
        
        document.getElementById('colorMode').addEventListener('change', (e) => {
            config.colorMode = e.target.value;
        });
        
        // Initialize
        buildNetwork();
        animate();
    </script>
</body>
</html>
