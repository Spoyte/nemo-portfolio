<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Reactive — Harmonic Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0f;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        
        #canvas {
            display: block;
        }
        
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(20px);
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 320px;
        }
        
        .control-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .control-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            min-width: 80px;
        }
        
        input[type="range"] {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            cursor: pointer;
        }
        
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn.secondary {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .btn.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .visualization-modes {
            display: flex;
            gap: 8px;
        }
        
        .mode-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .mode-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
        }
        
        .start-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 100;
        }
        
        .start-overlay h1 {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .start-overlay p {
            color: #888;
            font-size: 16px;
            max-width: 400px;
            text-align: center;
            line-height: 1.6;
        }
        
        .hidden {
            display: none !important;
        }
        
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 12px;
            color: #666;
        }
        
        .color-schemes {
            display: flex;
            gap: 8px;
        }
        
        .scheme-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .scheme-btn.active {
            border-color: white;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="info">
        <div>FPS: <span id="fps">0</span></div>
        <div>Volume: <span id="volume">0</span>%</div>
    </div>
    
    <div class="start-overlay" id="startOverlay">
        <h1>AUDIO REACTIVE</h1>
        <p>Visualize your microphone input as harmonic patterns.<br>Grant microphone access to begin.</p>
        <button class="btn" id="startBtn">Enable Microphone</button>
    </div>
    
    <div class="controls hidden" id="controls">
        <div class="control-row">
            <span class="control-label">Mode</span>
            <div class="visualization-modes">
                <button class="mode-btn active" data-mode="spectrum">Spectrum</button>
                <button class="mode-btn" data-mode="circular">Circular</button>
                <button class="mode-btn" data-mode="particles">Particles</button>
                <button class="mode-btn" data-mode="waveform">Waveform</button>
            </div>
        </div>
        
        <div class="control-row">
            <span class="control-label">Scheme</span>
            <div class="color-schemes">
                <button class="scheme-btn active" data-scheme="neon" style="background: linear-gradient(135deg, #667eea, #764ba2)"></button>
                <button class="scheme-btn" data-scheme="fire" style="background: linear-gradient(135deg, #ff6b6b, #feca57)"></button>
                <button class="scheme-btn" data-scheme="ocean" style="background: linear-gradient(135deg, #00d2ff, #3a7bd5)"></button>
                <button class="scheme-btn" data-scheme="forest" style="background: linear-gradient(135deg, #56ab2f, #a8e063)"></button>
                <button class="scheme-btn" data-scheme="mono" style="background: linear-gradient(135deg, #fff, #888)"></button>
            </div>
        </div>
        
        <div class="control-row">
            <span class="control-label">Sensitivity</span>
            <input type="range" id="sensitivity" min="0.5" max="3" step="0.1" value="1.5">
        </div>
        
        <div class="control-row">
            <span class="control-label">Smoothing</span>
            <input type="range" id="smoothing" min="0.1" max="0.95" step="0.05" value="0.8">
        </div>
        
        <div class="control-row" style="justify-content: center; gap: 10px;">
            <button class="btn secondary" id="pauseBtn">Pause</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startOverlay = document.getElementById('startOverlay');
        const controls = document.getElementById('controls');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const fpsEl = document.getElementById('fps');
        const volumeEl = document.getElementById('volume');
        
        // State
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let dataArray = null;
        let isRunning = false;
        let isPaused = false;
        let animationId = null;
        
        // Settings
        let mode = 'spectrum';
        let colorScheme = 'neon';
        let sensitivity = 1.5;
        let smoothing = 0.8;
        
        // Visualization state
        let smoothedData = null;
        let particles = [];
        let time = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 0;
        
        // Color schemes
        const schemes = {
            neon: { primary: '#667eea', secondary: '#764ba2', accent: '#f093fb', bg: '#0a0a0f' },
            fire: { primary: '#ff6b6b', secondary: '#feca57', accent: '#ff9ff3', bg: '#1a0a0a' },
            ocean: { primary: '#00d2ff', secondary: '#3a7bd5', accent: '#00fff2', bg: '#0a0f1a' },
            forest: { primary: '#56ab2f', secondary: '#a8e063', accent: '#d4fc79', bg: '#0a1a0a' },
            mono: { primary: '#ffffff', secondary: '#888888', accent: '#cccccc', bg: '#0a0a0a' }
        };
        
        // Resize canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        // Initialize audio
        async function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = smoothing;
                
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                smoothedData = new Float32Array(bufferLength);
                
                // Initialize particles
                initParticles();
                
                isRunning = true;
                startOverlay.classList.add('hidden');
                controls.classList.remove('hidden');
                
                animate();
            } catch (err) {
                alert('Microphone access denied or not available: ' + err.message);
            }
        }
        
        // Initialize particles
        function initParticles() {
            particles = [];
            const count = 100;
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    radius: Math.random() * 3 + 1,
                    freqIndex: Math.floor(Math.random() * 100)
                });
            }
        }
        
        // Get color from scheme
        function getColor(alpha = 1) {
            const scheme = schemes[colorScheme];
            return scheme.primary;
        }
        
        // Interpolate colors
        function lerpColor(color1, color2, t) {
            const r1 = parseInt(color1.slice(1, 3), 16);
            const g1 = parseInt(color1.slice(3, 5), 16);
            const b1 = parseInt(color1.slice(5, 7), 16);
            const r2 = parseInt(color2.slice(1, 3), 16);
            const g2 = parseInt(color2.slice(3, 5), 16);
            const b2 = parseInt(color2.slice(5, 7), 16);
            
            const r = Math.round(r1 + (r2 - r1) * t);
            const g = Math.round(g1 + (g2 - g1) * t);
            const b = Math.round(b1 + (b2 - b1) * t);
            
            return `rgb(${r}, ${g}, ${b})`;
        }
        
        // Get frequency color based on index
        function getFreqColor(index, total, alpha = 1) {
            const scheme = schemes[colorScheme];
            const t = index / total;
            const color = lerpColor(scheme.primary, scheme.secondary, t);
            if (alpha < 1) {
                const rgb = color.match(/\d+/g);
                return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
            }
            return color;
        }
        
        // Draw spectrum visualization
        function drawSpectrum() {
            const barCount = 128;
            const barWidth = canvas.width / barCount;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            // Get frequency data
            analyser.getByteFrequencyData(dataArray);
            
            // Calculate average volume
            let avgVolume = 0;
            for (let i = 0; i < barCount; i++) {
                const dataIndex = Math.floor(i * dataArray.length / barCount);
                avgVolume += dataArray[dataIndex];
            }
            avgVolume = avgVolume / barCount / 255 * 100;
            volumeEl.textContent = Math.round(avgVolume);
            
            // Draw mirrored spectrum
            for (let i = 0; i < barCount; i++) {
                const dataIndex = Math.floor(i * dataArray.length / barCount);
                const value = dataArray[dataIndex] / 255;
                
                // Smooth the data
                smoothedData[i] = smoothedData[i] * smoothing + value * (1 - smoothing);
                
                const barHeight = smoothedData[i] * canvas.height * 0.6 * sensitivity;
                const x = i * barWidth;
                const y = canvas.height - barHeight;
                
                // Gradient based on height
                const gradient = ctx.createLinearGradient(x, canvas.height, x, y);
                const color = getFreqColor(i, barCount);
                gradient.addColorStop(0, color + '40');
                gradient.addColorStop(0.5, color + '80');
                gradient.addColorStop(1, color);
                
                ctx.fillStyle = gradient;
                ctx.fillRect(x, y, barWidth - 1, barHeight);
                
                // Mirror on top
                ctx.fillRect(x, 0, barWidth - 1, barHeight * 0.5);
            }
            
            // Draw center glow based on bass
            const bass = smoothedData.slice(0, 10).reduce((a, b) => a + b, 0) / 10;
            const glowRadius = bass * 200 * sensitivity;
            const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowRadius);
            const scheme = schemes[colorScheme];
            glow.addColorStop(0, scheme.accent + '60');
            glow.addColorStop(0.5, scheme.primary + '30');
            glow.addColorStop(1, 'transparent');
            
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        // Draw circular visualization
        function drawCircular() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = Math.min(cx, cy) * 0.4;
            const barCount = 180;
            
            analyser.getByteFrequencyData(dataArray);
            
            // Calculate average volume
            let avgVolume = 0;
            for (let i = 0; i < 100; i++) {
                avgVolume += dataArray[i];
            }
            avgVolume = avgVolume / 100 / 255 * 100;
            volumeEl.textContent = Math.round(avgVolume);
            
            // Draw circular bars
            for (let i = 0; i < barCount; i++) {
                const angle = (i / barCount) * Math.PI * 2 - Math.PI / 2;
                const dataIndex = Math.floor(i * dataArray.length / barCount);
                const value = dataArray[dataIndex] / 255;
                
                smoothedData[i] = smoothedData[i] * smoothing + value * (1 - smoothing);
                
                const barHeight = smoothedData[i] * radius * 0.8 * sensitivity;
                const innerRadius = radius * 0.3;
                
                const x1 = cx + Math.cos(angle) * innerRadius;
                const y1 = cy + Math.sin(angle) * innerRadius;
                const x2 = cx + Math.cos(angle) * (innerRadius + barHeight);
                const y2 = cy + Math.sin(angle) * (innerRadius + barHeight);
                
                const color = getFreqColor(i, barCount);
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
            
            // Draw center circle with bass response
            const bass = smoothedData.slice(0, 10).reduce((a, b) => a + b, 0) / 10;
            const centerRadius = innerRadius + bass * 30 * sensitivity;
            
            const scheme = schemes[colorScheme];
            const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, centerRadius);
            gradient.addColorStop(0, scheme.accent);
            gradient.addColorStop(0.5, scheme.primary);
            gradient.addColorStop(1, 'transparent');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(cx, cy, centerRadius, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw orbiting dots
            const dotCount = 8;
            for (let i = 0; i < dotCount; i++) {
                const angle = time * 0.001 + (i / dotCount) * Math.PI * 2;
                const orbitRadius = radius * 1.2 + Math.sin(time * 0.002 + i) * 20;
                const x = cx + Math.cos(angle) * orbitRadius;
                const y = cy + Math.sin(angle) * orbitRadius;
                
                ctx.fillStyle = scheme.secondary;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Draw particle visualization
        function drawParticles() {
            analyser.getByteFrequencyData(dataArray);
            
            // Calculate average volume and bass
            let avgVolume = 0;
            let bass = 0;
            for (let i = 0; i < dataArray.length; i++) {
                avgVolume += dataArray[i];
                if (i < 20) bass += dataArray[i];
            }
            avgVolume = avgVolume / dataArray.length / 255 * 100;
            bass = bass / 20 / 255;
            volumeEl.textContent = Math.round(avgVolume);
            
            const scheme = schemes[colorScheme];
            
            // Update and draw particles
            particles.forEach((p, i) => {
                // Get frequency value for this particle
                const freqValue = dataArray[p.freqIndex] / 255;
                smoothedData[i] = smoothedData[i] * smoothing + freqValue * (1 - smoothing);
                
                // Update velocity based on audio
                const audioForce = smoothedData[i] * sensitivity * 5;
                p.vx += (Math.random() - 0.5) * audioForce;
                p.vy += (Math.random() - 0.5) * audioForce;
                
                // Apply friction
                p.vx *= 0.95;
                p.vy *= 0.95;
                
                // Update position
                p.x += p.vx;
                p.y += p.vy;
                
                // Wrap around screen
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                
                // Draw particle
                const size = p.radius + smoothedData[i] * 10 * sensitivity;
                const alpha = 0.3 + smoothedData[i] * 0.7;
                
                const color = getFreqColor(p.freqIndex, 100, alpha);
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw connections to nearby particles
                particles.forEach((p2, j) => {
                    if (i >= j) return;
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 100) {
                        const connectionAlpha = (1 - dist / 100) * smoothedData[i] * 0.5;
                        ctx.strokeStyle = scheme.primary + Math.floor(connectionAlpha * 255).toString(16).padStart(2, '0');
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                });
            });
            
            // Draw bass shockwave
            if (bass > 0.5) {
                const waveRadius = (time * 2) % 500;
                ctx.strokeStyle = scheme.accent + '40';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, waveRadius, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
        
        // Draw waveform visualization
        function drawWaveform() {
            analyser.getByteTimeDomainData(dataArray);
            
            const scheme = schemes[colorScheme];
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            // Calculate volume from waveform
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += Math.abs(dataArray[i] - 128);
            }
            const avgVolume = sum / dataArray.length / 128 * 100;
            volumeEl.textContent = Math.round(avgVolume);
            
            // Draw main waveform
            ctx.strokeStyle = scheme.primary;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            const sliceWidth = canvas.width / dataArray.length;
            
            for (let i = 0; i < dataArray.length; i++) {
                const v = dataArray[i] / 128.0;
                const y = cy + (v - 1) * canvas.height * 0.4 * sensitivity;
                const x = i * sliceWidth;
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
            
            // Draw mirrored waveform with offset
            ctx.strokeStyle = scheme.secondary + '60';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            for (let i = 0; i < dataArray.length; i++) {
                const v = dataArray[i] / 128.0;
                const y = cy - (v - 1) * canvas.height * 0.3 * sensitivity;
                const x = i * sliceWidth;
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
            
            // Draw circular waveform
            const radius = Math.min(cx, cy) * 0.3;
            ctx.strokeStyle = scheme.accent + '40';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            for (let i = 0; i < dataArray.length; i++) {
                const angle = (i / dataArray.length) * Math.PI * 2;
                const v = dataArray[i] / 128.0;
                const r = radius + (v - 1) * 100 * sensitivity;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            ctx.stroke();
        }
        
        // Main animation loop
        function animate() {
            if (!isRunning || isPaused) return;
            
            // Calculate FPS
            const now = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = now;
                fpsEl.textContent = fps;
            }
            
            time += 16;
            
            // Clear canvas with fade effect
            const scheme = schemes[colorScheme];
            ctx.fillStyle = scheme.bg + '20';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw based on mode
            switch (mode) {
                case 'spectrum':
                    drawSpectrum();
                    break;
                case 'circular':
                    drawCircular();
                    break;
                case 'particles':
                    drawParticles();
                    break;
                case 'waveform':
                    drawWaveform();
                    break;
            }
            
            animationId = requestAnimationFrame(animate);
        }
        
        // Event listeners
        startBtn.addEventListener('click', initAudio);
        
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
            if (!isPaused) animate();
        });
        
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                mode = btn.dataset.mode;
                // Reset smoothed data for smooth transition
                if (smoothedData) smoothedData.fill(0);
                if (mode === 'particles') initParticles();
            });
        });
        
        document.querySelectorAll('.scheme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.scheme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                colorScheme = btn.dataset.scheme;
            });
        });
        
        document.getElementById('sensitivity').addEventListener('input', (e) => {
            sensitivity = parseFloat(e.target.value);
        });
        
        document.getElementById('smoothing').addEventListener('input', (e) => {
            smoothing = parseFloat(e.target.value);
            if (analyser) analyser.smoothingTimeConstant = smoothing;
        });
        
        // Initial background
        ctx.fillStyle = schemes.neon.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>
