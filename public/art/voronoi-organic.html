<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voronoi Organic - Generative Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
            padding: 20px;
        }
        
        h1 {
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 0.1em;
        }
        
        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        #canvas {
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #2a2a2a;
            border-color: #555;
        }
        
        button.active {
            background: #0066cc;
            border-color: #0066cc;
        }
        
        .palette-selector {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .palette-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .palette-btn:hover {
            transform: scale(1.1);
        }
        
        .palette-btn.active {
            border-color: #fff;
        }
        
        .ocean { background: linear-gradient(135deg, #0066cc, #00ccff); }
        .sunset { background: linear-gradient(135deg, #ff6b35, #ff6b9d); }
        .forest { background: linear-gradient(135deg, #2d5016, #7cb342); }
        .monochrome { background: linear-gradient(135deg, #0a0a0a, #aaaaaa); }
        .neon { background: linear-gradient(135deg, #ff00ff, #00ffff); }
    </style>
</head>
<body>
    <h1>VORONOI ORGANIC</h1>
    <p class="subtitle">Animated Voronoi diagram with organic distortion</p>
    
    <canvas id="canvas" width="800" height="600"></canvas>
    
    <div class="palette-selector">
        <div class="palette-btn ocean active" data-palette="ocean" title="Ocean"></div>
        <div class="palette-btn sunset" data-palette="sunset" title="Sunset"></div>
        <div class="palette-btn forest" data-palette="forest" title="Forest"></div>
        <div class="palette-btn monochrome" data-palette="monochrome" title="Monochrome"></div>
        <div class="palette-btn neon" data-palette="neon" title="Neon"></div>
    </div>
    
    <div class="controls">
        <button id="regenerate">Regenerate</button>
        <button id="toggleAnimate" class="active">Pause Animation</button>
        <button id="download">Download PNG</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const colorPalettes = {
            ocean: ["#0066cc", "#0099ff", "#00ccff", "#66e0ff", "#b3f0ff", "#004080"],
            sunset: ["#ff6b35", "#f7931e", "#ffd23f", "#ff6b9d", "#c44569", "#2c003e"],
            forest: ["#2d5016", "#3a6b1f", "#4a8b2c", "#7cb342", "#aed581", "#1b3d0d"],
            monochrome: ["#0a0a0a", "#2a2a2a", "#4a4a4a", "#6a6a6a", "#8a8a8a", "#aaaaaa"],
            neon: ["#ff00ff", "#00ffff", "#ffff00", "#ff0080", "#80ff00", "#8000ff"],
        };
        
        let cells = [];
        let time = 0;
        let isAnimating = true;
        let currentPalette = 'ocean';
        let animationId;
        
        const CELL_COUNT = 40;
        const WIDTH = 800;
        const HEIGHT = 600;
        
        function random() {
            return Math.random();
        }
        
        function initCells() {
            cells = [];
            const palette = colorPalettes[currentPalette];
            
            for (let i = 0; i < CELL_COUNT; i++) {
                cells.push({
                    x: random() * WIDTH,
                    y: random() * HEIGHT,
                    color: palette[Math.floor(random() * palette.length)],
                    radius: 30 + random() * 50,
                    growth: 0.5 + random() * 1.5,
                });
            }
        }
        
        function getDistance(x, y, cell) {
            const dx = x - cell.x;
            const dy = y - cell.y;
            const euclidean = Math.sqrt(dx * dx + dy * dy);
            
            // Add organic wobble
            const wobble = Math.sin(x * 0.01 + time * cell.growth) * 
                           Math.cos(y * 0.01 + time * cell.growth * 0.7) * 10;
            
            return euclidean + wobble;
        }
        
        function render() {
            const imageData = ctx.createImageData(WIDTH, HEIGHT);
            const data = imageData.data;
            
            const step = 2;
            
            for (let y = 0; y < HEIGHT; y += step) {
                for (let x = 0; x < WIDTH; x += step) {
                    let minDist = Infinity;
                    let nearestCell = null;
                    let secondDist = Infinity;
                    
                    for (const cell of cells) {
                        const dist = getDistance(x, y, cell);
                        if (dist < minDist) {
                            secondDist = minDist;
                            minDist = dist;
                            nearestCell = cell;
                        } else if (dist < secondDist) {
                            secondDist = dist;
                        }
                    }
                    
                    if (nearestCell) {
                        const edgeFactor = Math.min(1, (secondDist - minDist) / 30);
                        
                        const hex = nearestCell.color;
                        const r = parseInt(hex.slice(1, 3), 16);
                        const g = parseInt(hex.slice(3, 5), 16);
                        const b = parseInt(hex.slice(5, 7), 16);
                        
                        const depth = Math.max(0.3, 1 - minDist / nearestCell.radius);
                        const edgeHighlight = edgeFactor < 0.3 ? (0.3 - edgeFactor) * 3 : 0;
                        
                        const finalR = Math.min(255, r * depth + edgeHighlight * 100);
                        const finalG = Math.min(255, g * depth + edgeHighlight * 100);
                        const finalB = Math.min(255, b * depth + edgeHighlight * 100);
                        
                        for (let dy = 0; dy < step && y + dy < HEIGHT; dy++) {
                            for (let dx = 0; dx < step && x + dx < WIDTH; dx++) {
                                const idx = ((y + dy) * WIDTH + (x + dx)) * 4;
                                data[idx] = finalR;
                                data[idx + 1] = finalG;
                                data[idx + 2] = finalB;
                                data[idx + 3] = 255;
                            }
                        }
                    }
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
        }
        
        function animate() {
            if (isAnimating) {
                time += 0.02;
            }
            render();
            animationId = requestAnimationFrame(animate);
        }
        
        // Event handlers
        document.getElementById('regenerate').addEventListener('click', () => {
            initCells();
        });
        
        document.getElementById('toggleAnimate').addEventListener('click', (e) => {
            isAnimating = !isAnimating;
            e.target.textContent = isAnimating ? 'Pause Animation' : 'Resume Animation';
            e.target.classList.toggle('active', isAnimating);
        });
        
        document.getElementById('download').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `voronoi-organic-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
        
        document.querySelectorAll('.palette-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentPalette = e.target.dataset.palette;
                initCells();
            });
        });
        
        // Initialize
        initCells();
        animate();
    </script>
</body>
</html>
