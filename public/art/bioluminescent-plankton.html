<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bioluminescent Plankton — Evolutionary Art</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    #canvas-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    canvas {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 0 40px rgba(0, 200, 255, 0.1);
    }
    
    #controls {
      padding: 16px 24px;
      background: rgba(10, 15, 30, 0.95);
      border-top: 1px solid rgba(100, 200, 255, 0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    label {
      color: #88aacc;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input[type="range"] {
      width: 80px;
      accent-color: #00d4ff;
    }
    
    select {
      background: #1a2030;
      color: #fff;
      border: 1px solid #334455;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    
    input[type="checkbox"] {
      accent-color: #00d4ff;
    }
    
    #stats {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0, 10, 20, 0.8);
      padding: 12px 16px;
      border-radius: 8px;
      font-family: 'SF Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #88aacc;
      border: 1px solid rgba(0, 200, 255, 0.2);
    }
    
    #stats span {
      color: #00d4ff;
    }
    
    .value {
      display: inline-block;
      min-width: 30px;
      text-align: right;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="stats">
      <div>Generation: <span id="gen">1</span></div>
      <div>Population: <span id="pop">150</span></div>
      <div>Avg Fitness: <span id="fit">0</span></div>
    </div>
  </div>
  
  <div id="controls">
    <div class="control-group">
      <label>Population</label>
      <input type="range" id="populationSize" min="50" max="300" value="150">
      <span class="value" id="popVal">150</span>
    </div>
    <div class="control-group">
      <label>Mutation</label>
      <input type="range" id="mutationRate" min="1" max="30" value="8">
      <span class="value" id="mutVal">0.08</span>
    </div>
    <div class="control-group">
      <label>Selection</label>
      <input type="range" id="selectionPressure" min="10" max="100" value="60">
      <span class="value" id="selVal">0.6</span>
    </div>
    <div class="control-group">
      <label>Glow</label>
      <input type="range" id="glowIntensity" min="3" max="20" value="12">
      <span class="value" id="glowVal">1.2</span>
    </div>
    <div class="control-group">
      <label>Speed</label>
      <input type="range" id="speed" min="1" max="20" value="10">
      <span class="value" id="speedVal">1.0</span>
    </div>
    <div class="control-group">
      <label>Theme</label>
      <select id="colorScheme">
        <option value="deep-ocean" selected>Deep Ocean</option>
        <option value="aurora">Aurora</option>
        <option value="coral">Coral</option>
        <option value="midnight">Midnight</option>
        <option value="toxic">Toxic</option>
      </select>
    </div>
    <div class="control-group">
      <label>Evolution</label>
      <input type="checkbox" id="enableEvolution" checked>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Color schemes
    const COLOR_SCHEMES = {
      "deep-ocean": { bg: "#000510", hues: [180, 200, 220], sat: 80, light: 60 },
      "aurora": { bg: "#0a0a1a", hues: [120, 160, 280, 320], sat: 70, light: 65 },
      "coral": { bg: "#1a0a10", hues: [340, 20, 40, 60], sat: 75, light: 55 },
      "midnight": { bg: "#050508", hues: [240, 260, 280], sat: 60, light: 50 },
      "toxic": { bg: "#0a1a0a", hues: [80, 100, 120], sat: 90, light: 70 },
    };
    
    // Parameters
    const params = {
      populationSize: 150,
      mutationRate: 0.08,
      selectionPressure: 0.6,
      glowIntensity: 1.2,
      speed: 1.0,
      trailPersistence: 0.08,
      colorScheme: "deep-ocean",
      enableEvolution: true,
      foodRegeneration: 5,
    };
    
    // State
    let plankton = [];
    let food = [];
    let generation = 1;
    let avgFitness = 0;
    let time = 0;
    
    // Genome functions
    function randomGenome() {
      return {
        size: 2 + Math.random() * 6,
        hue: Math.random() * 360,
        glow: 0.5 + Math.random() * 1.5,
        speedFactor: 0.5 + Math.random(),
        sensorRange: 20 + Math.random() * 80,
        wobbleFreq: 0.001 + Math.random() * 0.009,
        wobbleAmp: 0.1 + Math.random() * 0.4,
        trailDecay: 0.9 + Math.random() * 0.09,
      };
    }
    
    function mutateGenome(genome) {
      const mutate = (val, min, max, scale = 0.1) => {
        if (Math.random() > params.mutationRate) return val;
        const delta = (Math.random() - 0.5) * scale * (max - min);
        return Math.max(min, Math.min(max, val + delta));
      };
      
      return {
        size: mutate(genome.size, 2, 8, 0.15),
        hue: (genome.hue + (Math.random() < params.mutationRate ? (Math.random() - 0.5) * 60 : 0) + 360) % 360,
        glow: mutate(genome.glow, 0.5, 2.0, 0.2),
        speedFactor: mutate(genome.speedFactor, 0.5, 1.5, 0.15),
        sensorRange: mutate(genome.sensorRange, 20, 100, 0.2),
        wobbleFreq: mutate(genome.wobbleFreq, 0.001, 0.01, 0.2),
        wobbleAmp: mutate(genome.wobbleAmp, 0.1, 0.5, 0.15),
        trailDecay: mutate(genome.trailDecay, 0.9, 0.99, 0.05),
      };
    }
    
    function crossoverGenome(parent1, parent2) {
      const pick = (a, b) => Math.random() < 0.5 ? a : b;
      return {
        size: pick(parent1.size, parent2.size),
        hue: pick(parent1.hue, parent2.hue),
        glow: pick(parent1.glow, parent2.glow),
        speedFactor: pick(parent1.speedFactor, parent2.speedFactor),
        sensorRange: pick(parent1.sensorRange, parent2.sensorRange),
        wobbleFreq: pick(parent1.wobbleFreq, parent2.wobbleFreq),
        wobbleAmp: pick(parent1.wobbleAmp, parent2.wobbleAmp),
        trailDecay: pick(parent1.trailDecay, parent2.trailDecay),
      };
    }
    
    // Initialize population
    function initPopulation() {
      plankton = [];
      for (let i = 0; i < params.populationSize; i++) {
        plankton.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          genome: randomGenome(),
          energy: 50 + Math.random() * 50,
          age: 0,
          fitness: 0,
          trail: [],
        });
      }
      generation = 1;
    }
    
    // Render loop
    function render() {
      const colors = COLOR_SCHEMES[params.colorScheme];
      time += 1;
      
      // Fade background
      ctx.fillStyle = colors.bg + Math.floor(params.trailPersistence * 255).toString(16).padStart(2, '0');
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Spawn food
      if (Math.random() < params.foodRegeneration * 0.01) {
        food.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          energy: 20 + Math.random() * 30,
          pulse: Math.random() * Math.PI * 2,
        });
      }
      if (food.length > 30) food.shift();
      
      // Update and render food
      food = food.filter(f => f.energy > 0);
      food.forEach(f => {
        f.pulse += 0.05;
        const pulseSize = 2 + Math.sin(f.pulse) * 1;
        const alpha = 0.3 + Math.sin(f.pulse) * 0.2;
        
        ctx.beginPath();
        ctx.arc(f.x, f.y, pulseSize, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 255, 200, ${alpha})`;
        ctx.fill();
      });
      
      // Process plankton
      const survivors = [];
      let totalFitness = 0;
      
      plankton.forEach(p => {
        p.age += 1;
        p.energy -= 0.1;
        
        // Find nearest food
        let nearestFood = null;
        let nearestDist = Infinity;
        food.forEach(f => {
          const dx = f.x - p.x;
          const dy = f.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < p.genome.sensorRange && dist < nearestDist) {
            nearestDist = dist;
            nearestFood = f;
          }
        });
        
        // Movement with wobble
        const wobble = Math.sin(time * p.genome.wobbleFreq + p.age * 0.01) * p.genome.wobbleAmp;
        
        if (nearestFood) {
          const dx = nearestFood.x - p.x;
          const dy = nearestFood.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          p.vx += (dx / dist) * 0.1 * params.speed;
          p.vy += (dy / dist) * 0.1 * params.speed;
          
          if (dist < p.genome.size + 3) {
            p.energy += nearestFood.energy * 0.5;
            nearestFood.energy = 0;
          }
        } else {
          p.vx += (Math.random() - 0.5) * 0.1 + Math.cos(wobble) * 0.05;
          p.vy += (Math.random() - 0.5) * 0.1 + Math.sin(wobble) * 0.05;
        }
        
        // Speed limit
        const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        const maxSpeed = 2 * p.genome.speedFactor * params.speed;
        if (speed > maxSpeed) {
          p.vx = (p.vx / speed) * maxSpeed;
          p.vy = (p.vy / speed) * maxSpeed;
        }
        
        // Update position
        p.x += p.vx;
        p.y += p.vy;
        
        // Wrap edges
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
        
        // Trail
        p.trail.push({ x: p.x, y: p.y, age: 0 });
        if (p.trail.length > 20) p.trail.shift();
        p.trail.forEach(t => { t.age += 1; });
        p.trail = p.trail.filter(t => t.age < 20);
        
        // Fitness
        p.fitness = p.energy + p.age * 0.01;
        totalFitness += p.fitness;
        
        if (p.energy > 0) {
          survivors.push(p);
        }
        
        // Render trail
        if (p.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(p.trail[0].x, p.trail[0].y);
          for (let i = 1; i < p.trail.length; i++) {
            ctx.lineTo(p.trail[i].x, p.trail[i].y);
          }
          const trailAlpha = (p.energy / 100) * 0.3 * params.glowIntensity;
          ctx.strokeStyle = `hsla(${p.genome.hue}, ${colors.sat}%, ${colors.light}%, ${trailAlpha})`;
          ctx.lineWidth = p.genome.size * 0.3;
          ctx.stroke();
        }
        
        // Render plankton
        const glowSize = p.genome.size * p.genome.glow * params.glowIntensity;
        const alpha = Math.min(1, p.energy / 50);
        
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowSize * 2);
        gradient.addColorStop(0, `hsla(${p.genome.hue}, ${colors.sat}%, ${colors.light + 20}%, ${alpha})`);
        gradient.addColorStop(0.5, `hsla(${p.genome.hue}, ${colors.sat}%, ${colors.light}%, ${alpha * 0.5})`);
        gradient.addColorStop(1, `hsla(${p.genome.hue}, ${colors.sat}%, ${colors.light}%, 0)`);
        
        ctx.beginPath();
        ctx.arc(p.x, p.y, glowSize * 2, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.genome.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.genome.hue}, ${colors.sat}%, ${colors.light + 30}%, ${alpha})`;
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(p.x - p.genome.size * 0.3, p.y - p.genome.size * 0.3, p.genome.size * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.genome.hue}, ${colors.sat}%, 90%, ${alpha * 0.8})`;
        ctx.fill();
      });
      
      // Evolution
      if (params.enableEvolution && survivors.length > 0) {
        avgFitness = totalFitness / plankton.length;
        
        if (survivors.length < params.populationSize * 0.7) {
          generation++;
          
          survivors.sort((a, b) => b.fitness - a.fitness);
          const parentCount = Math.max(2, Math.floor(survivors.length * params.selectionPressure));
          const parents = survivors.slice(0, parentCount);
          
          const newPlankton = [...survivors];
          
          while (newPlankton.length < params.populationSize) {
            const parent1 = parents[Math.floor(Math.random() * parents.length)];
            const parent2 = parents[Math.floor(Math.random() * parents.length)];
            const childGenome = mutateGenome(crossoverGenome(parent1.genome, parent2.genome));
            
            newPlankton.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              vx: (Math.random() - 0.5) * 2,
              vy: (Math.random() - 0.5) * 2,
              genome: childGenome,
              energy: 50 + Math.random() * 50,
              age: 0,
              fitness: 0,
              trail: [],
            });
          }
          
          plankton = newPlankton;
        } else {
          plankton = survivors;
        }
      } else {
        plankton = survivors;
        while (plankton.length < params.populationSize) {
          plankton.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            genome: randomGenome(),
            energy: 50 + Math.random() * 50,
            age: 0,
            fitness: 0,
            trail: [],
          });
        }
      }
      
      // Update stats
      document.getElementById('gen').textContent = generation;
      document.getElementById('pop').textContent = plankton.length;
      document.getElementById('fit').textContent = avgFitness.toFixed(1);
      
      requestAnimationFrame(render);
    }
    
    // Event listeners
    document.getElementById('populationSize').addEventListener('input', (e) => {
      params.populationSize = parseInt(e.target.value);
      document.getElementById('popVal').textContent = params.populationSize;
    });
    
    document.getElementById('mutationRate').addEventListener('input', (e) => {
      params.mutationRate = parseInt(e.target.value) / 100;
      document.getElementById('mutVal').textContent = params.mutationRate.toFixed(2);
    });
    
    document.getElementById('selectionPressure').addEventListener('input', (e) => {
      params.selectionPressure = parseInt(e.target.value) / 100;
      document.getElementById('selVal').textContent = params.selectionPressure.toFixed(1);
    });
    
    document.getElementById('glowIntensity').addEventListener('input', (e) => {
      params.glowIntensity = parseInt(e.target.value) / 10;
      document.getElementById('glowVal').textContent = params.glowIntensity.toFixed(1);
    });
    
    document.getElementById('speed').addEventListener('input', (e) => {
      params.speed = parseInt(e.target.value) / 10;
      document.getElementById('speedVal').textContent = params.speed.toFixed(1);
    });
    
    document.getElementById('colorScheme').addEventListener('change', (e) => {
      params.colorScheme = e.target.value;
    });
    
    document.getElementById('enableEvolution').addEventListener('change', (e) => {
      params.enableEvolution = e.target.checked;
    });
    
    // Start
    initPopulation();
    render();
  </script>
</body>
</html>
