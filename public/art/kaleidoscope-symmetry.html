<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaleidoscope Symmetry — Generative Art</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    
    .subtitle {
      color: #888;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    
    .canvas-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      background: #000;
    }
    
    canvas {
      display: block;
      width: 400px;
      height: 400px;
    }
    
    .controls {
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      max-width: 400px;
      width: 100%;
    }
    
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    
    .control-group.full-width {
      grid-column: 1 / -1;
    }
    
    label {
      font-size: 0.8rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    input[type="range"] {
      width: 100%;
      accent-color: #a855f7;
    }
    
    select {
      padding: 0.4rem;
      background: #1a1a1a;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    
    .value {
      font-size: 0.8rem;
      color: #a855f7;
      text-align: right;
    }
    
    .buttons {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    button {
      padding: 0.6rem 1.2rem;
      background: #1a1a1a;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    
    button:hover {
      background: #252525;
      border-color: #a855f7;
    }
    
    button.primary {
      background: #a855f7;
      color: white;
      border-color: #a855f7;
    }
    
    button.primary:hover {
      background: #9333ea;
    }
  </style>
</head>
<body>
  <h1>🌀 Kaleidoscope Symmetry</h1>
  <p class="subtitle">Recursive mirrored patterns with rotational symmetry</p>
  
  <div class="canvas-container">
    <canvas id="canvas" width="400" height="400"></canvas>
  </div>
  
  <div class="controls">
    <div class="control-group">
      <label>Symmetry Segments</label>
      <input type="range" id="segments" min="3" max="16" value="8">
      <span class="value" id="segmentsValue">8</span>
    </div>
    
    <div class="control-group">
      <label>Pattern Layers</label>
      <input type="range" id="layers" min="1" max="8" value="4">
      <span class="value" id="layersValue">4</span>
    </div>
    
    <div class="control-group">
      <label>Complexity</label>
      <input type="range" id="complexity" min="10" max="100" step="10" value="40">
      <span class="value" id="complexityValue">40</span>
    </div>
    
    <div class="control-group">
      <label>Color Shift</label>
      <input type="range" id="colorShift" min="0" max="360" step="15" value="0">
      <span class="value" id="colorShiftValue">0°</span>
    </div>
    
    <div class="control-group full-width">
      <label>Mirror Mode</label>
      <select id="mirrorMode">
        <option value="reflect">Reflect</option>
        <option value="rotate">Rotate</option>
        <option value="both" selected>Both</option>
      </select>
    </div>
    
    <div class="control-group">
      <label>Seed</label>
      <input type="range" id="seed" min="1" max="10000" value="1">
      <span class="value" id="seedValue">1</span>
    </div>
  </div>
  
  <div class="buttons">
    <button id="randomize" class="primary">🎲 Randomize</button>
    <button id="download">💾 Download PNG</button>
  </div>

  <script>
    // Seeded Random Number Generator
    class SeededRandom {
      constructor(seed) {
        this.seed = seed;
      }
      
      next() {
        this.seed = (this.seed * 9301 + 49297) % 233280;
        return this.seed / 233280;
      }
      
      range(min, max) {
        return min + this.next() * (max - min);
      }
    }

    // Seeded Noise Function
    function createSeededNoise(seed) {
      const rng = new SeededRandom(seed);
      const perm = new Array(512);
      for (let i = 0; i < 256; i++) perm[i] = i;
      for (let i = 255; i > 0; i--) {
        const j = Math.floor(rng.next() * (i + 1));
        [perm[i], perm[j]] = [perm[j], perm[i]];
      }
      for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];

      return function(x, y) {
        const X = Math.floor(x) & 255;
        const Y = Math.floor(y) & 255;
        x -= Math.floor(x);
        y -= Math.floor(y);
        const u = fade(x);
        const v = fade(y);
        const A = perm[X] + Y, B = perm[X + 1] + Y;
        return lerp(v, lerp(u, grad(perm[A], x, y), grad(perm[B], x - 1, y)),
                       lerp(u, grad(perm[A + 1], x, y - 1), grad(perm[B + 1], x - 1, y - 1)));
      };
    }

    function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    function lerp(t, a, b) { return a + t * (b - a); }
    function grad(hash, x, y) {
      const h = hash & 15;
      const u = h < 8 ? x : y;
      const v = h < 4 ? y : h === 12 || h === 14 ? x : 0;
      return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
    }

    // Canvas setup
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Parameters
    const params = {
      segments: 8,
      layers: 4,
      complexity: 40,
      colorShift: 0,
      mirrorMode: 'both',
      seed: 1
    };
    
    let time = 0;
    let animationId;
    
    // Controls
    const controls = {
      segments: document.getElementById('segments'),
      layers: document.getElementById('layers'),
      complexity: document.getElementById('complexity'),
      colorShift: document.getElementById('colorShift'),
      mirrorMode: document.getElementById('mirrorMode'),
      seed: document.getElementById('seed')
    };
    
    const valueLabels = {
      segments: document.getElementById('segmentsValue'),
      layers: document.getElementById('layersValue'),
      complexity: document.getElementById('complexityValue'),
      colorShift: document.getElementById('colorShiftValue'),
      seed: document.getElementById('seedValue')
    };
    
    // Update parameter from control
    function updateParam(key, value) {
      params[key] = key === 'mirrorMode' ? value : parseInt(value);
      if (valueLabels[key]) {
        valueLabels[key].textContent = key === 'colorShift' ? value + '°' : value;
      }
    }
    
    // Add listeners
    Object.keys(controls).forEach(key => {
      controls[key].addEventListener('input', (e) => {
        updateParam(key, e.target.value);
      });
    });
    
    // Randomize button
    document.getElementById('randomize').addEventListener('click', () => {
      controls.segments.value = 3 + Math.floor(Math.random() * 14);
      controls.layers.value = 1 + Math.floor(Math.random() * 8);
      controls.complexity.value = 10 + Math.floor(Math.random() * 10) * 10;
      controls.colorShift.value = Math.floor(Math.random() * 25) * 15;
      controls.seed.value = 1 + Math.floor(Math.random() * 10000);
      
      updateParam('segments', controls.segments.value);
      updateParam('layers', controls.layers.value);
      updateParam('complexity', controls.complexity.value);
      updateParam('colorShift', controls.colorShift.value);
      updateParam('seed', controls.seed.value);
    });
    
    // Download button
    document.getElementById('download').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `kaleidoscope-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
    
    // Main draw function
    function draw() {
      const { segments, layers, complexity, colorShift, mirrorMode, seed } = params;
      
      // Initialize seeded RNG
      const rng = new SeededRandom(seed);
      
      // Dark background with subtle gradient
      const gradient = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 0,
        canvas.width / 2, canvas.height / 2, canvas.width / 2
      );
      gradient.addColorStop(0, '#1a0a2e');
      gradient.addColorStop(0.5, '#0a0a1a');
      gradient.addColorStop(1, '#000000');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const maxRadius = Math.min(cx, cy) * 0.9;
      const noise = createSeededNoise(seed);
      const t = time * 0.0003;
      
      // Draw symmetry segments
      const segmentAngle = (Math.PI * 2) / segments;
      
      for (let layer = 0; layer < layers; layer++) {
        const layerRadius = (maxRadius * (layer + 1)) / layers;
        const layerOffset = layer * 0.5;
        
        for (let i = 0; i < complexity; i++) {
          const progress = i / complexity;
          const radius = layerRadius * (0.2 + progress * 0.8);
          
          // Generate organic shape points
          const points = [];
          
          for (let a = 0; a <= segmentAngle; a += 0.05) {
            // Add noise-based variation
            const noiseVal = noise(
              Math.cos(a) * 2 + layerOffset + t,
              Math.sin(a) * 2 + layer * 0.3
            );
            
            const r = radius * (0.8 + noiseVal * 0.4);
            const x = Math.cos(a) * r;
            const y = Math.sin(a) * r;
            
            points.push({
              x,
              y,
              size: 2 + Math.abs(noiseVal) * 4,
              alpha: 0.3 + Math.abs(noiseVal) * 0.5
            });
          }
          
          // Draw for each symmetry segment
          for (let seg = 0; seg < segments; seg++) {
            const rotation = seg * segmentAngle + t * (layer % 2 === 0 ? 1 : -1);
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotation);
            
            // Color based on segment and layer
            const hue = (colorShift + seg * (360 / segments) + layer * 30) % 360;
            const saturation = 60 + (layer / layers) * 30;
            const lightness = 40 + (i / complexity) * 30;
            
            // Draw the shape
            ctx.beginPath();
            ctx.moveTo(points[0]?.x || 0, points[0]?.y || 0);
            
            for (let p = 1; p < points.length; p++) {
              const point = points[p];
              ctx.lineTo(point.x, point.y);
            }
            
            ctx.strokeStyle = `hsla(${hue}, ${saturation}%, ${lightness}%, 0.6)`;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            
            // Fill with gradient
            const fillGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, layerRadius);
            fillGradient.addColorStop(0, `hsla(${hue}, ${saturation}%, ${lightness}%, 0.1)`);
            fillGradient.addColorStop(1, `hsla(${hue}, ${saturation}%, ${lightness}%, 0)`);
            ctx.fillStyle = fillGradient;
            ctx.fill();
            
            // Mirror reflection if enabled
            if (mirrorMode === 'reflect' || mirrorMode === 'both') {
              ctx.save();
              ctx.scale(1, -1);
              
              ctx.beginPath();
              ctx.moveTo(points[0]?.x || 0, points[0]?.y || 0);
              for (let p = 1; p < points.length; p++) {
                const point = points[p];
                ctx.lineTo(point.x, point.y);
              }
              ctx.strokeStyle = `hsla(${hue}, ${saturation}%, ${lightness + 10}%, 0.4)`;
              ctx.lineWidth = 1;
              ctx.stroke();
              ctx.restore();
            }
            
            // Draw decorative dots at key points
            for (let p = 0; p < points.length; p += 3) {
              const point = points[p];
              ctx.beginPath();
              ctx.arc(point.x, point.y, point.size * 0.5, 0, Math.PI * 2);
              ctx.fillStyle = `hsla(${hue}, 80%, 70%, ${point.alpha * 0.8})`;
              ctx.fill();
            }
            
            ctx.restore();
          }
        }
      }
      
      // Add central glow
      const glowGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxRadius * 0.3);
      glowGradient.addColorStop(0, 'rgba(255, 255, 255, 0.1)');
      glowGradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.02)');
      glowGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = glowGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Outer decorative ring
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.lineWidth = 1;
      for (let r = maxRadius * 0.8; r <= maxRadius; r += 10) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    
    // Animation loop
    function animate() {
      time += 16;
      draw();
      animationId = requestAnimationFrame(animate);
    }
    
    // Start
    animate();
  </script>
</body>
</html>
