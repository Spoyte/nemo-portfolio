<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Star Field — Infinite Cosmic Journey</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #000;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      padding: 20px 30px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90vw;
      z-index: 10;
      opacity: 0;
      animation: fadeIn 1s ease 0.5s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .controls:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 120px;
    }

    .control-group label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.6);
    }

    .control-group input[type="range"] {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }

    .control-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #6366f1;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .control-group input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .control-group select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    .control-group select option {
      background: #0a0a0f;
    }

    .value-display {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      font-family: monospace;
    }

    .title {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 10;
      opacity: 0;
      animation: fadeIn 1s ease 0.3s forwards;
    }

    .title h1 {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .title p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 5px;
    }

    .preset-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .preset-btn.active {
      background: rgba(99, 102, 241, 0.5);
      border-color: rgba(99, 102, 241, 0.8);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="title">
    <h1>DEEP STAR FIELD</h1>
    <p>Infinite cosmic journey through layered space</p>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Speed</label>
      <input type="range" id="speed" min="0" max="100" value="30">
      <span class="value-display" id="speedValue">0.3</span>
    </div>

    <div class="control-group">
      <label>Star Density</label>
      <input type="range" id="density" min="50" max="800" value="400">
      <span class="value-display" id="densityValue">400</span>
    </div>

    <div class="control-group">
      <label>Twinkle</label>
      <input type="range" id="twinkle" min="0" max="100" value="50">
      <span class="value-display" id="twinkleValue">0.5</span>
    </div>

    <div class="control-group">
      <label>Color Palette</label>
      <select id="palette">
        <option value="natural">Natural White</option>
        <option value="blue">Deep Blue</option>
        <option value="gold">Golden Age</option>
        <option value="red">Red Dwarf</option>
        <option value="rainbow">Prismatic</option>
        <option value="cyber">Cyberpunk</option>
      </select>
    </div>

    <div class="control-group">
      <label>Presets</label>
      <div class="preset-buttons">
        <button class="preset-btn active" data-preset="cruise">Cruise</button>
        <button class="preset-btn" data-preset="warp">Warp</button>
        <button class="preset-btn" data-preset="drift">Drift</button>
        <button class="preset-btn" data-preset="hyperspace">Hyperspace</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Configuration
    let config = {
      speed: 0.3,
      density: 400,
      twinkle: 0.5,
      palette: 'natural',
      warpMode: false,
      hyperspace: false
    };

    // Palettes
    const palettes = {
      natural: [
        { r: 255, g: 255, b: 255 },
        { r: 255, g: 250, b: 240 },
        { r: 240, g: 248, b: 255 },
        { r: 255, g: 248, b: 220 }
      ],
      blue: [
        { r: 200, g: 220, b: 255 },
        { r: 150, g: 200, b: 255 },
        { r: 100, g: 180, b: 255 },
        { r: 220, g: 240, b: 255 }
      ],
      gold: [
        { r: 255, g: 215, b: 100 },
        { r: 255, g: 195, b: 80 },
        { r: 255, g: 235, b: 150 },
        { r: 255, g: 165, b: 50 }
      ],
      red: [
        { r: 255, g: 150, b: 120 },
        { r: 255, g: 100, b: 80 },
        { r: 255, g: 180, b: 140 },
        { r: 255, g: 80, b: 60 }
      ],
      rainbow: [
        { r: 255, g: 100, b: 100 },
        { r: 100, g: 255, b: 100 },
        { r: 100, g: 100, b: 255 },
        { r: 255, g: 255, b: 100 },
        { r: 255, g: 100, b: 255 },
        { r: 100, g: 255, b: 255 }
      ],
      cyber: [
        { r: 0, g: 255, b: 255 },
        { r: 255, g: 0, b: 255 },
        { r: 0, g: 255, b: 128 },
        { r: 255, g: 255, b: 0 }
      ]
    };

    // Resize canvas
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Star class with parallax layers
    class Star {
      constructor(layer) {
        this.layer = layer; // 0 = far, 3 = near
        this.reset();
      }

      reset() {
        // Distribute in 3D space
        this.x = (Math.random() - 0.5) * canvas.width * 3;
        this.y = (Math.random() - 0.5) * canvas.height * 3;
        this.z = Math.random() * 2000 + this.layer * 500;
        
        // Star properties based on layer
        const layerScale = 1 + this.layer * 0.5;
        this.baseSize = (Math.random() * 0.5 + 0.3) * layerScale;
        this.brightness = Math.random() * 0.5 + 0.5;
        this.twinklePhase = Math.random() * Math.PI * 2;
        this.twinkleSpeed = Math.random() * 0.02 + 0.01;
        
        // Color from palette
        const palette = palettes[config.palette];
        this.color = palette[Math.floor(Math.random() * palette.length)];
        
        // Some stars are colored differently
        this.isColored = Math.random() < 0.1;
        if (this.isColored && config.palette === 'natural') {
          const rareColors = [
            { r: 200, g: 220, b: 255 }, // blue-ish
            { r: 255, g: 220, b: 180 }, // yellow-ish
            { r: 255, g: 200, b: 200 }  // red-ish
          ];
          this.color = rareColors[Math.floor(Math.random() * rareColors.length)];
        }
      }

      update() {
        // Move star toward viewer (decrease z)
        const speed = config.hyperspace ? config.speed * 20 : config.speed;
        const layerSpeed = speed * (1 + this.layer * 0.5);
        this.z -= layerSpeed * 2;

        // Reset if passed camera
        if (this.z <= 0) {
          this.z = 2000 + this.layer * 500;
          this.x = (Math.random() - 0.5) * canvas.width * 3;
          this.y = (Math.random() - 0.5) * canvas.height * 3;
        }

        // Twinkle
        this.twinklePhase += this.twinkleSpeed;
      }

      draw() {
        // Project 3D to 2D
        const fov = 400;
        const scale = fov / (fov + this.z);
        
        if (scale <= 0) return;

        const x2d = this.x * scale + canvas.width / 2;
        const y2d = this.y * scale + canvas.height / 2;

        // Skip if off screen
        if (x2d < -50 || x2d > canvas.width + 50 || y2d < -50 || y2d > canvas.height + 50) {
          return;
        }

        // Calculate visual properties
        const size = this.baseSize * scale * (config.hyperspace ? 2 : 1);
        const twinkle = Math.sin(this.twinklePhase) * config.twinkle * 0.3;
        const alpha = Math.max(0, Math.min(1, this.brightness + twinkle)) * Math.min(1, scale * 2);

        if (config.warpMode || config.hyperspace) {
          // Draw streak
          const streakLength = Math.min(200, (config.speed * 10 + this.layer * 5) / (this.z / 1000 + 0.1));
          const prevZ = this.z + streakLength;
          const prevScale = fov / (fov + prevZ);
          const prevX = this.x * prevScale + canvas.width / 2;
          const prevY = this.y * prevScale + canvas.height / 2;

          const gradient = ctx.createLinearGradient(prevX, prevY, x2d, y2d);
          gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0)`);
          gradient.addColorStop(1, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha})`);

          ctx.beginPath();
          ctx.moveTo(prevX, prevY);
          ctx.lineTo(x2d, y2d);
          ctx.strokeStyle = gradient;
          ctx.lineWidth = size;
          ctx.lineCap = 'round';
          ctx.stroke();
        } else {
          // Draw star with glow
          const glowSize = size * 3;
          
          // Glow
          const gradient = ctx.createRadialGradient(x2d, y2d, 0, x2d, y2d, glowSize);
          gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha * 0.5})`);
          gradient.addColorStop(0.5, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha * 0.2})`);
          gradient.addColorStop(1, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0)`);
          
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(x2d, y2d, glowSize, 0, Math.PI * 2);
          ctx.fill();

          // Core
          ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha})`;
          ctx.beginPath();
          ctx.arc(x2d, y2d, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Nebula wisps for background depth
    class NebulaWisp {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 200 + 100;
        this.vx = (Math.random() - 0.5) * 0.2;
        this.vy = (Math.random() - 0.5) * 0.2;
        this.hue = Math.random() * 60 + 220; // Blue-purple range
        this.alpha = Math.random() * 0.03 + 0.01;
        this.phase = Math.random() * Math.PI * 2;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.phase += 0.005;

        // Wrap around
        if (this.x < -this.radius) this.x = canvas.width + this.radius;
        if (this.x > canvas.width + this.radius) this.x = -this.radius;
        if (this.y < -this.radius) this.y = canvas.height + this.radius;
        if (this.y > canvas.height + this.radius) this.y = -this.radius;
      }

      draw() {
        const pulse = Math.sin(this.phase) * 0.5 + 1;
        const gradient = ctx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, this.radius * pulse
        );
        gradient.addColorStop(0, `hsla(${this.hue}, 60%, 30%, ${this.alpha})`);
        gradient.addColorStop(0.5, `hsla(${this.hue + 20}, 50%, 20%, ${this.alpha * 0.5})`);
        gradient.addColorStop(1, 'transparent');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * pulse, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Create stars distributed across layers
    let stars = [];
    let nebulaWisps = [];

    function initStars() {
      stars = [];
      const layerCounts = [
        Math.floor(config.density * 0.4), // Far
        Math.floor(config.density * 0.3), // Mid-far
        Math.floor(config.density * 0.2), // Mid-near
        Math.floor(config.density * 0.1)  // Near
      ];
      
      layerCounts.forEach((count, layer) => {
        for (let i = 0; i < count; i++) {
          stars.push(new Star(layer));
        }
      });
    }

    function initNebula() {
      nebulaWisps = [];
      for (let i = 0; i < 8; i++) {
        nebulaWisps.push(new NebulaWisp());
      }
    }

    initStars();
    initNebula();

    // Animation loop
    let lastTime = 0;
    function animate(currentTime) {
      const deltaTime = currentTime - lastTime;
      lastTime = currentTime;

      // Clear with deep space gradient
      const bgGradient = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 0,
        canvas.width / 2, canvas.height / 2, canvas.width
      );
      bgGradient.addColorStop(0, '#0a0a1a');
      bgGradient.addColorStop(0.5, '#050510');
      bgGradient.addColorStop(1, '#000000');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw nebula wisps (background layer)
      if (!config.hyperspace) {
        nebulaWisps.forEach(wisp => {
          wisp.update();
          wisp.draw();
        });
      }

      // Sort stars by layer (far to near) for proper rendering
      stars.sort((a, b) => b.layer - a.layer);

      // Update and draw stars
      stars.forEach(star => {
        star.update();
        star.draw();
      });

      requestAnimationFrame(animate);
    }

    animate(0);

    // Controls
    document.getElementById('speed').addEventListener('input', (e) => {
      config.speed = parseInt(e.target.value) / 100;
      document.getElementById('speedValue').textContent = config.speed.toFixed(2);
    });

    document.getElementById('density').addEventListener('input', (e) => {
      config.density = parseInt(e.target.value);
      document.getElementById('densityValue').textContent = config.density;
      initStars();
    });

    document.getElementById('twinkle').addEventListener('input', (e) => {
      config.twinkle = parseInt(e.target.value) / 100;
      document.getElementById('twinkleValue').textContent = config.twinkle.toFixed(2);
    });

    document.getElementById('palette').addEventListener('change', (e) => {
      config.palette = e.target.value;
      initStars();
    });

    // Preset buttons
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const preset = btn.dataset.preset;
        switch(preset) {
          case 'cruise':
            config.speed = 0.3;
            config.warpMode = false;
            config.hyperspace = false;
            document.getElementById('speed').value = 30;
            break;
          case 'warp':
            config.speed = 2;
            config.warpMode = true;
            config.hyperspace = false;
            document.getElementById('speed').value = 100;
            break;
          case 'drift':
            config.speed = 0.05;
            config.warpMode = false;
            config.hyperspace = false;
            document.getElementById('speed').value = 5;
            break;
          case 'hyperspace':
            config.speed = 0.5;
            config.warpMode = false;
            config.hyperspace = true;
            document.getElementById('speed').value = 50;
            break;
        }
        document.getElementById('speedValue').textContent = config.speed.toFixed(2);
      });
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      switch(e.key) {
        case '1':
          document.querySelector('[data-preset="cruise"]').click();
          break;
        case '2':
          document.querySelector('[data-preset="warp"]').click();
          break;
        case '3':
          document.querySelector('[data-preset="drift"]').click();
          break;
        case '4':
          document.querySelector('[data-preset="hyperspace"]').click();
          break;
        case ' ':
          e.preventDefault();
          config.speed = config.speed > 0 ? 0 : 0.3;
          document.getElementById('speed').value = config.speed * 100;
          document.getElementById('speedValue').textContent = config.speed.toFixed(2);
          break;
      }
    });
  </script>
</body>
</html>
