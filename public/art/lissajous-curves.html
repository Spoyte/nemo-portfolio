<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lissajous Curves</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    h1 {
      margin-bottom: 10px;
      font-size: 1.5rem;
      font-weight: 500;
    }
    
    .subtitle {
      color: #888;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    
    canvas {
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      max-width: 100%;
      height: auto;
    }
    
    .controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      max-width: 600px;
    }
    
    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    
    label {
      font-size: 0.8rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input[type="range"] {
      width: 120px;
    }
    
    .color-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    button {
      padding: 6px 14px;
      border: 1px solid #444;
      background: #1a1a1a;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    
    button:hover {
      background: #2a2a2a;
      border-color: #666;
    }
    
    button.active {
      background: #333;
      border-color: #888;
    }
    
    .value-display {
      font-size: 0.75rem;
      color: #666;
      min-width: 30px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Lissajous Curves</h1>
  <p class="subtitle">Harmonic motion patterns from parametric equations</p>
  
  <canvas id="canvas" width="400" height="400"></canvas>
  
  <div class="controls">
    <div class="control-group">
      <label>Speed</label>
      <input type="range" id="speed" min="5" max="100" value="30">
      <span class="value-display" id="speedValue">30</span>
    </div>
    
    <div class="control-group">
      <label>Freq X</label>
      <input type="range" id="freqX" min="1" max="10" value="3">
      <span class="value-display" id="freqXValue">3</span>
    </div>
    
    <div class="control-group">
      <label>Freq Y</label>
      <input type="range" id="freqY" min="1" max="10" value="4">
      <span class="value-display" id="freqYValue">4</span>
    </div>
    
    <div class="control-group">
      <label>Phase</label>
      <input type="range" id="phase" min="0" max="100" value="0">
      <span class="value-display" id="phaseValue">0</span>
    </div>
  </div>
  
  <div class="controls">
    <div class="control-group">
      <label>Color Scheme</label>
      <div class="color-buttons">
        <button class="active" data-color="ocean">Ocean</button>
        <button data-color="sunset">Sunset</button>
        <button data-color="forest">Forest</button>
        <button data-color="neon">Neon</button>
        <button data-color="gold">Gold</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Parameters
    let speed = 30;
    let frequencyX = 3;
    let frequencyY = 4;
    let phaseShift = 0;
    let colorScheme = 'ocean';
    
    // Color palettes
    const palettes = {
      ocean: [[0, 50, 100], [0, 100, 180], [50, 150, 220], [100, 200, 255]],
      sunset: [[120, 20, 60], [220, 80, 40], [255, 140, 60], [255, 220, 120]],
      forest: [[20, 60, 20], [40, 120, 40], [80, 180, 80], [150, 240, 120]],
      neon: [[100, 0, 150], [200, 0, 200], [255, 50, 150], [255, 150, 200]],
      gold: [[60, 40, 10], [140, 100, 20], [220, 180, 40], [255, 230, 100]],
    };
    
    function render(time) {
      const t = time * speed * 0.001;
      const width = canvas.width;
      const height = canvas.height;
      const centerX = width / 2;
      const centerY = height / 2;
      const scale = Math.min(width, height) * 0.38;
      
      // Semi-transparent clear for trail effect
      ctx.fillStyle = 'rgba(10, 10, 10, 0.15)';
      ctx.fillRect(0, 0, width, height);
      
      const palette = palettes[colorScheme];
      const numCurves = 5;
      
      for (let c = 0; c < numCurves; c++) {
        const phaseOffset = (c / numCurves) * Math.PI * 2 + phaseShift * 0.01;
        const color = palette[c % palette.length];
        
        ctx.beginPath();
        ctx.strokeStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${0.6 + c * 0.1})`;
        ctx.lineWidth = 2;
        
        const steps = 200;
        let firstPoint = true;
        
        for (let i = 0; i <= steps; i++) {
          const theta = (i / steps) * Math.PI * 2;
          const x = centerX + scale * Math.sin(frequencyX * theta + t + phaseOffset);
          const y = centerY + scale * Math.sin(frequencyY * theta + t * 0.7 + phaseOffset);
          
          if (firstPoint) {
            ctx.moveTo(x, y);
            firstPoint = false;
          } else {
            ctx.lineTo(x, y);
          }
        }
        
        ctx.closePath();
        ctx.stroke();
        
        // Draw glowing orb
        const currentTheta = t % (Math.PI * 2);
        const orbX = centerX + scale * Math.sin(frequencyX * currentTheta + t + phaseOffset);
        const orbY = centerY + scale * Math.sin(frequencyY * currentTheta + t * 0.7 + phaseOffset);
        
        const gradient = ctx.createRadialGradient(orbX, orbY, 0, orbX, orbY, 8);
        gradient.addColorStop(0, `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.9)`);
        gradient.addColorStop(0.5, `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.3)`);
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(orbX, orbY, 8, 0, Math.PI * 2);
        ctx.fill();
      }
      
      // Interference lines
      ctx.globalCompositeOperation = 'screen';
      ctx.strokeStyle = `rgba(${palette[2][0]}, ${palette[2][1]}, ${palette[2][2]}, 0.1)`;
      ctx.lineWidth = 0.5;
      
      for (let i = 0; i < 20; i++) {
        const theta = (i / 20) * Math.PI * 2 + t * 0.3;
        const x1 = centerX + scale * Math.sin(frequencyX * theta + t);
        const y1 = centerY + scale * Math.sin(frequencyY * theta + t * 0.7);
        const x2 = centerX + scale * Math.sin(frequencyX * theta + t + Math.PI);
        const y2 = centerY + scale * Math.sin(frequencyY * theta + t * 0.7 + Math.PI);
        
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      
      ctx.globalCompositeOperation = 'source-over';
      
      requestAnimationFrame(render);
    }
    
    // Event listeners
    document.getElementById('speed').addEventListener('input', (e) => {
      speed = parseInt(e.target.value);
      document.getElementById('speedValue').textContent = speed;
    });
    
    document.getElementById('freqX').addEventListener('input', (e) => {
      frequencyX = parseInt(e.target.value);
      document.getElementById('freqXValue').textContent = frequencyX;
    });
    
    document.getElementById('freqY').addEventListener('input', (e) => {
      frequencyY = parseInt(e.target.value);
      document.getElementById('freqYValue').textContent = frequencyY;
    });
    
    document.getElementById('phase').addEventListener('input', (e) => {
      phaseShift = parseInt(e.target.value);
      document.getElementById('phaseValue').textContent = phaseShift;
    });
    
    document.querySelectorAll('.color-buttons button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-buttons button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        colorScheme = btn.dataset.color;
      });
    });
    
    // Start
    requestAnimationFrame(render);
  </script>
</body>
</html>
