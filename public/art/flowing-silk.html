<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowing Silk — Generative Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'SF Mono', Monaco, monospace;
            overflow: hidden;
        }

        canvas {
            box-shadow: 
                0 0 60px rgba(200, 180, 160, 0.1),
                0 0 120px rgba(200, 180, 160, 0.05);
            border-radius: 4px;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
        }

        button, select {
            background: rgba(20, 30, 40, 0.9);
            border: 1px solid rgba(200, 180, 160, 0.3);
            color: #c8c0a0;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            font-family: 'SF Mono', Monaco, monospace;
        }

        button:hover, select:hover {
            background: rgba(40, 50, 60, 0.9);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(200, 180, 160, 0.15);
        }

        button.active {
            background: rgba(200, 180, 160, 0.2);
            border-color: rgba(200, 180, 160, 0.6);
            color: #f0e8d0;
        }

        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(200, 180, 160, 0.6);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(200, 180, 160, 0.8);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .param-controls {
            position: fixed;
            top: 60px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .param-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(200, 180, 160, 0.7);
            font-size: 11px;
        }

        input[type="range"] {
            width: 120px;
            accent-color: #c8c0a0;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">Flowing Silk — Generative Art</div>
    <div class="status" id="status">Digital fabric in motion</div>
    
    <div class="param-controls">
        <div class="param-row">
            <label>Threads</label>
            <input type="range" id="threadCount" min="20" max="100" value="50" step="10">
        </div>
        <div class="param-row">
            <label>Speed</label>
            <input type="range" id="flowSpeed" min="0" max="100" value="30" step="5">
        </div>
        <div class="param-row">
            <label>Turbulence</label>
            <input type="range" id="turbulence" min="0" max="100" value="40" step="10">
        </div>
        <div class="param-row">
            <label>Wave Height</label>
            <input type="range" id="waveAmplitude" min="10" max="100" value="50" step="10">
        </div>
        <div class="param-row">
            <label>Sheen</label>
            <input type="range" id="sheenIntensity" min="0" max="100" value="70" step="10">
        </div>
    </div>

    <div class="controls">
        <select id="colorScheme">
            <option value="pearl">Pearl</option>
            <option value="midnight">Midnight</option>
            <option value="rose">Rose</option>
            <option value="emerald">Emerald</option>
            <option value="gold">Gold</option>
            <option value="obsidian">Obsidian</option>
        </select>
        <button onclick="regenerate()">New Pattern</button>
        <button onclick="togglePause()" id="pauseBtn">Pause</button>
        <button onclick="clearCanvas()">Clear</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        const size = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.8, 800);
        canvas.width = size;
        canvas.height = size;
        
        // Animation state
        let isRunning = true;
        let animationId = null;
        let time = 0;
        
        // Color schemes
        const COLOR_SCHEMES = {
            pearl: {
                base: "#e8e4dc",
                highlight: "#ffffff",
                shadow: "#b8b0a0",
                sheen: "rgba(255, 255, 255, 0.6)",
                bg: "#1a1a1f"
            },
            midnight: {
                base: "#2a3a5a",
                highlight: "#4a6a9a",
                shadow: "#1a2535",
                sheen: "rgba(100, 150, 200, 0.5)",
                bg: "#0a0a10"
            },
            rose: {
                base: "#c4a0a0",
                highlight: "#f0d0d0",
                shadow: "#8a6060",
                sheen: "rgba(255, 200, 200, 0.5)",
                bg: "#1a1010"
            },
            emerald: {
                base: "#4a8a6a",
                highlight: "#7ac49a",
                shadow: "#2a4a3a",
                sheen: "rgba(150, 255, 180, 0.4)",
                bg: "#0a1510"
            },
            gold: {
                base: "#c4a45a",
                highlight: "#ffe080",
                shadow: "#8a7030",
                sheen: "rgba(255, 220, 120, 0.5)",
                bg: "#1a1508"
            },
            obsidian: {
                base: "#3a3a3a",
                highlight: "#5a5a5a",
                shadow: "#1a1a1a",
                sheen: "rgba(100, 100, 100, 0.4)",
                bg: "#050505"
            }
        };
        
        // Parameters
        let params = {
            silkColor: "pearl",
            threadCount: 50,
            flowSpeed: 30,
            turbulence: 40,
            waveAmplitude: 50,
            sheenIntensity: 70
        };
        
        // Simplex-like noise
        const perm = [];
        for (let i = 0; i < 256; i++) perm[i] = Math.floor(Math.random() * 256);
        for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];
        
        function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        function lerp(t, a, b) { return a + t * (b - a); }
        function grad(hash, x, y) {
            const h = hash & 15;
            const u = h < 8 ? x : y;
            const v = h < 4 ? y : h === 12 || h === 14 ? x : 0;
            return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
        }
        
        function noise(x, y) {
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;
            x -= Math.floor(x);
            y -= Math.floor(y);
            const u = fade(x);
            const v = fade(y);
            const A = perm[X] + Y;
            const B = perm[X + 1] + Y;
            
            return lerp(
                v,
                lerp(u, grad(perm[A], x, y), grad(perm[B], x - 1, y)),
                lerp(u, grad(perm[A + 1], x, y - 1), grad(perm[B + 1], x - 1, y - 1))
            );
        }
        
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }
        
        function lerpColor(c1, c2, t) {
            const rgb1 = hexToRgb(c1);
            const rgb2 = hexToRgb(c2);
            const r = Math.round(rgb1.r + (rgb2.r - rgb1.r) * t);
            const g = Math.round(rgb1.g + (rgb2.g - rgb1.g) * t);
            const b = Math.round(rgb1.b + (rgb2.b - rgb1.b) * t);
            return `rgb(${r}, ${g}, ${b})`;
        }
        
        function calculateThreadY(x, threadIndex, palette) {
            const normalizedX = x / canvas.width;
            const normalizedThread = threadIndex / params.threadCount;
            
            const waveFreq = 2 + (params.turbulence / 100) * 3;
            const wavePhase = time * (params.flowSpeed / 100) * 0.02 + normalizedThread * Math.PI;
            
            const primaryWave = Math.sin(normalizedX * waveFreq * Math.PI * 2 + wavePhase);
            const secondaryWave = Math.sin(normalizedX * waveFreq * 1.5 * Math.PI * 2 - wavePhase * 0.7) * 0.5;
            const tertiaryWave = Math.sin(normalizedX * waveFreq * 0.5 * Math.PI * 2 + wavePhase * 0.3) * 0.3;
            
            const noiseVal = noise(normalizedX * 3 + time * 0.002, normalizedThread * 2);
            
            const combinedWave = primaryWave + secondaryWave + tertiaryWave + noiseVal * (params.turbulence / 100);
            
            const delta = 0.01;
            const y1 = Math.sin((normalizedX - delta) * waveFreq * Math.PI * 2 + wavePhase);
            const y2 = Math.sin((normalizedX + delta) * waveFreq * Math.PI * 2 + wavePhase);
            const angle = Math.atan2((y2 - y1) * params.waveAmplitude, delta * canvas.width);
            
            const velocity = Math.abs(Math.cos(normalizedX * waveFreq * Math.PI * 2 + wavePhase));
            
            const centerY = canvas.height / 2;
            const amplitudePx = (params.waveAmplitude / 100) * canvas.height * 0.4;
            
            return {
                y: centerY + combinedWave * amplitudePx,
                angle,
                velocity
            };
        }
        
        function drawBackground(palette) {
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 0,
                canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) / 2
            );
            gradient.addColorStop(0, palette.bg);
            gradient.addColorStop(1, palette.shadow + "20");
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        function drawSilkThreads(palette) {
            const threadSpacing = canvas.width / params.threadCount;
            
            for (let i = 0; i < params.threadCount; i++) {
                const x = i * threadSpacing + threadSpacing / 2;
                
                const points = [];
                const segments = 50;
                
                for (let s = 0; s <= segments; s++) {
                    const px = (s / segments) * canvas.width;
                    const { y, angle, velocity } = calculateThreadY(px, i, palette);
                    
                    const lightAngle = Math.PI / 4;
                    const angleDiff = Math.abs(angle - lightAngle);
                    const sheen = Math.cos(angleDiff) * (params.sheenIntensity / 100);
                    const brightness = 0.3 + sheen * 0.7 + velocity * 0.2;
                    
                    points.push({ x: px, y, brightness });
                }
                
                for (let p = 0; p < points.length - 1; p++) {
                    const pt1 = points[p];
                    const pt2 = points[p + 1];
                    
                    const color = lerpColor(palette.shadow, palette.highlight, pt1.brightness);
                    
                    ctx.beginPath();
                    ctx.moveTo(pt1.x, pt1.y + (i - params.threadCount / 2) * 2);
                    ctx.lineTo(pt2.x, pt2.y + (i - params.threadCount / 2) * 2);
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1.5;
                    ctx.globalAlpha = 0.6 + pt1.brightness * 0.4;
                    ctx.stroke();
                }
            }
            
            ctx.globalAlpha = 1;
        }
        
        function drawSheenOverlay(palette) {
            if (params.sheenIntensity < 10) return;
            
            const sheenCount = 3;
            
            for (let i = 0; i < sheenCount; i++) {
                const sheenX = (Math.sin(time * 0.008 + i * 2) * 0.3 + 0.5) * canvas.width;
                const sheenY = (Math.cos(time * 0.005 + i * 1.5) * 0.2 + 0.5) * canvas.height;
                
                const gradient = ctx.createRadialGradient(
                    sheenX, sheenY, 0,
                    sheenX, sheenY, Math.min(canvas.width, canvas.height) * 0.4
                );
                
                const alpha = (params.sheenIntensity / 100) * 0.15 * (0.5 + Math.sin(time * 0.01 + i) * 0.5);
                gradient.addColorStop(0, palette.sheen.replace(/[\d.]+\)$/, `${alpha})`));
                gradient.addColorStop(1, "transparent");
                
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }
        
        function drawThreadHighlights(palette) {
            const sparkleCount = Math.floor(params.threadCount / 5);
            
            for (let i = 0; i < sparkleCount; i++) {
                const threadIdx = Math.floor((i / sparkleCount) * params.threadCount);
                const x = (Math.sin(time * 0.01 + i * 3) * 0.4 + 0.5) * canvas.width;
                const { y, brightness } = calculateThreadY(x, threadIdx, palette);
                
                if (brightness > 0.7) {
                    const sparkleSize = (brightness - 0.7) * 3 * (params.sheenIntensity / 100);
                    
                    ctx.beginPath();
                    ctx.arc(x, y, sparkleSize, 0, Math.PI * 2);
                    ctx.fillStyle = palette.highlight;
                    ctx.globalAlpha = brightness * 0.5;
                    ctx.fill();
                }
            }
            
            ctx.globalAlpha = 1;
        }
        
        function drawVignette(palette) {
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, canvas.width * 0.3,
                canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.7
            );
            
            gradient.addColorStop(0, "transparent");
            gradient.addColorStop(1, palette.bg + "80");
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        function draw() {
            if (!isRunning) return;
            
            const palette = COLOR_SCHEMES[params.silkColor] || COLOR_SCHEMES.pearl;
            
            drawBackground(palette);
            drawSilkThreads(palette);
            drawSheenOverlay(palette);
            drawThreadHighlights(palette);
            drawVignette(palette);
            
            time += 1;
            animationId = requestAnimationFrame(draw);
        }
        
        function regenerate() {
            // Reseed noise
            for (let i = 0; i < 256; i++) perm[i] = Math.floor(Math.random() * 256);
            for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];
            time = 0;
        }
        
        function togglePause() {
            isRunning = !isRunning;
            document.getElementById('pauseBtn').textContent = isRunning ? 'Pause' : 'Resume';
            if (isRunning) draw();
        }
        
        function clearCanvas() {
            const palette = COLOR_SCHEMES[params.silkColor] || COLOR_SCHEMES.pearl;
            ctx.fillStyle = palette.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            time = 0;
        }
        
        // Event listeners for parameters
        document.getElementById('threadCount').addEventListener('input', (e) => {
            params.threadCount = parseInt(e.target.value);
        });
        
        document.getElementById('flowSpeed').addEventListener('input', (e) => {
            params.flowSpeed = parseInt(e.target.value);
        });
        
        document.getElementById('turbulence').addEventListener('input', (e) => {
            params.turbulence = parseInt(e.target.value);
        });
        
        document.getElementById('waveAmplitude').addEventListener('input', (e) => {
            params.waveAmplitude = parseInt(e.target.value);
        });
        
        document.getElementById('sheenIntensity').addEventListener('input', (e) => {
            params.sheenIntensity = parseInt(e.target.value);
        });
        
        document.getElementById('colorScheme').addEventListener('change', (e) => {
            params.silkColor = e.target.value;
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            const newSize = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.8, 800);
            if (Math.abs(newSize - canvas.width) > 50) {
                location.reload();
            }
        });
        
        // Initialize
        draw();
    </script>
</body>
</html>
