<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granular Sampler — Microsound Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a0a1a 50%, #0f0a1a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'SF Mono', Monaco, monospace;
            overflow: hidden;
            color: #e0d0e0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding: 20px;
        }

        h1 {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #a080a0;
            margin-bottom: 8px;
        }

        canvas {
            border-radius: 4px;
            box-shadow: 
                0 0 60px rgba(160, 80, 160, 0.15),
                0 0 120px rgba(160, 80, 160, 0.08);
            cursor: crosshair;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 600px;
        }

        .control-row {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        label {
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #806080;
        }

        input[type="range"] {
            width: 120px;
            height: 4px;
            background: rgba(160, 80, 160, 0.2);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #c080c0;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #c080c0;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        button {
            background: rgba(160, 80, 160, 0.15);
            border: 1px solid rgba(160, 80, 160, 0.4);
            color: #c080c0;
            padding: 10px 24px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: rgba(160, 80, 160, 0.25);
            border-color: rgba(160, 80, 160, 0.6);
        }

        button.active {
            background: rgba(160, 80, 160, 0.4);
            border-color: #c080c0;
            box-shadow: 0 0 20px rgba(160, 80, 160, 0.3);
        }

        button.danger {
            border-color: rgba(160, 80, 80, 0.4);
            color: #c08080;
        }

        button.danger:hover {
            background: rgba(160, 80, 80, 0.2);
            border-color: rgba(160, 80, 80, 0.6);
        }

        .waveform-select {
            display: flex;
            gap: 8px;
        }

        .waveform-btn {
            padding: 8px 16px;
            font-size: 10px;
        }

        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 10px;
            line-height: 1.6;
            color: #604060;
            max-width: 200px;
        }

        .grain-count {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 10px;
            color: #604060;
            letter-spacing: 0.1em;
        }

        .value-display {
            font-size: 10px;
            color: #a080a0;
            min-width: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="info">
        GRANULAR SAMPLER<br><br>
        Click + drag on waveform<br>
        to select sample region<br><br>
        Grains scatter from<br>
        selection with random<br>
        pitch and position<br><br>
        Pure synthesis —<br>
        no external samples
    </div>

    <div class="grain-count" id="grainCount">grains: 0</div>

    <div class="container">
        <h1>Granular Sampler</h1>
        
        <canvas id="canvas" width="600" height="200"></canvas>

        <div class="controls">
            <div class="control-row">
                <button id="playBtn">Start Audio</button>
                <button id="clearBtn" class="danger">Clear Selection</button>
            </div>

            <div class="control-row">
                <div class="control-group">
                    <label>Grain Size (ms)</label>
                    <input type="range" id="grainSize" min="10" max="200" value="50">
                    <span class="value-display" id="grainSizeVal">50</span>
                </div>
                <div class="control-group">
                    <label>Density</label>
                    <input type="range" id="density" min="1" max="50" value="20">
                    <span class="value-display" id="densityVal">20</span>
                </div>
                <div class="control-group">
                    <label>Spray</label>
                    <input type="range" id="spray" min="0" max="100" value="30">
                    <span class="value-display" id="sprayVal">30</span>
                </div>
            </div>

            <div class="control-row">
                <div class="control-group">
                    <label>Pitch Spread</label>
                    <input type="range" id="pitch" min="0" max="100" value="25">
                    <span class="value-display" id="pitchVal">25</span>
                </div>
                <div class="control-group">
                    <label>Feedback</label>
                    <input type="range" id="feedback" min="0" max="80" value="30">
                    <span class="value-display" id="feedbackVal">30</span>
                </div>
                <div class="control-group">
                    <label>Master Gain</label>
                    <input type="range" id="gain" min="0" max="100" value="60">
                    <span class="value-display" id="gainVal">60</span>
                </div>
            </div>

            <div class="control-row">
                <label>Source Waveform:</label>
                <div class="waveform-select">
                    <button class="waveform-btn active" data-wave="sine">Sine</button>
                    <button class="waveform-btn" data-wave="sawtooth">Saw</button>
                    <button class="waveform-btn" data-wave="square">Square</button>
                    <button class="waveform-btn" data-wave="triangle">Tri</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Audio context
        let audioCtx = null;
        let masterGain = null;
        let feedbackNode = null;
        let isPlaying = false;
        
        // Grain synthesis
        let grains = [];
        let grainInterval = null;
        let nextGrainTime = 0;
        
        // Selection
        let selection = { start: 0.3, end: 0.7 };
        let isDragging = false;
        let dragStart = null;
        
        // Parameters
        const params = {
            grainSize: 50,
            density: 20,
            spray: 30,
            pitchSpread: 25,
            feedback: 30,
            gain: 60,
            waveform: 'sine'
        };
        
        // Generate synthetic source buffer
        function generateSourceBuffer() {
            const sampleRate = audioCtx.sampleRate;
            const duration = 2.0;
            const length = sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, length, sampleRate);
            const data = buffer.getChannelData(0);
            
            // Create evolving waveform with multiple harmonics
            for (let i = 0; i < length; i++) {
                const t = i / sampleRate;
                const freq = 110 + Math.sin(t * 0.5) * 55; // Drone base
                
                let sample = 0;
                sample += Math.sin(2 * Math.PI * freq * t) * 0.4;
                sample += Math.sin(2 * Math.PI * freq * 2 * t) * 0.2;
                sample += Math.sin(2 * Math.PI * freq * 3 * t) * 0.1;
                sample += Math.sin(2 * Math.PI * freq * 0.5 * t) * 0.3;
                
                // Add some noise texture
                sample += (Math.random() - 0.5) * 0.05;
                
                // Envelope
                const env = Math.min(1, t * 2) * Math.min(1, (duration - t) * 2);
                data[i] = sample * env * 0.5;
            }
            
            return buffer;
        }
        
        let sourceBuffer = null;
        
        // Grain class
        class Grain {
            constructor(startTime, position, duration, pitch, gain) {
                this.startTime = startTime;
                this.position = position;
                this.duration = duration;
                this.pitch = pitch;
                this.gain = gain;
                this.source = null;
                this.gainNode = null;
            }
            
            play() {
                if (!sourceBuffer) return;
                
                const now = audioCtx.currentTime;
                
                // Create source
                this.source = audioCtx.createBufferSource();
                this.source.buffer = sourceBuffer;
                this.source.playbackRate.value = this.pitch;
                
                // Create gain envelope
                this.gainNode = audioCtx.createGain();
                const amp = (this.gain / 100) * 0.3;
                
                this.gainNode.gain.setValueAtTime(0, now);
                this.gainNode.gain.linearRampToValueAtTime(amp, now + this.duration * 0.1);
                this.gainNode.gain.exponentialRampToValueAtTime(0.001, now + this.duration);
                
                // Connect
                this.source.connect(this.gainNode);
                this.gainNode.connect(masterGain);
                
                // Schedule playback from position
                const offset = this.position * sourceBuffer.duration;
                this.source.start(now, offset, this.duration);
                
                // Cleanup
                this.source.onended = () => {
                    this.dispose();
                };
            }
            
            dispose() {
                if (this.source) {
                    try { this.source.stop(); } catch(e) {}
                    this.source.disconnect();
                }
                if (this.gainNode) {
                    this.gainNode.disconnect();
                }
            }
        }
        
        // Initialize audio
        function initAudio() {
            if (audioCtx) return;
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Master gain
            masterGain = audioCtx.createGain();
            masterGain.gain.value = params.gain / 100;
            
            // Feedback delay for texture
            feedbackNode = audioCtx.createDelay();
            feedbackNode.delayTime.value = 0.1;
            const feedbackGain = audioCtx.createGain();
            feedbackGain.gain.value = params.feedback / 200;
            
            // Connect feedback loop
            masterGain.connect(feedbackNode);
            feedbackNode.connect(feedbackGain);
            feedbackGain.connect(masterGain);
            
            // Output
            const outputGain = audioCtx.createGain();
            outputGain.gain.value = 0.7;
            masterGain.connect(outputGain);
            outputGain.connect(audioCtx.destination);
            
            // Generate source
            sourceBuffer = generateSourceBuffer();
        }
        
        // Spawn a grain
        function spawnGrain() {
            if (!audioCtx || !isPlaying) return;
            
            const now = audioCtx.currentTime;
            if (now < nextGrainTime) return;
            
            // Calculate grain parameters
            const selWidth = selection.end - selection.start;
            const sprayAmount = (params.spray / 100) * selWidth;
            
            // Random position within selection + spray
            let position = selection.start + (Math.random() * selWidth);
            position += (Math.random() - 0.5) * sprayAmount;
            position = Math.max(0, Math.min(1, position));
            
            // Random pitch variation
            const pitchSpread = params.pitchSpread / 100;
            const pitch = 1 + (Math.random() - 0.5) * pitchSpread;
            
            // Grain duration in seconds
            const duration = (params.grainSize / 1000) * (0.8 + Math.random() * 0.4);
            
            // Create and play grain
            const grain = new Grain(now, position, duration, pitch, params.gain);
            grain.play();
            grains.push(grain);
            
            // Schedule next grain based on density
            const interval = 1 / (params.density * 2);
            nextGrainTime = now + interval * (0.5 + Math.random());
        }
        
        // Cleanup finished grains
        function cleanupGrains() {
            grains = grains.filter(g => {
                if (audioCtx && audioCtx.currentTime > g.startTime + g.duration) {
                    g.dispose();
                    return false;
                }
                return true;
            });
        }
        
        // Draw waveform and selection
        function draw() {
            ctx.fillStyle = '#0a050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw waveform
            if (sourceBuffer) {
                const data = sourceBuffer.getChannelData(0);
                const step = Math.ceil(data.length / canvas.width);
                
                ctx.strokeStyle = 'rgba(160, 80, 160, 0.4)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                
                for (let x = 0; x < canvas.width; x++) {
                    const idx = x * step;
                    let min = 0, max = 0;
                    for (let i = 0; i < step && idx + i < data.length; i++) {
                        const s = data[idx + i];
                        if (s < min) min = s;
                        if (s > max) max = s;
                    }
                    const y1 = canvas.height / 2 + min * 80;
                    const y2 = canvas.height / 2 + max * 80;
                    ctx.moveTo(x, y1);
                    ctx.lineTo(x, y2);
                }
                ctx.stroke();
            } else {
                // Draw placeholder waveform
                ctx.strokeStyle = 'rgba(160, 80, 160, 0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let x = 0; x < canvas.width; x++) {
                    const y = canvas.height / 2 + Math.sin(x * 0.05) * 40 * Math.sin(x * 0.01);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            
            // Draw selection
            const selX1 = selection.start * canvas.width;
            const selX2 = selection.end * canvas.width;
            const selWidth = selX2 - selX1;
            
            ctx.fillStyle = 'rgba(160, 80, 160, 0.2)';
            ctx.fillRect(selX1, 0, selWidth, canvas.height);
            
            ctx.strokeStyle = '#c080c0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(selX1, 0);
            ctx.lineTo(selX1, canvas.height);
            ctx.moveTo(selX2, 0);
            ctx.lineTo(selX2, canvas.height);
            ctx.stroke();
            
            // Draw grain spray visualization
            if (isPlaying) {
                const sprayAmount = (params.spray / 100) * (selection.end - selection.start);
                const sprayX1 = Math.max(0, selection.start - sprayAmount / 2) * canvas.width;
                const sprayX2 = Math.min(1, selection.end + sprayAmount / 2) * canvas.width;
                
                ctx.fillStyle = 'rgba(160, 80, 160, 0.05)';
                ctx.fillRect(sprayX1, 0, sprayX2 - sprayX1, canvas.height);
            }
            
            // Draw active grains
            if (audioCtx) {
                const now = audioCtx.currentTime;
                grains.forEach(g => {
                    const progress = (now - g.startTime) / g.duration;
                    if (progress >= 0 && progress <= 1) {
                        const x = g.position * canvas.width;
                        const y = canvas.height / 2 + (Math.random() - 0.5) * 20;
                        const alpha = 1 - progress;
                        const size = (1 - progress) * 6;
                        
                        ctx.fillStyle = `rgba(200, 150, 200, ${alpha * 0.8})`;
                        ctx.beginPath();
                        ctx.arc(x, y, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
            }
            
            // Update grain count
            document.getElementById('grainCount').textContent = `grains: ${grains.length}`;
        }
        
        // Animation loop
        function animate() {
            spawnGrain();
            cleanupGrains();
            draw();
            requestAnimationFrame(animate);
        }
        
        // Event handlers
        document.getElementById('playBtn').addEventListener('click', () => {
            if (!audioCtx) {
                initAudio();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            isPlaying = !isPlaying;
            document.getElementById('playBtn').textContent = isPlaying ? 'Stop Audio' : 'Start Audio';
            document.getElementById('playBtn').classList.toggle('active', isPlaying);
            
            if (isPlaying) {
                nextGrainTime = audioCtx.currentTime;
            }
        });
        
        document.getElementById('clearBtn').addEventListener('click', () => {
            selection = { start: 0, end: 1 };
        });
        
        // Canvas interaction
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / canvas.width;
            isDragging = true;
            dragStart = x;
            selection = { start: x, end: x };
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / canvas.width));
            selection.start = Math.min(dragStart, x);
            selection.end = Math.max(dragStart, x);
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
        });
        
        // Parameter controls
        function setupSlider(id, param) {
            const slider = document.getElementById(id);
            const display = document.getElementById(id + 'Val');
            
            slider.addEventListener('input', () => {
                params[param] = parseInt(slider.value);
                display.textContent = slider.value;
                
                if (param === 'gain' && masterGain) {
                    masterGain.gain.value = params.gain / 100;
                }
            });
        }
        
        setupSlider('grainSize', 'grainSize');
        setupSlider('density', 'density');
        setupSlider('spray', 'spray');
        setupSlider('pitch', 'pitchSpread');
        setupSlider('feedback', 'feedback');
        setupSlider('gain', 'gain');
        
        // Waveform selection
        document.querySelectorAll('.waveform-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.waveform-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                params.waveform = btn.dataset.wave;
                
                // Regenerate source with new waveform
                if (audioCtx) {
                    sourceBuffer = generateSourceBuffer();
                }
            });
        });
        
        // Start animation
        animate();
    </script>
</body>
</html>
