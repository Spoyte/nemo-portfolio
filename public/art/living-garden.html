<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Garden — Generative Art</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0a15 0%, #1a1a2e 50%, #16213e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    canvas {
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .controls {
      margin-top: 20px;
      color: #a0a0b0;
      font-size: 14px;
      text-align: center;
    }
    .param-controls {
      margin-top: 16px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      color: #808090;
      font-size: 12px;
      max-width: 800px;
    }
    .param-controls label {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .param-controls input[type="range"] {
      width: 80px;
      accent-color: #6b8e6b;
    }
    .param-controls select {
      background: #1a1a2e;
      color: #a0a0b0;
      border: 1px solid #333;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .param-controls button {
      background: linear-gradient(135deg, #6b8e6b, #4a7c4a);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .param-controls button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(107, 142, 107, 0.4);
    }
    .season-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <canvas id="art" width="700" height="600"></canvas>
  <div class="controls">Living Garden — L-System botanicals with seasonal transitions</div>
  <div class="param-controls">
    <label>
      Species:
      <select id="species">
        <option value="fern">Fern</option>
        <option value="tree">Oak Tree</option>
        <option value="bush">Wild Bush</option>
        <option value="flower">Flower Stem</option>
        <option value="mixed">Mixed Garden</option>
      </select>
    </label>
    <label>
      Season:
      <select id="season">
        <option value="spring">Spring 🌸</option>
        <option value="summer">Summer 🌿</option>
        <option value="autumn">Autumn 🍂</option>
        <option value="winter">Winter ❄️</option>
      </select>
    </label>
    <label>
      Growth:
      <input type="range" id="growth" min="1" max="6" value="4" step="0.1">
    </label>
    <label>
      Wind:
      <input type="range" id="wind" min="0" max="100" value="30">
    </label>
    <label>
      Density:
      <input type="range" id="density" min="3" max="12" value="7">
    </label>
    <button id="regenerate">Regenerate</button>
    <button id="autoSeason">Auto Seasons</button>
  </div>

  <script>
    const canvas = document.getElementById('art');
    const ctx = canvas.getContext('2d');
    
    // Parameters
    const params = {
      species: 'mixed',
      season: 'summer',
      growth: 4,
      wind: 30,
      density: 7,
      autoSeason: false,
      seasonTime: 0
    };
    
    // Season color palettes
    const seasons = {
      spring: {
        bg: ['#0a1510', '#1a2520'],
        stem: ['#4a6741', '#5a7751', '#6b8e6b'],
        leaf: ['#90c090', '#a8d4a8', '#c4e8c4', '#ffb7c5', '#ffc0cb'],
        ground: '#2a3a2a'
      },
      summer: {
        bg: ['#0a1a0a', '#1a2a1a'],
        stem: ['#3d5c3d', '#4a6b4a', '#5a7c5a'],
        leaf: ['#228b22', '#32cd32', '#90ee90', '#7cfc00', '#adff2f'],
        ground: '#1a2a1a'
      },
      autumn: {
        bg: ['#1a1510', '#2a2015'],
        stem: ['#5c4a3d', '#6b5a4a', '#8b7355'],
        leaf: ['#ff8c00', '#ff6347', '#daa520', '#cd853f', '#d2691e'],
        ground: '#2a2015'
      },
      winter: {
        bg: ['#0a0a15', '#151520'],
        stem: ['#4a4a5a', '#5a5a6a', '#6a6a7a'],
        leaf: ['#e0e0e0', '#c0c0d0', '#a0a0b0', '#ffffff', '#f0f0ff'],
        ground: '#1a1a2a'
      }
    };
    
    // L-System rules for different species
    const lSystems = {
      fern: {
        axiom: 'X',
        rules: {
          'X': 'F+[[X]-X]-F[-FX]+X',
          'F': 'FF'
        },
        angle: 25,
        length: 4,
        width: 2,
        generations: 6
      },
      tree: {
        axiom: 'F',
        rules: {
          'F': 'F[+F]F[-F]F',
          'X': 'X'
        },
        angle: 25.7,
        length: 6,
        width: 3,
        generations: 5
      },
      bush: {
        axiom: 'F',
        rules: {
          'F': 'FF+[+F-F-F]-[-F+F+F]'
        },
        angle: 22.5,
        length: 3,
        width: 2,
        generations: 4
      },
      flower: {
        axiom: 'X',
        rules: {
          'X': 'F[+X][-X]FX',
          'F': 'FF'
        },
        angle: 20,
        length: 3,
        width: 2,
        generations: 5
      }
    };
    
    // Generate L-System string
    function generateLString(system, generations) {
      let result = system.axiom;
      for (let i = 0; i < generations; i++) {
        let newResult = '';
        for (const char of result) {
          newResult += system.rules[char] || char;
        }
        result = newResult;
      }
      return result;
    }
    
    // Parse and render L-System
    function renderLSystem(ctx, lString, config, x, y, season, growth, windTime) {
      const stack = [];
      let angle = -90; // Start pointing up
      const windForce = params.wind / 100;
      const seasonColors = seasons[season];
      
      ctx.save();
      ctx.translate(x, y);
      
      // Calculate dynamic length based on growth
      const currentLength = config.length * (0.5 + growth * 0.15);
      
      for (let i = 0; i < lString.length; i++) {
        const char = lString[i];
        const progress = i / lString.length;
        const depth = stack.length;
        
        // Wind effect increases with height and varies with time
        const windOffset = Math.sin(windTime * 0.002 + depth * 0.5 + x * 0.01) * windForce * depth * 2;
        
        switch (char) {
          case 'F':
            // Draw stem/branch
            const stemColor = seasonColors.stem[Math.min(depth, seasonColors.stem.length - 1)];
            ctx.strokeStyle = stemColor;
            ctx.lineWidth = Math.max(0.5, config.width - depth * 0.3);
            ctx.lineCap = 'round';
            
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(currentLength + windOffset * 0.3, 0);
            ctx.stroke();
            
            ctx.translate(currentLength + windOffset * 0.3, 0);
            break;
            
          case 'X':
            // Draw leaf/flower at terminal points
            if (progress > 0.7 || depth > 3) {
              const leafColor = seasonColors.leaf[Math.floor(Math.random() * seasonColors.leaf.length)];
              const leafSize = 3 + Math.random() * 4 * growth;
              
              ctx.fillStyle = leafColor;
              ctx.globalAlpha = 0.7 + Math.random() * 0.3;
              
              // Draw leaf shape
              ctx.beginPath();
              ctx.ellipse(0, 0, leafSize, leafSize * 0.6, angle * Math.PI / 180, 0, Math.PI * 2);
              ctx.fill();
              
              // Add glow for some leaves
              if (Math.random() > 0.7) {
                ctx.shadowColor = leafColor;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
              }
              
              ctx.globalAlpha = 1;
            }
            break;
            
          case '+':
            angle += config.angle + windOffset;
            ctx.rotate((config.angle + windOffset) * Math.PI / 180);
            break;
            
          case '-':
            angle -= config.angle - windOffset;
            ctx.rotate((-config.angle + windOffset) * Math.PI / 180);
            break;
            
          case '[':
            stack.push({ x: 0, y: 0, angle: angle });
            break;
            
          case ']':
            const state = stack.pop();
            ctx.restore();
            ctx.save();
            ctx.translate(state.x, state.y);
            angle = state.angle;
            ctx.rotate(angle * Math.PI / 180);
            break;
        }
      }
      
      ctx.restore();
    }
    
    // Garden plants configuration
    let plants = [];
    
    function generateGarden() {
      plants = [];
      const numPlants = params.density;
      const gardenWidth = canvas.width - 100;
      const startX = 50;
      const groundY = canvas.height - 80;
      
      for (let i = 0; i < numPlants; i++) {
        const x = startX + (gardenWidth / (numPlants - 1)) * i + (Math.random() - 0.5) * 30;
        const y = groundY + Math.random() * 20;
        
        let species;
        if (params.species === 'mixed') {
          const speciesList = ['fern', 'tree', 'bush', 'flower'];
          species = speciesList[Math.floor(Math.random() * speciesList.length)];
        } else {
          species = params.species;
        }
        
        const system = lSystems[species];
        const lString = generateLString(system, Math.floor(params.growth));
        
        plants.push({
          x, y, species, lString, system,
          scale: 0.8 + Math.random() * 0.4,
          offset: Math.random() * 1000
        });
      }
    }
    
    function interpolateColor(color1, color2, factor) {
      const hex2rgb = (hex) => ({
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
      });
      
      const c1 = hex2rgb(color1);
      const c2 = hex2rgb(color2);
      
      const r = Math.round(c1.r + (c2.r - c1.r) * factor);
      const g = Math.round(c1.g + (c2.g - c1.g) * factor);
      const b = Math.round(c1.b + (c2.b - c1.b) * factor);
      
      return `rgb(${r}, ${g}, ${b})`;
    }
    
    function getCurrentSeason() {
      if (!params.autoSeason) return params.season;
      
      const seasonNames = ['spring', 'summer', 'autumn', 'winter'];
      const seasonIndex = Math.floor(params.seasonTime / 300) % 4;
      return seasonNames[seasonIndex];
    }
    
    let time = 0;
    
    function render() {
      // Auto-season progression
      if (params.autoSeason) {
        params.seasonTime++;
        const seasonNames = ['spring', 'summer', 'autumn', 'winter'];
        const seasonIndex = Math.floor(params.seasonTime / 300) % 4;
        document.getElementById('season').value = seasonNames[seasonIndex];
      }
      
      const currentSeason = getCurrentSeason();
      const seasonColors = seasons[currentSeason];
      
      // Clear and draw background
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, seasonColors.bg[0]);
      gradient.addColorStop(1, seasonColors.bg[1]);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw ground
      ctx.fillStyle = seasonColors.ground;
      ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
      
      // Add ground texture
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      for (let i = 0; i < 50; i++) {
        const x = Math.random() * canvas.width;
        const y = canvas.height - 80 + Math.random() * 80;
        ctx.fillRect(x, y, 2, 2);
      }
      
      // Render all plants
      for (const plant of plants) {
        ctx.save();
        ctx.translate(plant.x, plant.y);
        ctx.scale(plant.scale, plant.scale);
        
        renderLSystem(
          ctx, 
          plant.lString, 
          plant.system, 
          0, 0, 
          currentSeason, 
          params.growth,
          time + plant.offset
        );
        
        ctx.restore();
      }
      
      // Draw fireflies in summer evenings
      if (currentSeason === 'summer' && Math.random() > 0.9) {
        ctx.fillStyle = '#ffff80';
        ctx.shadowColor = '#ffff80';
        ctx.shadowBlur = 15;
        for (let i = 0; i < 5; i++) {
          const fx = Math.random() * canvas.width;
          const fy = canvas.height - 100 - Math.random() * 300;
          ctx.beginPath();
          ctx.arc(fx, fy, 1 + Math.random() * 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }
      
      // Draw snow in winter
      if (currentSeason === 'winter') {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        for (let i = 0; i < 20; i++) {
          const sx = (time * 0.5 + i * 50) % (canvas.width + 100) - 50;
          const sy = (time * 0.3 + i * 30) % (canvas.height + 100) - 50;
          ctx.beginPath();
          ctx.arc(sx, sy, 1 + Math.random() * 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      
      // Draw falling petals in spring
      if (currentSeason === 'spring' && Math.random() > 0.95) {
        ctx.fillStyle = '#ffb7c5';
        for (let i = 0; i < 3; i++) {
          const px = (time * 0.3 + i * 100) % canvas.width;
          const py = (time * 0.5 + i * 50) % (canvas.height - 100);
          ctx.beginPath();
          ctx.ellipse(px, py, 3, 2, time * 0.01, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      
      time += 16;
      requestAnimationFrame(render);
    }
    
    // UI controls
    document.getElementById('species').addEventListener('change', (e) => {
      params.species = e.target.value;
      generateGarden();
    });
    
    document.getElementById('season').addEventListener('change', (e) => {
      params.season = e.target.value;
      params.autoSeason = false;
    });
    
    document.getElementById('growth').addEventListener('input', (e) => {
      params.growth = parseFloat(e.target.value);
      generateGarden();
    });
    
    document.getElementById('wind').addEventListener('input', (e) => {
      params.wind = parseInt(e.target.value);
    });
    
    document.getElementById('density').addEventListener('input', (e) => {
      params.density = parseInt(e.target.value);
      generateGarden();
    });
    
    document.getElementById('regenerate').addEventListener('click', () => {
      generateGarden();
    });
    
    document.getElementById('autoSeason').addEventListener('click', () => {
      params.autoSeason = !params.autoSeason;
      e.target.textContent = params.autoSeason ? 'Stop Auto' : 'Auto Seasons';
    });
    
    // Initialize
    generateGarden();
    render();
  </script>
</body>
</html>
