<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Poetry — Generative Art</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05050a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid #1a1a2e;
    }
    .controls {
      margin-top: 20px;
      color: #888;
      font-size: 14px;
      text-align: center;
    }
    .param-controls {
      margin-top: 16px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      color: #666;
      font-size: 12px;
    }
    .param-controls label {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f0f1a;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #1a1a2e;
    }
    .param-controls input[type="range"] {
      width: 80px;
      accent-color: #c084fc;
    }
    .param-controls select {
      background: #1a1a2a;
      color: #888;
      border: 1px solid #333;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .buttons {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }
    button {
      background: #0f0f1a;
      color: #888;
      border: 1px solid #1a1a2e;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    button:hover {
      background: #1a1a2a;
      color: #aaa;
      border-color: #c084fc;
    }
    .category-badge {
      display: inline-block;
      background: #c084fc20;
      color: #c084fc;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <canvas id="art" width="600" height="600"></canvas>
  <div class="controls">
    Kinetic Poetry
    <span class="category-badge">text</span>
    <br><small>Floating words with ethereal connections</small>
  </div>
  <div class="param-controls" id="params">
    <label>
      Theme:
      <select id="theme">
        <option value="cosmos">Cosmos</option>
        <option value="dreams">Dreams</option>
        <option value="nature">Nature</option>
        <option value="time">Time</option>
        <option value="silence">Silence</option>
      </select>
    </label>
    <label>
      Colors:
      <select id="colorScheme">
        <option value="twilight">Twilight</option>
        <option value="neon">Neon</option>
        <option value="monochrome">Monochrome</option>
        <option value="warm">Warm</option>
        <option value="cool">Cool</option>
        <option value="gold">Gold</option>
      </select>
    </label>
    <label>
      Words: <span id="wordCountVal">15</span>
      <input type="range" id="wordCount" min="5" max="30" value="15">
    </label>
    <label>
      Speed: <span id="driftSpeedVal">1</span>
      <input type="range" id="driftSpeed" min="0.1" max="3" step="0.1" value="1">
    </label>
    <label>
      Connections: <span id="connectionDensityVal">50</span>
      <input type="range" id="connectionDensity" min="0" max="100" value="50">
    </label>
  </div>
  <div class="buttons">
    <button onclick="regenerate()">Regenerate</button>
    <button onclick="download()">Download</button>
    <button onclick="toggleAnimation()">Pause/Play</button>
  </div>

  <script>
// Word banks for different themes
const wordBanks = {
  cosmos: ["star", "void", "orbit", "nebula", "light", "dark", "infinite", "gravity", "dust", "cosmos", "galaxy", "aurora", "eclipse", "nova", "quasar", "zenith", "horizon", "ether", "celestial", "astral"],
  dreams: ["drift", "float", "whisper", "shadow", "memory", "echo", "fading", "lucid", "somnolent", "reverie", "phantom", "ethereal", "mist", "haze", "slumber", "awakening", "subconscious", "vision", "trace", "gossamer"],
  nature: ["bloom", "wither", "root", "branch", "petal", "thunder", "dew", "moss", "fern", "stream", "meadow", "canopy", "soil", "seed", "wild", "verdant", "rustle", "breeze", "cascade", "flora"],
  time: ["fleeting", "eternal", "moment", "hour", "fading", "lingering", "passage", "cycle", "rhythm", "pulse", "decay", "bloom", "wither", "renew", "ancient", "futures", "now", "then", "always", "never"],
  silence: ["hush", "still", "quiet", "mute", "void", "empty", "pause", "breath", "listen", "absence", "solitude", "tranquil", "serene", "calm", "peace", "dormant", "latent", "potential", "space", "rest"],
};

// Color palettes
const palettes = {
  neon: {
    bg: "#0a0a0f",
    words: ["#FF006E", "#FB5607", "#FFBE0B", "#8338EC", "#3A86FF", "#00F5FF"],
    connections: "rgba(255, 255, 255, 0.15)",
  },
  twilight: {
    bg: "#0f0a1a",
    words: ["#E8D5F2", "#C9B1D4", "#A67DB5", "#7B5A9E", "#5A3D7A", "#3D2656"],
    connections: "rgba(200, 180, 220, 0.12)",
  },
  monochrome: {
    bg: "#0a0a0a",
    words: ["#FFFFFF", "#E0E0E0", "#C0C0C0", "#A0A0A0", "#808080", "#606060"],
    connections: "rgba(255, 255, 255, 0.08)",
  },
  warm: {
    bg: "#1a0f0a",
    words: ["#FF6B35", "#F7931E", "#FFD23F", "#EE4266", "#FF8C42", "#FFA07A"],
    connections: "rgba(255, 200, 150, 0.12)",
  },
  cool: {
    bg: "#0a121a",
    words: ["#3B82F6", "#06B6D4", "#10B981", "#8B5CF6", "#6366F1", "#14B8A6"],
    connections: "rgba(150, 200, 255, 0.12)",
  },
  gold: {
    bg: "#0a0a05",
    words: ["#FFD700", "#DAA520", "#B8860B", "#F0E68C", "#FFE4B5", "#DEB887"],
    connections: "rgba(255, 215, 0, 0.1)",
  },
};

let animationId = null;
let isAnimating = true;
let time = 0;
let particles = [];
let lastWordCount = 0;
let lastConnectionDensity = 50;

// Default parameters
const defaultParams = {
  wordCount: 15,
  driftSpeed: 1,
  connectionDensity: 50,
  colorScheme: "twilight",
  theme: "cosmos",
  animated: true,
};

let params = { ...defaultParams };

function createWordParticles(count, width, height, theme, colors) {
  const words = wordBanks[theme] || wordBanks.cosmos;
  const newParticles = [];
  
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const distance = Math.random() * 0.4 + 0.1;
    
    newParticles.push({
      text: words[i % words.length],
      x: width / 2 + Math.cos(angle) * width * distance,
      y: height / 2 + Math.sin(angle) * height * distance,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      size: 14 + Math.random() * 18,
      color: colors[i % colors.length],
      opacity: 0.6 + Math.random() * 0.4,
      phase: Math.random() * Math.PI * 2,
      connections: [],
    });
  }
  
  return newParticles;
}

function updateConnections(particles, density) {
  const maxConnections = Math.floor(density / 10) + 1;
  const connectionDistance = 150;
  
  particles.forEach((p, i) => {
    p.connections = [];
    
    for (let j = i + 1; j < particles.length; j++) {
      const other = particles[j];
      const dx = p.x - other.x;
      const dy = p.y - other.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < connectionDistance && p.connections.length < maxConnections) {
        p.connections.push(j);
      }
    }
  });
}

function generate(ctx, p, t) {
  const canvas = ctx.canvas;
  const palette = palettes[p.colorScheme] || palettes.twilight;
  
  // Clear with background
  ctx.fillStyle = palette.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Animation time
  const animTime = p.animated ? t * p.driftSpeed * 0.0005 : 0;
  
  // Initialize or recreate particles if word count changed
  if (particles.length !== p.wordCount) {
    particles = createWordParticles(
      p.wordCount,
      canvas.width,
      canvas.height,
      p.theme,
      palette.words
    );
    lastWordCount = p.wordCount;
    updateConnections(particles, p.connectionDensity);
    lastConnectionDensity = p.connectionDensity;
  }
  
  // Update connections if density changed
  if (lastConnectionDensity !== p.connectionDensity) {
    updateConnections(particles, p.connectionDensity);
    lastConnectionDensity = p.connectionDensity;
  }
  
  // Update particle positions
  particles.forEach((particle) => {
    const driftX = Math.sin(animTime + particle.phase) * 0.5;
    const driftY = Math.cos(animTime * 0.7 + particle.phase) * 0.5;
    
    particle.x += particle.vx + driftX * 0.1;
    particle.y += particle.vy + driftY * 0.1;
    
    // Wrap around edges
    const margin = 100;
    if (particle.x < -margin) particle.x = canvas.width + margin;
    if (particle.x > canvas.width + margin) particle.x = -margin;
    if (particle.y < -margin) particle.y = canvas.height + margin;
    if (particle.y > canvas.height + margin) particle.y = -margin;
    
    // Pulsing opacity
    particle.opacity = 0.5 + 0.3 * Math.sin(animTime * 2 + particle.phase);
  });
  
  // Draw connections first (behind words)
  ctx.strokeStyle = palette.connections;
  ctx.lineWidth = 0.5;
  
  particles.forEach((particle) => {
    particle.connections.forEach((j) => {
      const other = particles[j];
      const dx = particle.x - other.x;
      const dy = particle.y - other.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const alpha = Math.max(0, 1 - dist / 150) * 0.3;
      
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.moveTo(particle.x, particle.y);
      ctx.lineTo(other.x, other.y);
      ctx.stroke();
    });
  });
  
  // Draw words
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  
  particles.forEach((particle) => {
    // Glow effect
    ctx.shadowColor = particle.color;
    ctx.shadowBlur = 15;
    
    ctx.font = `${particle.size}px "Georgia", "Times New Roman", serif`;
    ctx.fillStyle = particle.color;
    ctx.globalAlpha = particle.opacity;
    ctx.fillText(particle.text, particle.x, particle.y);
    
    // Reset shadow
    ctx.shadowBlur = 0;
  });
  
  // Reset alpha
  ctx.globalAlpha = 1;
}

function render() {
  const canvas = document.getElementById('art');
  const ctx = canvas.getContext('2d');
  
  // Update params from controls
  params.theme = document.getElementById('theme').value;
  params.colorScheme = document.getElementById('colorScheme').value;
  params.wordCount = parseInt(document.getElementById('wordCount').value);
  params.driftSpeed = parseFloat(document.getElementById('driftSpeed').value);
  params.connectionDensity = parseInt(document.getElementById('connectionDensity').value);
  
  generate(ctx, params, time);
}

function animate() {
  if (!isAnimating) return;
  time += 16;
  render();
  animationId = requestAnimationFrame(animate);
}

function regenerate() {
  particles = []; // Force recreation
  time = 0;
  render();
}

function download() {
  const canvas = document.getElementById('art');
  const link = document.createElement('a');
  link.download = 'kinetic-poetry-' + Date.now() + '.png';
  link.href = canvas.toDataURL();
  link.click();
}

function toggleAnimation() {
  isAnimating = !isAnimating;
  if (isAnimating) {
    animate();
  } else if (animationId) {
    cancelAnimationFrame(animationId);
  }
}

// Update value displays
function updateDisplays() {
  document.getElementById('wordCountVal').textContent = document.getElementById('wordCount').value;
  document.getElementById('driftSpeedVal').textContent = document.getElementById('driftSpeed').value;
  document.getElementById('connectionDensityVal').textContent = document.getElementById('connectionDensity').value;
}

// Event listeners for controls
document.getElementById('wordCount').addEventListener('input', updateDisplays);
document.getElementById('driftSpeed').addEventListener('input', updateDisplays);
document.getElementById('connectionDensity').addEventListener('input', updateDisplays);

document.querySelectorAll('#params select, #params input').forEach(el => {
  el.addEventListener('change', () => {
    particles = []; // Force recreation on theme/color change
    if (!isAnimating) render();
  });
});

// Initialize
render();
animate();
  </script>
</body>
</html>
