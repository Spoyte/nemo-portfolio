<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diffusion Limited Aggregation — Generative Art</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0c0a09;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .controls {
      margin-top: 20px;
      color: #888;
      font-size: 14px;
    }
    .param-controls {
      margin-top: 16px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      color: #666;
      font-size: 12px;
    }
    .param-controls label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .param-controls input[type="range"] {
      width: 80px;
    }
    .param-controls select {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .buttons {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }
    button {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover {
      background: #2a2a2a;
      color: #aaa;
    }
    .stats {
      margin-top: 12px;
      color: #444;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <canvas id="art" width="600" height="600"></canvas>
  <div class="controls">Diffusion Limited Aggregation — Organic fractal growth through particle random walks</div>
  <div class="param-controls">
    <label>
      Particles:
      <input type="range" id="particleCount" min="500" max="5000" value="2000" step="500">
    </label>
    <label>
      Stickiness:
      <input type="range" id="stickiness" min="0.5" max="3" value="1.2" step="0.1">
    </label>
    <label>
      Branching:
      <input type="range" id="branchFactor" min="0.3" max="1.5" value="0.8" step="0.1">
    </label>
    <label>
      Colors:
      <select id="colorScheme">
        <option value="lightning">Lightning</option>
        <option value="coral">Coral</option>
        <option value="frost">Frost</option>
        <option value="copper">Copper</option>
        <option value="ember">Ember</option>
        <option value="midnight">Midnight</option>
      </select>
    </label>
    <label>
      Speed:
      <input type="range" id="animationSpeed" min="0" max="5" value="2" step="0.5">
    </label>
    <label>
      Seed:
      <input type="range" id="seed" min="1" max="10000" value="1" step="1">
    </label>
  </div>
  <div class="buttons">
    <button id="newSeed">New Seed</button>
    <button id="regenerate">Regenerate</button>
    <button id="download">Download PNG</button>
  </div>
  <div class="stats" id="stats">Cluster: 0 particles | Seed: 1</div>

  <script>
    // Seeded Random Number Generator
    class SeededRandom {
      constructor(seed) {
        this.seed = seed;
      }
      
      random() {
        this.seed = (this.seed * 9301 + 49297) % 233280;
        return this.seed / 233280;
      }
    }

    const canvas = document.getElementById('art');
    const ctx = canvas.getContext('2d');
    
    const COLOR_SCHEMES = {
      lightning: ["#ffffff", "#e0e0ff", "#c0c0ff", "#8080ff", "#4040ff", "#202080"],
      coral: ["#ffb3ba", "#ffdfba", "#ffffba", "#baffc9", "#bae1ff", "#ff9999"],
      frost: ["#ffffff", "#e8f4f8", "#d0e8f0", "#b8dce8", "#a0d0e0", "#88c4d8"],
      copper: ["#b87333", "#cd853f", "#d4a574", "#e6c9a8", "#8b4513", "#654321"],
      ember: ["#ff4500", "#ff6347", "#ff7f50", "#ffa500", "#ffd700", "#8b0000"],
      midnight: ["#0a0a1a", "#1a1a3a", "#2a2a5a", "#3a3a7a", "#4a4a9a", "#5a5aba"]
    };
    
    // Parameters
    const params = {
      particleCount: 2000,
      stickiness: 1.2,
      branchFactor: 0.8,
      colorScheme: 'lightning',
      animationSpeed: 2,
      seed: 1
    };

    function generate() {
      const width = canvas.width;
      const height = canvas.height;
      const centerX = width / 2;
      const centerY = height / 2;
      
      const rng = new SeededRandom(params.seed);
      const palette = COLOR_SCHEMES[params.colorScheme];
      
      // Initialize cluster with seed at center
      const cluster = [{ x: centerX, y: centerY, age: 0, generation: 0 }];
      const clusterSet = new Set([`${Math.floor(centerX)},${Math.floor(centerY)}`]);
      const particles = [];
      
      // Spawn particles from edges
      const spawnParticle = () => {
        const side = Math.floor(rng.random() * 4);
        let x, y, vx, vy;
        const margin = 10;
        
        switch (side) {
          case 0: // top
            x = rng.random() * width;
            y = margin;
            vx = (rng.random() - 0.5) * 2;
            vy = rng.random() * 2 + 0.5;
            break;
          case 1: // right
            x = width - margin;
            y = rng.random() * height;
            vx = -(rng.random() * 2 + 0.5);
            vy = (rng.random() - 0.5) * 2;
            break;
          case 2: // bottom
            x = rng.random() * width;
            y = height - margin;
            vx = (rng.random() - 0.5) * 2;
            vy = -(rng.random() * 2 + 0.5);
            break;
          default: // left
            x = margin;
            y = rng.random() * height;
            vx = rng.random() * 2 + 0.5;
            vy = (rng.random() - 0.5) * 2;
        }
        
        return { x, y, vx, vy };
      };
      
      // Initialize particles
      for (let i = 0; i < Math.min(params.particleCount / 10, 50); i++) {
        particles.push(spawnParticle());
      }
      
      // Simulation steps
      const steps = params.animationSpeed > 0 ? Math.floor(params.animationSpeed * 10) : params.particleCount;
      
      for (let step = 0; step < steps && cluster.length < params.particleCount; step++) {
        // Update each particle
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          
          // Random walk with momentum
          p.vx += (rng.random() - 0.5) * 0.5;
          p.vy += (rng.random() - 0.5) * 0.5;
          
          // Limit velocity
          const maxSpeed = 3;
          const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
          if (speed > maxSpeed) {
            p.vx = (p.vx / speed) * maxSpeed;
            p.vy = (p.vy / speed) * maxSpeed;
          }
          
          // Move particle
          p.x += p.vx;
          p.y += p.vy;
          
          // Bounce off walls
          if (p.x < 0 || p.x >= width) {
            p.vx *= -1;
            p.x = Math.max(0, Math.min(width - 1, p.x));
          }
          if (p.y < 0 || p.y >= height) {
            p.vy *= -1;
            p.y = Math.max(0, Math.min(height - 1, p.y));
          }
          
          // Check if particle sticks to cluster
          let stuck = false;
          const checkRadius = Math.ceil(params.stickiness * 3);
          
          for (const cp of cluster) {
            const dx = p.x - cp.x;
            const dy = p.y - cp.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < params.stickiness * 2) {
              const distFromCenter = Math.sqrt(
                (p.x - centerX) ** 2 + (p.y - centerY) ** 2
              );
              const maxDist = Math.min(width, height) / 2;
              const normalizedDist = distFromCenter / maxDist;
              
              const stickProbability = 0.3 + params.branchFactor * normalizedDist * 0.7;
              
              if (rng.random() < stickProbability) {
                const generation = cp.generation + 1;
                const newPoint = {
                  x: Math.floor(p.x),
                  y: Math.floor(p.y),
                  age: step,
                  generation
                };
                
                const key = `${newPoint.x},${newPoint.y}`;
                if (!clusterSet.has(key)) {
                  cluster.push(newPoint);
                  clusterSet.add(key);
                  stuck = true;
                }
                break;
              }
            }
          }
          
          if (stuck) {
            particles.splice(i, 1);
          }
        }
        
        // Spawn new particles
        while (particles.length < 30 && cluster.length + particles.length < params.particleCount) {
          particles.push(spawnParticle());
        }
      }
      
      return { cluster, clusterSet, palette, steps };
    }

    function draw() {
      const width = canvas.width;
      const height = canvas.height;
      const centerX = width / 2;
      const centerY = height / 2;
      
      const { cluster, clusterSet, palette, steps } = generate();
      
      // Clear canvas
      ctx.fillStyle = '#0c0a09';
      ctx.fillRect(0, 0, width, height);
      
      // Draw background gradient
      const imageData = ctx.getImageData(0, 0, width, height);
      const data = imageData.data;
      
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = (y * width + x) * 4;
          const distFromCenter = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);
          const maxDist = Math.min(width, height) / 2;
          const bgIntensity = Math.max(0, 1 - distFromCenter / maxDist) * 0.15;
          
          let r, g, b;
          if (params.colorScheme === 'lightning' || params.colorScheme === 'frost') {
            const bg = Math.floor(bgIntensity * 40);
            r = bg; g = bg; b = Math.floor(bg * 1.5) + 10;
          } else if (params.colorScheme === 'ember') {
            const bg = Math.floor(bgIntensity * 30);
            r = bg + 10; g = Math.floor(bg / 2); b = Math.floor(bg / 4);
          } else {
            const bg = Math.floor(bgIntensity * 30);
            r = bg; g = bg; b = bg;
          }
          
          data[idx] = r;
          data[idx + 1] = g;
          data[idx + 2] = b;
          data[idx + 3] = 255;
        }
      }
      
      // Draw cluster points
      const maxGen = Math.max(...cluster.map(p => p.generation), 1);
      
      for (const p of cluster) {
        const colorIndex = Math.min(
          Math.floor((p.generation / maxGen) * palette.length),
          palette.length - 1
        );
        
        const hex = palette[colorIndex];
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        
        const idx = (Math.floor(p.y) * width + Math.floor(p.x)) * 4;
        if (idx >= 0 && idx < data.length - 3) {
          const glow = Math.max(0, 1 - (steps - p.age) / 100);
          data[idx] = Math.min(255, r + glow * 50);
          data[idx + 1] = Math.min(255, g + glow * 50);
          data[idx + 2] = Math.min(255, b + glow * 50);
          data[idx + 3] = 255;
        }
      }
      
      ctx.putImageData(imageData, 0, 0);
      
      // Draw connecting lines for smoother branches
      ctx.globalCompositeOperation = 'screen';
      ctx.lineWidth = 0.5;
      
      for (let i = 1; i < cluster.length; i++) {
        const p = cluster[i];
        let nearest = null;
        let minDist = Infinity;
        
        for (const other of cluster) {
          if (other.generation < p.generation) {
            const dx = p.x - other.x;
            const dy = p.y - other.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < minDist && dist < 15) {
              minDist = dist;
              nearest = other;
            }
          }
        }
        
        if (nearest) {
          const colorIndex = Math.min(
            Math.floor((p.generation / maxGen) * palette.length),
            palette.length - 1
          );
          ctx.strokeStyle = palette[colorIndex] + '40';
          ctx.beginPath();
          ctx.moveTo(nearest.x, nearest.y);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }
      }
      
      ctx.globalCompositeOperation = 'source-over';
      
      // Update stats
      document.getElementById('stats').textContent = 
        `Cluster: ${cluster.length} particles | Seed: ${params.seed}`;
    }

    // Event listeners
    document.getElementById('particleCount').addEventListener('input', (e) => {
      params.particleCount = parseInt(e.target.value);
    });

    document.getElementById('stickiness').addEventListener('input', (e) => {
      params.stickiness = parseFloat(e.target.value);
    });

    document.getElementById('branchFactor').addEventListener('input', (e) => {
      params.branchFactor = parseFloat(e.target.value);
    });

    document.getElementById('colorScheme').addEventListener('change', (e) => {
      params.colorScheme = e.target.value;
      draw();
    });

    document.getElementById('animationSpeed').addEventListener('input', (e) => {
      params.animationSpeed = parseFloat(e.target.value);
    });

    document.getElementById('seed').addEventListener('input', (e) => {
      params.seed = parseInt(e.target.value);
      draw();
    });

    document.getElementById('newSeed').addEventListener('click', () => {
      params.seed = Math.floor(Math.random() * 10000) + 1;
      document.getElementById('seed').value = params.seed;
      draw();
    });

    document.getElementById('regenerate').addEventListener('click', () => {
      draw();
    });

    document.getElementById('download').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `dla-seed-${params.seed}.png`;
      link.href = canvas.toDataURL();
      link.click();
    });

    // Initialize
    draw();
  </script>
</body>
</html>
