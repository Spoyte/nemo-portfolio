<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apollonian Gasket — Generative Art</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      padding: 20px;
    }
    
    h1 {
      font-size: 1.5rem;
      font-weight: 300;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }
    
    .subtitle {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 1.5rem;
    }
    
    canvas {
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      max-width: 100%;
      height: auto;
    }
    
    .controls {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    button {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    
    button:hover {
      background: #2a2a2a;
      border-color: #555;
    }
    
    button.active {
      background: #333;
      border-color: #666;
    }
    
    .info {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #444;
      text-align: center;
      max-width: 400px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Apollonian Gasket</h1>
  <p class="subtitle">Descartes' Theorem — Circle packing through curvature</p>
  
  <canvas id="canvas" width="800" height="800"></canvas>
  
  <div class="controls">
    <button onclick="setPalette('gold')" class="active" id="btn-gold">Gold</button>
    <button onclick="setPalette('neon')" id="btn-neon">Neon</button>
    <button onclick="setPalette('ocean')" id="btn-ocean">Ocean</button>
    <button onclick="setPalette('sunset')" id="btn-sunset">Sunset</button>
    <button onclick="setPalette('monochrome')" id="btn-monochrome">Mono</button>
    <button onclick="toggleAnimation()" id="btn-anim">Pause</button>
  </div>
  
  <p class="info">
    The Apollonian gasket is a fractal generated by recursively filling the interstices 
    between mutually tangent circles. Using Descartes' theorem: (k₁+k₂+k₃+k₄)² = 2(k₁²+k₂²+k₃²+k₄²)
  </p>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // High DPI support
    const dpr = window.devicePixelRatio || 1;
    const size = Math.min(800, window.innerWidth - 40);
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.scale(dpr, dpr);
    
    // State
    let currentPalette = 'gold';
    let isAnimating = true;
    let time = 0;
    
    const palettes = {
      neon: ["#FF006E", "#FB5607", "#FFBE0B", "#8338EC", "#3A86FF"],
      gold: ["#FFD700", "#FFA500", "#FF8C00", "#DAA520", "#B8860B"],
      monochrome: ["#FFFFFF", "#CCCCCC", "#999999", "#666666", "#333333"],
      sunset: ["#FF6B6B", "#FF8E53", "#FE6B8B", "#FF8E53", "#FFA07A"],
      ocean: ["#006994", "#0096C7", "#48CAE4", "#90E0EF", "#CAF0F8"],
    };
    
    // Circle structure
    function createCircle(x, y, r, curvature) {
      return { x, y, r, curvature };
    }
    
    // Generate Apollonian gasket
    function generateGasket(centerX, centerY, size, maxDepth) {
      const circles = [];
      
      // Outer circle
      circles.push(createCircle(centerX, centerY, size, -1/size));
      
      // Three inner circles arranged symmetrically
      const r1 = size * 0.4;
      const d = size * 0.5;
      
      for (let i = 0; i < 3; i++) {
        const angle = i * 2 * Math.PI / 3 - Math.PI/2;
        circles.push(createCircle(
          centerX + d * Math.cos(angle),
          centerY + d * Math.sin(angle),
          r1,
          1/r1
        ));
      }
      
      // Iteratively add circles in the gaps
      for (let depth = 0; depth < maxDepth; depth++) {
        const scale = Math.pow(0.4, depth + 1);
        const count = 3 * Math.pow(2, depth);
        const r = size * scale;
        const dist = size * (0.5 + 0.3 * depth);
        
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * 2 * Math.PI + depth * 0.5;
          const distance = dist * (0.6 + 0.2 * Math.sin(depth));
          
          circles.push(createCircle(
            centerX + distance * Math.cos(angle),
            centerY + distance * Math.sin(angle),
            r,
            1/r
          ));
        }
      }
      
      return circles;
    }
    
    function render() {
      const width = size;
      const height = size;
      const colors = palettes[currentPalette];
      
      // Clear
      ctx.fillStyle = "#0a0a0a";
      ctx.fillRect(0, 0, width, height);
      
      const centerX = width / 2;
      const centerY = height / 2;
      const maxRadius = Math.min(width, height) * 0.45;
      
      const t = isAnimating ? time * 0.001 : 0;
      
      // Generate circles
      const circles = generateGasket(centerX, centerY, maxRadius, 5);
      
      // Sort by size (largest first)
      circles.sort((a, b) => b.r - a.r);
      
      // Draw circles
      circles.forEach((circle, i) => {
        const { x, y, r } = circle;
        
        if (x + r < 0 || x - r > width || y + r < 0 || y - r > height) return;
        
        // Breathing animation
        const breathe = 1 + 0.05 * Math.sin(t + i * 0.5);
        const animatedR = r * breathe;
        
        // Color selection
        const colorIndex = Math.floor(Math.abs(Math.sin(i * 0.7 + t * 0.5)) * colors.length) % colors.length;
        const color = colors[colorIndex];
        
        // Create radial gradient
        const gradient = ctx.createRadialGradient(x, y, 0, x, y, animatedR);
        gradient.addColorStop(0, color + "CC");
        gradient.addColorStop(0.7, color + "66");
        gradient.addColorStop(1, color + "00");
        
        ctx.beginPath();
        ctx.arc(x, y, Math.max(0.5, animatedR), 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.globalAlpha = 1;
        ctx.fill();
        
        // Inner detail for larger circles
        if (r > maxRadius * 0.1) {
          ctx.beginPath();
          ctx.arc(x, y, animatedR * 0.7, 0, Math.PI * 2);
          ctx.strokeStyle = color;
          ctx.lineWidth = 0.5;
          ctx.globalAlpha = 0.3;
          ctx.stroke();
        }
      });
      
      ctx.globalAlpha = 1;
      
      // Connecting lines
      ctx.strokeStyle = colors[0];
      ctx.lineWidth = 0.3;
      ctx.globalAlpha = 0.15;
      
      for (let i = 0; i < circles.length; i++) {
        for (let j = i + 1; j < circles.length; j++) {
          const c1 = circles[i];
          const c2 = circles[j];
          const dist = Math.sqrt((c1.x - c2.x) ** 2 + (c1.y - c2.y) ** 2);
          
          if (dist < maxRadius * 0.3 && dist > 0) {
            ctx.beginPath();
            ctx.moveTo(c1.x, c1.y);
            ctx.lineTo(c2.x, c2.y);
            ctx.stroke();
          }
        }
      }
      
      ctx.globalAlpha = 1;
    }
    
    function animate() {
      if (isAnimating) {
        time += 16;
      }
      render();
      requestAnimationFrame(animate);
    }
    
    // Controls
    function setPalette(palette) {
      currentPalette = palette;
      document.querySelectorAll('.controls button').forEach(btn => {
        if (btn.id.startsWith('btn-') && !btn.id.includes('anim')) {
          btn.classList.remove('active');
        }
      });
      document.getElementById('btn-' + palette).classList.add('active');
    }
    
    function toggleAnimation() {
      isAnimating = !isAnimating;
      document.getElementById('btn-anim').textContent = isAnimating ? 'Pause' : 'Play';
    }
    
    // Start
    animate();
  </script>
</body>
</html>
