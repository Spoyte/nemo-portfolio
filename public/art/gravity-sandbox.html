<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Sandbox — Generative Art</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05050a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .controls {
      margin-top: 20px;
      color: #888;
      font-size: 14px;
    }
    .param-controls {
      margin-top: 16px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      color: #666;
      font-size: 12px;
    }
    .param-controls label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .param-controls input[type="range"] {
      width: 80px;
    }
    .param-controls select {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .buttons {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }
    button {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover {
      background: #2a2a2a;
      color: #aaa;
    }
  </style>
</head>
<body>
  <canvas id="art" width="600" height="600"></canvas>
  <div class="controls">Gravity Sandbox — N-body orbital mechanics simulation</div>
  <div class="param-controls">
    <label>
      Gravity:
      <input type="range" id="gravity" min="0.1" max="5" value="1" step="0.1">
    </label>
    <label>
      Trail Length:
      <input type="range" id="trailLength" min="10" max="100" value="30" step="10">
    </label>
    <label>
      Time Scale:
      <input type="range" id="timeScale" min="0.1" max="2" value="1" step="0.1">
    </label>
    <label>
      Particles:
      <input type="range" id="particleCount" min="3" max="20" value="8" step="1">
    </label>
    <label>
      Color Scheme:
      <select id="colorScheme">
        <option value="cosmic" selected>Cosmic</option>
        <option value="neon">Neon</option>
        <option value="aurora">Aurora</option>
        <option value="fire">Fire</option>
        <option value="ocean">Ocean</option>
      </select>
    </label>
    <label>
      Show Trails:
      <input type="checkbox" id="showTrails" checked>
    </label>
    <label>
      Connections:
      <input type="checkbox" id="showConnections">
    </label>
    <label>
      Animated:
      <input type="checkbox" id="animated" checked>
    </label>
  </div>
  <div class="buttons">
    <button id="regenerate">Reset Simulation</button>
    <button id="download">Download</button>
  </div>

  <script>
    const canvas = document.getElementById('art');
    const ctx = canvas.getContext('2d');
    let animationId;
    let time = 0;
    let particles = [];
    let nextId = 0;
    let initialized = false;

    const palettes = {
      cosmic: ["#FF6B6B", "#4ECDC4", "#45B7D1", "#96CEB4", "#FFEAA7", "#DDA0DD", "#98D8C8"],
      neon: ["#FF006E", "#FB5607", "#FFBE0B", "#8338EC", "#3A86FF", "#06FFB4"],
      aurora: ["#00FF87", "#60EFFF", "#00D9FF", "#0099CC", "#0066AA", "#5D3FD3"],
      fire: ["#FF4500", "#FF6347", "#FF8C00", "#FFA500", "#FFD700", "#FF6B35"],
      ocean: ["#006994", "#0096C7", "#00B4D8", "#48CAE4", "#90E0EF", "#CAF0F8"],
    };

    function createParticle(x, y, mass, color) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.sqrt(mass) * 0.5 + Math.random() * 0.5;
      return {
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        mass,
        radius: Math.sqrt(mass) * 3 + 2,
        color,
        id: nextId++,
      };
    }

    function initializeParticles(count, scheme) {
      particles = [];
      nextId = 0;
      const colors = palettes[scheme] || palettes.cosmic;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // Central massive body (sun)
      const sun = createParticle(centerX, centerY, 50, "#FFD700");
      sun.vx = 0;
      sun.vy = 0;
      particles.push(sun);

      // Orbiting bodies
      for (let i = 0; i < count - 1; i++) {
        const angle = (i / (count - 1)) * Math.PI * 2;
        const distance = 80 + Math.random() * 120;
        const x = centerX + Math.cos(angle) * distance;
        const y = centerY + Math.sin(angle) * distance;
        
        const orbitalSpeed = Math.sqrt(50 / distance) * 2;
        const particle = createParticle(x, y, 5 + Math.random() * 15, colors[i % colors.length]);
        particle.vx = -Math.sin(angle) * orbitalSpeed;
        particle.vy = Math.cos(angle) * orbitalSpeed;
        particles.push(particle);
      }
      initialized = true;
    }

    function updatePhysics(dt, G) {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      
      for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        let fx = 0, fy = 0;
        
        for (let j = 0; j < particles.length; j++) {
          if (i === j) continue;
          const p2 = particles[j];
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const distSq = dx * dx + dy * dy;
          const dist = Math.sqrt(distSq);
          const softening = 20;
          const force = (G * p1.mass * p2.mass) / (distSq + softening * softening);
          fx += (dx / dist) * force;
          fy += (dy / dist) * force;
        }
        
        p1.vx += (fx / p1.mass) * dt;
        p1.vy += (fy / p1.mass) * dt;
      }
      
      for (const p of particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        
        const dx = p.x - centerX;
        const dy = p.y - centerY;
        const distFromCenter = Math.sqrt(dx * dx + dy * dy);
        const maxDist = Math.min(canvas.width, canvas.height) * 0.6;
        
        if (distFromCenter > maxDist) {
          p.vx -= dx * 0.001;
          p.vy -= dy * 0.001;
        }
      }
    }

    function drawParticle(p, showGlow) {
      if (showGlow) {
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 3);
        gradient.addColorStop(0, p.color + "80");
        gradient.addColorStop(0.5, p.color + "20");
        gradient.addColorStop(1, p.color + "00");
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * 3, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
      }
      
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      
      ctx.beginPath();
      ctx.arc(p.x - p.radius * 0.3, p.y - p.radius * 0.3, p.radius * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
      ctx.fill();
    }

    function drawConnections(threshold) {
      ctx.lineWidth = 0.5;
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const p1 = particles[i], p2 = particles[j];
          const dx = p2.x - p1.x, dy = p2.y - p1.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < threshold) {
            const opacity = 1 - dist / threshold;
            ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.3})`;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }
      }
    }

    function render() {
      time += 0.016;
      
      const gravity = parseFloat(document.getElementById('gravity').value);
      const trailLength = parseInt(document.getElementById('trailLength').value);
      const timeScale = parseFloat(document.getElementById('timeScale').value);
      const particleCount = parseInt(document.getElementById('particleCount').value);
      const colorScheme = document.getElementById('colorScheme').value;
      const showTrails = document.getElementById('showTrails').checked;
      const showConnections = document.getElementById('showConnections').checked;
      const animated = document.getElementById('animated').checked;
      
      if (!initialized || particles.length !== particleCount) {
        initializeParticles(particleCount, colorScheme);
      }
      
      // Trail effect
      if (showTrails) {
        const fadeAmount = Math.max(0.05, 1 - trailLength / 100);
        ctx.fillStyle = `rgba(10, 10, 15, ${fadeAmount})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#0a0a0f";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      
      if (animated) {
        updatePhysics(0.5 * timeScale, gravity * 0.5);
      }
      
      if (showConnections) {
        drawConnections(150);
      }
      
      for (const p of particles) {
        drawParticle(p, true);
      }
      
      ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
      ctx.font = "12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`${particles.length} bodies • G=${gravity.toFixed(1)}`, canvas.width / 2, canvas.height - 20);
      
      if (animated) {
        animationId = requestAnimationFrame(render);
      }
    }
    
    render();
    
    document.getElementById('regenerate').addEventListener('click', () => {
      initialized = false;
      particles = [];
      time = 0;
      if (animationId) cancelAnimationFrame(animationId);
      render();
    });
    
    document.getElementById('download').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'gravity-sandbox.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
    
    document.querySelectorAll('input, select').forEach(el => {
      el.addEventListener('change', () => {
        if (animationId) cancelAnimationFrame(animationId);
        render();
      });
    });
  </script>
</body>
</html>
