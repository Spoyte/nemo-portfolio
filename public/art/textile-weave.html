<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textile Weave — Generative Art</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05050a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .controls {
      margin-top: 20px;
      color: #888;
      font-size: 14px;
    }
    .param-controls {
      margin-top: 16px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      color: #666;
      font-size: 12px;
    }
    .param-controls label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .param-controls input[type="range"] { width: 80px; }
    .param-controls select {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .buttons {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }
    button {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #2a2a2a; color: #aaa; }
  </style>
</head>
<body>
  <canvas id="art" width="600" height="600"></canvas>
  <div class="controls">Textile Weave — Characters as threads in digital tapestry</div>
  <div class="param-controls">
    <label>Pattern: <select id="pattern"><option value="plain" selected>Plain</option><option value="twill">Twill</option><option value="satin">Satin</option><option value="basket">Basket</option><option value="leno">Leno</option></select></label>
    <label>Source: <select id="source"><option value="poetry" selected>Poetry</option><option value="code">Code</option><option value="nature">Nature</option><option value="abstract">Abstract</option><option value="custom">Custom</option></select></label>
    <label>Colors: <select id="colors"><option value="natural" selected>Natural</option><option value="neon">Neon</option><option value="sepia">Sepia</option><option value="mono">Mono</option><option value="rainbow">Rainbow</option></select></label>
    <label>Density: <input type="range" id="density" min="10" max="50" value="25"></label>
    <label>Speed: <input type="range" id="speed" min="0" max="100" value="20"></label>
    <label>Animated: <input type="checkbox" id="animated" checked></label>
  </div>
  <div class="buttons"><button id="regenerate">Reweave</button><button id="download">Download</button></div>
  <script>
    const canvas = document.getElementById('art'), ctx = canvas.getContext('2d');
    let animationId, time = 0, chars = [], warp = [], weft = [];
    const sources = {
      poetry: "the quick brown fox jumps over the lazy dog while stars dance in velvet skies above whispering trees",
      code: "function weave() { return threads.map(t => t.interlace()); } const warp = []; const weft = [];",
      nature: "wind through grass river flowing mountain stone forest deep ocean wave bird flight sun rise",
      abstract: "0123456789 +-*/= <>[]{} ()&|!@#$% ^~`;:., abcdefghijklmnopqrstuvwxyz",
      custom: "TEXTILE WEAVE DIGITAL THREADS WOVEN PATTERNS INTERLACED CHARACTERS FABRIC OF CODE"
    };
    const palettes = {
      natural: ["#8B4513","#D2691E","#CD853F","#DEB887","#F5DEB3","#BC8F8F"],
      neon: ["#FF006E","#FB5607","#FFBE0B","#8338EC","#3A86FF","#06FFB4"],
      sepia: ["#704214","#8B5A2B","#A0522D","#CD853F","#DEB887","#F4A460"],
      mono: ["#000000","#333333","#666666","#999999","#CCCCCC","#FFFFFF"],
      rainbow: ["#FF0000","#FF7F00","#FFFF00","#00FF00","#0000FF","#8B00FF"]
    };
    function init(){const s=sources[document.getElementById('source').value],d=parseInt(document.getElementById('density').value);chars=s.split('').filter(c=>c!==' ');warp=[];weft=[];for(let i=0;i<d;i++){let r=[];for(let j=0;j<d;j++)r.push(chars[Math.floor(Math.random()*chars.length)]);warp.push(r);}for(let i=0;i<d;i++){let r=[];for(let j=0;j<d;j++)r.push(chars[Math.floor(Math.random()*chars.length)]);weft.push(r);}}
    function draw(){const p=document.getElementById('pattern').value,c=document.getElementById('colors').value,sp=parseInt(document.getElementById('speed').value)/1000;time+=sp;const pal=palettes[c],d=warp.length,w=600/d,h=600/d;ctx.fillStyle="#0a0a0f";ctx.fillRect(0,0,600,600);ctx.font=`${h*0.7}px monospace`;ctx.textAlign="center";ctx.textBaseline="middle";for(let y=0;y<d;y++)for(let x=0;x<d;x++){let showWarp=true
