<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowing Magnetism — Generative Art</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050508;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      border-radius: 8px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.8);
    }
    .controls {
      margin-top: 20px;
      color: #666;
      font-size: 14px;
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select, input[type="range"] {
      background: #1a1a1f;
      border: 1px solid #333;
      color: #888;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 13px;
    }
    input[type="range"] {
      width: 100px;
    }
    label {
      color: #888;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="art" width="600" height="600"></canvas>
  <div class="controls">
    <span>Flowing Magnetism</span>
    <div class="control-group">
      <label>Theme:</label>
      <select id="colorScheme">
        <option value="aurora" selected>Aurora</option>
        <option value="plasma">Plasma</option>
        <option value="embers">Embers</option>
        <option value="ocean">Ocean</option>
      </select>
    </div>
    <div class="control-group">
      <label>Particles:</label>
      <input type="range" id="particleCount" min="200" max="1500" value="800">
    </div>
    <div class="control-group">
      <label>Trails:</label>
      <input type="range" id="trailLength" min="10" max="100" value="40">
    </div>
  </div>

  <script>
    const canvas = document.getElementById('art');
    const ctx = canvas.getContext('2d');
    
    const params = {
      particleCount: 800,
      fieldStrength: 50,
      colorScheme: 'aurora',
      trailLength: 40,
      speed: 30,
    };

    // UI controls
    document.getElementById('colorScheme').addEventListener('change', (e) => {
      params.colorScheme = e.target.value;
      resetParticles();
    });
    document.getElementById('particleCount').addEventListener('input', (e) => {
      params.particleCount = parseInt(e.target.value);
      resetParticles();
    });
    document.getElementById('trailLength').addEventListener('input', (e) => {
      params.trailLength = parseInt(e.target.value);
    });

    const palettes = {
      aurora: { hueBase: 160, hueRange: 80, saturation: 80, lightness: 60 },
      plasma: { hueBase: 280, hueRange: 60, saturation: 90, lightness: 55 },
      embers: { hueBase: 20, hueRange: 40, saturation: 100, lightness: 55 },
      ocean: { hueBase: 200, hueRange: 40, saturation: 70, lightness: 50 },
    };

    let particles = [];
    let magnets = [];
    let trailCanvas = null;
    let trailCtx = null;

    function createParticle() {
      const palette = palettes[params.colorScheme];
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * Math.min(canvas.width, canvas.height) * 0.45;
      return {
        x: canvas.width / 2 + Math.cos(angle) * radius,
        y: canvas.height / 2 + Math.sin(angle) * radius,
        vx: 0,
        vy: 0,
        life: 0,
        maxLife: 100 + Math.random() * 150,
        hue: palette.hueBase + (Math.random() - 0.5) * 40,
      };
    }

    function getFieldVector(x, y) {
      let fx = 0, fy = 0;
      for (const magnet of magnets) {
        const dx = x - magnet.x;
        const dy = y - magnet.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);
        if (dist < 5) continue;
        const force = (params.fieldStrength * magnet.polarity) / (distSq + 100);
        fx += (-dy / dist) * force;
        fy += (dx / dist) * force;
      }
      return { dx: fx, dy: fy };
    }

    function resetParticles() {
      particles = [];
      for (let i = 0; i < params.particleCount; i++) {
        particles.push(createParticle());
      }
    }

    function init() {
      const magnetRadius = Math.min(canvas.width, canvas.height) * 0.2;
      magnets = [
        { x: canvas.width / 2 - magnetRadius, y: canvas.height / 2, polarity: 1 },
        { x: canvas.width / 2 + magnetRadius, y: canvas.height / 2, polarity: -1 },
      ];
      
      trailCanvas = document.createElement('canvas');
      trailCanvas.width = canvas.width;
      trailCanvas.height = canvas.height;
      trailCtx = trailCanvas.getContext('2d');
      trailCtx.fillStyle = '#050508';
      trailCtx.fillRect(0, 0, canvas.width, canvas.height);
      
      resetParticles();
    }

    function render(time) {
      const t = time * params.speed * 0.001;
      const palette = palettes[params.colorScheme];
      const width = canvas.width;
      const height = canvas.height;

      // Update magnet positions
      const magnetRadius = Math.min(width, height) * 0.2;
      const rotationSpeed = 0.3;
      magnets[0].x = width / 2 + Math.cos(t * rotationSpeed) * magnetRadius;
      magnets[0].y = height / 2 + Math.sin(t * rotationSpeed) * magnetRadius * 0.5;
      magnets[1].x = width / 2 + Math.cos(t * rotationSpeed + Math.PI) * magnetRadius;
      magnets[1].y = height / 2 + Math.sin(t * rotationSpeed + Math.PI) * magnetRadius * 0.5;

      // Fade trail
      trailCtx.fillStyle = `rgba(5, 5, 8, ${1 / params.trailLength})`;
      trailCtx.fillRect(0, 0, width, height);

      // Update and draw particles
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        
        const field = getFieldVector(p.x, p.y);
        const noiseScale = 0.003;
        const nx = Math.sin(p.y * noiseScale + t * 0.5) * Math.cos(p.x * noiseScale);
        const ny = Math.cos(p.x * noiseScale + t * 3) * Math.sin(p.y * noiseScale);
        
        p.vx += field.dx * 0.1 + nx * 0.5;
        p.vy += field.dy * 0.1 + ny * 0.5;
        p.vx *= 0.95;
        p.vy *= 0.95;
        
        p.x += p.vx;
        p.y += p.vy;
        p.life++;

        const lifeRatio = p.life / p.maxLife;
        const alpha = Math.sin(lifeRatio * Math.PI);
        const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        const hueShift = speed * 10;
        
        const hue = (p.hue + hueShift + t * 10) % 360;
        const lightness = palette.lightness + speed * 5;

        trailCtx.beginPath();
        trailCtx.arc(p.x, p.y, 1 + speed * 0.3, 0, Math.PI * 2);
        trailCtx.fillStyle = `hsla(${hue}, ${palette.saturation}%, ${lightness}%, ${alpha * 0.6})`;
        trailCtx.fill();

        if (p.life >= p.maxLife || p.x < -50 || p.x > width + 50 || p.y < -50 || p.y > height + 50) {
          particles[i] = createParticle();
          const magnet = magnets[Math.floor(Math.random() * magnets.length)];
          const angle = Math.random() * Math.PI * 2;
          const dist = 20 + Math.random() * 30;
          particles[i].x = magnet.x + Math.cos(angle) * dist;
          particles[i].y = magnet.y + Math.sin(angle) * dist;
        }
      }

      // Draw magnets
      for (const magnet of magnets) {
        const color = magnet.polarity > 0 ? '#ff4444' : '#4444ff';
        const gradient = trailCtx.createRadialGradient(magnet.x, magnet.y, 0, magnet.x, magnet.y, 20);
        gradient.addColorStop(0, color + '88');
        gradient.addColorStop(1, color + '00');
        trailCtx.fillStyle = gradient;
        trailCtx.beginPath();
        trailCtx.arc(magnet.x, magnet.y, 20, 0, Math.PI * 2);
        trailCtx.fill();
        
        trailCtx.fillStyle = color;
        trailCtx.beginPath();
        trailCtx.arc(magnet.x, magnet.y, 4, 0, Math.PI * 2);
        trailCtx.fill();
      }

      ctx.drawImage(trailCanvas, 0, 0);
      requestAnimationFrame(render);
    }

    init();
    requestAnimationFrame(render);
  </script>
</body>
</html>
