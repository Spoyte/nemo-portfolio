<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Caverns — Generative Art</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      padding: 20px;
    }
    .container {
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .subtitle {
      color: #888;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }
    canvas {
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      max-width: 100%;
      height: auto;
    }
    .controls {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
    }
    input[type="range"] {
      width: 120px;
    }
    select {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Light Caverns</h1>
    <p class="subtitle">Volumetric light rays through crystalline cave structures</p>
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="controls">
      <div class="control-group">
        <label>Light Rays</label>
        <input type="range" id="rayCount" min="4" max="24" value="12">
      </div>
      <div class="control-group">
        <label>Cavern Depth</label>
        <input type="range" id="cavernDepth" min="10" max="90" value="50">
      </div>
      <div class="control-group">
        <label>Crystal Density</label>
        <input type="range" id="crystalDensity" min="10" max="80" value="40">
      </div>
      <div class="control-group">
        <label>Crystal Type</label>
        <select id="colorScheme">
          <option value="emerald">Emerald</option>
          <option value="amethyst">Amethyst</option>
          <option value="sapphire">Sapphire</option>
          <option value="amber">Amber</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Parameters
    const params = {
      rayCount: 12,
      cavernDepth: 50,
      crystalDensity: 40,
      colorScheme: 'emerald',
    };
    
    // Color palettes
    const palettes = {
      emerald: [[5, 20, 10], [20, 80, 40], [60, 200, 100], [150, 255, 180], [200, 255, 220]],
      amethyst: [[15, 5, 20], [60, 20, 80], [150, 60, 200], [220, 150, 255], [240, 200, 255]],
      sapphire: [[5, 10, 25], [15, 40, 100], [40, 100, 220], [100, 180, 255], [180, 220, 255]],
      amber: [[25, 10, 5], [80, 40, 10], [200, 120, 20], [255, 200, 80], [255, 240, 180]],
    };
    
    // UI bindings
    document.getElementById('rayCount').addEventListener('input', (e) => {
      params.rayCount = parseInt(e.target.value);
    });
    document.getElementById('cavernDepth').addEventListener('input', (e) => {
      params.cavernDepth = parseInt(e.target.value);
    });
    document.getElementById('crystalDensity').addEventListener('input', (e) => {
      params.crystalDensity = parseInt(e.target.value);
    });
    document.getElementById('colorScheme').addEventListener('change', (e) => {
      params.colorScheme = e.target.value;
    });
    
    function render(time) {
      const t = time * 0.0005;
      const width = canvas.width;
      const height = canvas.height;
      
      // Clear with deep void
      ctx.fillStyle = '#050508';
      ctx.fillRect(0, 0, width, height);
      
      // Get pixel data
      const imageData = ctx.getImageData(0, 0, width, height);
      const pixels = imageData.data;
      
      const palette = palettes[params.colorScheme];
      
      // Generate light ray sources
      const rays = [];
      for (let i = 0; i < params.rayCount; i++) {
        rays.push({
          x: (width / (params.rayCount + 1)) * (i + 1) + Math.sin(t + i * 0.5) * 20,
          angle: Math.PI / 2 + Math.sin(t * 0.3 + i) * 0.15,
          intensity: 0.6 + Math.sin(t * 0.7 + i * 1.3) * 0.3,
          width: 30 + Math.sin(t * 0.5 + i * 0.8) * 15,
        });
      }
      
      // Generate crystal formations
      const crystals = [];
      const crystalCount = Math.floor(params.crystalDensity * 1.5);
      for (let i = 0; i < crystalCount; i++) {
        const cx = (width / crystalCount) * i + Math.sin(i * 2.5) * 30;
        const isTop = i % 2 === 0;
        crystals.push({
          x: cx,
          y: isTop ? 0 : height,
          size: 20 + Math.sin(i * 1.7) * 15 + params.crystalDensity * 0.3,
          phase: i * 0.5 + t,
        });
      }
      
      // Sample every 2x2 pixels
      for (let y = 0; y < height; y += 2) {
        for (let x = 0; x < width; x += 2) {
          let brightness = 0;
          let depthFactor = 1;
          
          // Calculate volumetric light contribution
          for (const ray of rays) {
            const rayDx = x - ray.x;
            const rayDy = y;
            
            const rayDirX = Math.sin(ray.angle);
            const rayDirY = Math.cos(ray.angle);
            
            const perpDist = Math.abs(rayDx * rayDirY - rayDy * rayDirX);
            const alongRay = rayDx * rayDirX + rayDy * rayDirY;
            
            if (alongRay > 0 && alongRay < height * 1.5) {
              const scatter = Math.exp(-perpDist / ray.width) * Math.exp(-alongRay / (height * 0.8));
              brightness += scatter * ray.intensity * 0.4;
            }
          }
          
          // Cavern depth effect
          const centerDist = Math.abs(x - width / 2) / (width / 2);
          depthFactor = 1 - centerDist * (params.cavernDepth / 100);
          
          // Crystal glow
          for (const crystal of crystals) {
            const cdx = x - crystal.x;
            const cdy = y - crystal.y;
            const cDist = Math.sqrt(cdx * cdx + cdy * cdy);
            
            if (cDist < crystal.size) {
              const crystalGlow = (1 - cDist / crystal.size) * 0.3 * (0.5 + Math.sin(crystal.phase) * 0.5);
              brightness += crystalGlow;
            }
          }
          
          // Dust motes noise
          const noise = Math.sin(x * 0.1 + t) * Math.cos(y * 0.1 + t * 0.7) * 0.05;
          brightness += noise;
          
          brightness *= depthFactor;
          brightness = Math.max(0, Math.min(1, brightness));
          brightness = Math.pow(brightness, 0.7);
          
          const colorIndex = Math.min(Math.floor(brightness * (palette.length - 1)), palette.length - 2);
          const colorT = brightness * (palette.length - 1) - colorIndex;
          
          const [r1, g1, b1] = palette[colorIndex];
          const [r2, g2, b2] = palette[colorIndex + 1] || palette[colorIndex];
          
          const r = Math.floor(r1 + (r2 - r1) * colorT);
          const g = Math.floor(g1 + (g2 - g1) * colorT);
          const b = Math.floor(b1 + (b2 - b1) * colorT);
          
          // Fill 2x2 block
          for (let dy = 0; dy < 2 && y + dy < height; dy++) {
            for (let dx = 0; dx < 2 && x + dx < width; dx++) {
              const idx = ((y + dy) * width + (x + dx)) * 4;
              pixels[idx] = r;
              pixels[idx + 1] = g;
              pixels[idx + 2] = b;
              pixels[idx + 3] = 255;
            }
          }
        }
      }
      
      ctx.putImageData(imageData, 0, 0);
      
      // Crystal highlights
      ctx.globalCompositeOperation = 'screen';
      for (const crystal of crystals) {
        const gradient = ctx.createLinearGradient(
          crystal.x, crystal.y,
          crystal.x + Math.sin(crystal.phase) * 10, 
          crystal.y + (crystal.y === 0 ? 1 : -1) * crystal.size
        );
        
        const [,,, bright] = palette[palette.length - 1];
        gradient.addColorStop(0, `rgba(${bright}, ${bright}, ${bright}, 0.3)`);
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(crystal.x - crystal.size * 0.3, crystal.y);
        ctx.lineTo(crystal.x, crystal.y + (crystal.y === 0 ? 1 : -1) * crystal.size);
        ctx.lineTo(crystal.x + crystal.size * 0.3, crystal.y);
        ctx.closePath();
        ctx.fill();
      }
      
      ctx.globalCompositeOperation = 'source-over';
      requestAnimationFrame(render);
    }
    
    requestAnimationFrame(render);
  </script>
</body>
</html>
