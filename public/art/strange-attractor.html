<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strange Attractor — Generative Art</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05050a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .controls {
      margin-top: 20px;
      color: #888;
      font-size: 14px;
    }
    .param-controls {
      margin-top: 16px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      color: #666;
      font-size: 12px;
    }
    .param-controls label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .param-controls input[type="range"] {
      width: 80px;
    }
    .param-controls select {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #333;
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <canvas id="art" width="600" height="600"></canvas>
  <div class="controls">Strange Attractor — Mathematical chaos as flowing particle trails</div>
  <div class="param-controls">
    <label>
      Type:
      <select id="attractorType">
        <option value="lorenz">Lorenz</option>
        <option value="rossler">Rössler</option>
        <option value="aizawa">Aizawa</option>
        <option value="thomas">Thomas</option>
      </select>
    </label>
    <label>
      Particles:
      <input type="range" id="particleCount" min="500" max="3000" value="1500" step="100">
    </label>
    <label>
      Trail:
      <input type="range" id="trailLength" min="20" max="120" value="60" step="10">
    </label>
    <label>
      Speed:
      <input type="range" id="speed" min="1" max="20" value="5" step="1">
    </label>
    <label>
      Zoom:
      <input type="range" id="zoom" min="5" max="20" value="10" step="1">
    </label>
    <label>
      Theme:
      <select id="colorScheme">
        <option value="fire">Fire</option>
        <option value="ocean">Ocean</option>
        <option value="neon">Neon</option>
        <option value="gold">Gold</option>
      </select>
    </label>
  </div>

  <script>
    const canvas = document.getElementById('art');
    const ctx = canvas.getContext('2d');
    
    // Parameters
    const params = {
      attractorType: 'lorenz',
      particleCount: 1500,
      trailLength: 60,
      speed: 5,
      zoom: 10,
      rotationSpeed: 0.3,
      colorScheme: 'fire'
    };
    
    // Color schemes
    const colorSchemes = {
      fire: [
        [0, 0, 0], [40, 0, 0], [80, 0, 0], [120, 20, 0],
        [180, 40, 0], [220, 80, 0], [255, 120, 0],
        [255, 160, 20], [255, 200, 40], [255, 240, 80], [255, 255, 120]
      ],
      ocean: [
        [0, 0, 20], [0, 20, 40], [0, 40, 60], [0, 60, 100],
        [0, 80, 140], [20, 100, 160], [40, 140, 180],
        [60, 160, 200], [100, 180, 220], [140, 200, 240], [180, 220, 255]
      ],
      neon: [
        [10, 0, 20], [30, 0, 60], [60, 0, 100], [100, 0, 140],
        [140, 20, 180], [180, 40, 200], [200, 60, 220],
        [220, 100, 240], [240, 140, 255], [255, 180, 255], [255, 220, 255]
      ],
      gold: [
        [10, 5, 0], [30, 15, 0], [60, 30, 0], [100, 60, 0],
        [140, 90, 10], [180, 120, 20], [200, 150, 30],
        [220, 180, 40], [240, 200, 60], [250, 220, 80], [255, 240, 100]
      ]
    };
    
    // Attractor parameters
    function getAttractorParams(type) {
      switch (type) {
        case 'lorenz': return { sigma: 10, rho: 28, beta: 8/3 };
        case 'rossler': return { a: 0.2, b: 0.2, c: 5.7 };
        case 'aizawa': return { a: 0.95, b: 0.7, c: 0.6 };
        case 'thomas': return { a: 0.1 };
        default: return {};
      }
    }
    
    // Compute next position based on attractor equations
    function computeAttractor(x, y, z, type, p) {
      const dt = 0.01 * (params.speed / 5);
      let dx = 0, dy = 0, dz = 0;
      
      switch (type) {
        case 'lorenz':
          dx = p.sigma * (y - x);
          dy = x * (p.rho - z) - y;
          dz = x * y - p.beta * z;
          break;
        case 'rossler':
          dx = -y - z;
          dy = x + p.a * y;
          dz = p.b + z * (x - p.c);
          break;
        case 'aizawa':
          const d = 3.5, e = 0.25, f = 0.1;
          dx = (z - p.b) * x - d * y;
          dy = d * x + (z - p.b) * y;
          dz = p.c + p.a * z - (z*z*z)/3 - (x*x + y*y) * (1 + e*z) + f*z*(x*x*x);
          break;
        case 'thomas':
          dx = Math.sin(y) - p.a * x;
          dy = Math.sin(z) - p.a * y;
          dz = Math.sin(x) - p.a * z;
          break;
      }
      
      return [x + dx * dt, y + dy * dt, z + dz * dt];
    }
    
    // Particles array
    let particles = [];
    let attractorParams = {};
    let time = 0;
    
    function initParticles() {
      particles = [];
      attractorParams = getAttractorParams(params.attractorType);
      const seedOffset = params.attractorType === 'lorenz' ? 10 : 1;
      
      for (let i = 0; i < params.particleCount; i++) {
        const angle = (i / params.particleCount) * Math.PI * 2;
        const radius = Math.random() * seedOffset;
        particles.push({
          x: Math.cos(angle) * radius,
          y: Math.sin(angle) * radius,
          z: Math.random() * seedOffset * 2 - seedOffset,
          trail: []
        });
      }
      
      // Pre-warm particles to build initial trails
      const warmSteps = params.trailLength * 2;
      for (let step = 0; step < warmSteps; step++) {
        for (const p of particles) {
          const [nx, ny, nz] = computeAttractor(p.x, p.y, p.z, params.attractorType, attractorParams);
          p.x = nx;
          p.y = ny;
          p.z = nz;
          if (step % 2 === 0) {
            p.trail.push([p.x, p.y, p.z]);
            if (p.trail.length > params.trailLength) {
              p.trail.shift();
            }
          }
        }
      }
    }
    
    function drawLine(x1, y1, x2, y2, r, g, b, alpha) {
      const gradient = ctx.createLinearGradient(x1, y1, x2, y2);
      gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha / 255})`);
      gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, ${alpha / 255 * 0.5})`);
      ctx.strokeStyle = gradient;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
    
    function render() {
      // Fade background for trail effect
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        data[i] = Math.max(0, data[i] - 3);
        data[i + 1] = Math.max(0, data[i + 1] - 3);
        data[i + 2] = Math.max(0, data[i + 2] - 3);
      }
      ctx.putImageData(imageData, 0, 0);
      
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const zoom = params.zoom;
      const rotAngle = time * params.rotationSpeed * 0.001;
      const cosR = Math.cos(rotAngle);
      const sinR = Math.sin(rotAngle);
      const colors = colorSchemes[params.colorScheme];
      
      // Update and draw particles
      for (const p of particles) {
        // Evolve particle
        const [nx, ny, nz] = computeAttractor(p.x, p.y, p.z, params.attractorType, attractorParams);
        p.x = nx;
        p.y = ny;
        p.z = nz;
        p.trail.push([p.x, p.y, p.z]);
        if (p.trail.length > params.trailLength) {
          p.trail.shift();
        }
        
        // Draw trail
        for (let i = 0; i < p.trail.length - 1; i++) {
          const [x1, y1, z1] = p.trail[i];
          const [x2, y2, z2] = p.trail[i + 1];
          
          // 3D rotation around Y axis
          const rx1 = x1 * cosR - z1 * sinR;
          const rz1 = x1 * sinR + z1 * cosR;
          const rx2 = x2 * cosR - z2 * sinR;
          const rz2 = x2 * sinR + z2 * cosR;
          
          // Project to 2D with perspective
          const perspective1 = 200 / (200 + rz1);
          const perspective2 = 200 / (200 + rz2);
          
          const px1 = Math.floor(cx + rx1 * zoom * perspective1);
          const py1 = Math.floor(cy + y1 * zoom * perspective1);
          const px2 = Math.floor(cx + rx2 * zoom * perspective2);
          const py2 = Math.floor(cy + y2 * zoom * perspective2);
          
          // Color based on trail position and depth
          const trailProgress = i / p.trail.length;
          const depthFactor = Math.max(0, Math.min(1, (rz1 + 30) / 60));
          const colorIdx = Math.floor((trailProgress * 0.7 + depthFactor * 0.3) * (colors.length - 1));
          const [r, g, b] = colors[Math.max(0, Math.min(colors.length - 1, colorIdx))];
          const alpha = Math.floor(trailProgress * 200 + 55);
          
          drawLine(px1, py1, px2, py2, r, g, b, alpha);
        }
      }
      
      time += 16;
      requestAnimationFrame(render);
    }
    
    // UI controls
    document.getElementById('attractorType').addEventListener('change', (e) => {
      params.attractorType = e.target.value;
      initParticles();
    });
    document.getElementById('particleCount').addEventListener('input', (e) => {
      params.particleCount = parseInt(e.target.value);
      initParticles();
    });
    document.getElementById('trailLength').addEventListener('input', (e) => {
      params.trailLength = parseInt(e.target.value);
      initParticles();
    });
    document.getElementById('speed').addEventListener('input', (e) => {
      params.speed = parseInt(e.target.value);
    });
    document.getElementById('zoom').addEventListener('input', (e) => {
      params.zoom = parseInt(e.target.value);
    });
    document.getElementById('colorScheme').addEventListener('change', (e) => {
      params.colorScheme = e.target.value;
    });
    
    // Initialize and start
    initParticles();
    render();
  </script>
</body>
</html>
