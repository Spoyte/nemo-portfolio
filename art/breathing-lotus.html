<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathing Lotus — Generative Art</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(180deg, #0d0d12 0%, #1a1218 50%, #0f0f15 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'SF Mono', Monaco, monospace;
            overflow: hidden;
            color: #b0a0a0;
        }
        
        canvas {
            box-shadow: 
                0 0 80px rgba(200, 120, 140, 0.12),
                0 0 160px rgba(200, 120, 140, 0.05);
            border-radius: 50%;
            cursor: pointer;
        }
        
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            background: rgba(25, 20, 25, 0.9);
            border: 1px solid rgba(200, 120, 140, 0.3);
            color: #c0a0a0;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            font-family: inherit;
        }
        
        button:hover {
            background: rgba(40, 30, 35, 0.9);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(200, 120, 140, 0.2);
        }
        
        button.active {
            background: rgba(200, 120, 140, 0.25);
            border-color: rgba(220, 140, 160, 0.6);
            color: #f0d0d0;
        }
        
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(180, 150, 150, 0.5);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .breath-guide {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(240, 200, 200, 0.15);
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            pointer-events: none;
            text-align: center;
            transition: opacity 0.5s ease;
        }
        
        .breath-guide.inhale {
            color: rgba(240, 200, 200, 0.4);
            text-shadow: 0 0 20px rgba(240, 200, 200, 0.3);
        }
        
        .breath-guide.hold {
            color: rgba(200, 180, 180, 0.3);
        }
        
        .breath-guide.exhale {
            color: rgba(180, 160, 160, 0.25);
        }

        .hint {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(180, 150, 150, 0.35);
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="info">Breathing Lotus — Generative Art</div>
    <div class="breath-guide" id="breathGuide">Inhale</div>
    <div class="hint">Breathe with the lotus</div>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <button onclick="toggleBreathing()" id="breatheBtn" class="active">Guide: On</button>
        <button onclick="changeSpeed()">Speed</button>
        <button onclick="toggleZen()" id="zenBtn">Zen Mode</button>
        <button onclick="changePalette()">Palette</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Canvas size
        const size = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.8, 700);
        canvas.width = size;
        canvas.height = size;
        
        const cx = size / 2;
        const cy = size / 2;
        
        // Golden ratio for organic growth
        const PHI = 1.618033988749895;
        
        // State
        let time = 0;
        let breathingEnabled = true;
        let zenMode = false;
        let breathPhase = 0; // 0-1 cycle
        let breathSpeed = 0.003; // Base breathing speed
        let speedMultiplier = 1;
        let paletteIndex = 0;
        
        // Petals
        const numPetals = 8;
        const petalLayers = 5;
        
        // Color palettes
        const palettes = [
            { // Dawn
                name: 'dawn',
                center: '#2d1f2d',
                petals: ['#e8b4b4', '#d4a5a5', '#c09090', '#a07070', '#805050'],
                glow: 'rgba(232, 180, 180, 0.2)',
                bg: ['#0d0d12', '#1a1218']
            },
            { // Twilight
                name: 'twilight',
                center: '#1f1f2d',
                petals: ['#a29bfe', '#b8b0ff', '#6c5ce7', '#8e7bff', '#5b4bc4'],
                glow: 'rgba(162, 155, 254, 0.2)',
                bg: ['#0a0a15', '#121220']
            },
            { // Sage
                name: 'sage',
                center: '#1a2d1f',
                petals: ['#a8e6cf', '#88d8b0', '#68c9a0', '#48ba90', '#2eab80'],
                glow: 'rgba(168, 230, 207, 0.2)',
                bg: ['#0a120d', '#121a15']
            },
            { // Ember
                name: 'ember',
                center: '#2d1a15',
                petals: ['#ff6b6b', '#ff8e72', '#ffb347', '#ffd700', '#ff6347'],
                glow: 'rgba(255, 107, 107, 0.2)',
                bg: ['#150a08', '#201210']
            },
            { // Monochrome
                name: 'monochrome',
                center: '#1a1a1a',
                petals: ['#ffffff', '#d0d0d0', '#a0a0a0', '#707070', '#505050'],
                glow: 'rgba(255, 255, 255, 0.15)',
                bg: ['#0a0a0a', '#121212']
            }
        ];
        
        // Breathing cycle: 4-7-8 technique (inhale 4, hold 7, exhale 8)
        // Normalized to 0-1: inhale 0-0.235, hold 0.235-0.647, exhale 0.647-1.0
        function getBreathState(phase) {
            if (phase < 0.235) {
                return { state: 'inhale', progress: phase / 0.235 };
            } else if (phase < 0.647) {
                return { state: 'hold', progress: (phase - 0.235) / 0.412 };
            } else {
                return { state: 'exhale', progress: (phase - 0.647) / 0.353 };
            }
        }
        
        function drawPetal(ctx, angle, layer, scale, breathState, palette) {
            const layerScale = 1 - (layer * 0.15);
            const baseRadius = size * 0.12 * layerScale * scale;
            const petalWidth = baseRadius * 0.6;
            
            // Organic deformation based on breath
            const breathWobble = Math.sin(time * 0.02 + layer * 0.5) * 0.03;
            const breathScale = breathingEnabled ? 
                (breathState.state === 'inhale' ? 0.7 + breathState.progress * 0.4 :
                 breathState.state === 'hold' ? 1.1 :
                 1.1 - breathState.progress * 0.4) : 0.9;
            
            const currentRadius = baseRadius * breathScale * (1 + breathWobble);
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle + layer * 0.1 + Math.sin(time * 0.01) * 0.02);
            
            // Petal gradient
            const gradient = ctx.createRadialGradient(
                0, 0, 0,
                0, 0, currentRadius
            );
            const color = palette.petals[layer % palette.petals.length];
            const alpha = 0.9 - (layer * 0.12);
            gradient.addColorStop(0, hexToRgba(color, alpha));
            gradient.addColorStop(0.7, hexToRgba(color, alpha * 0.6));
            gradient.addColorStop(1, hexToRgba(color, 0));
            
            // Draw organic petal shape
            ctx.beginPath();
            ctx.moveTo(0, 0);
            
            // Bezier curves for organic petal
            const cp1x = -petalWidth * 0.5;
            const cp1y = currentRadius * 0.3;
            const cp2x = -petalWidth * 0.3;
            const cp2y = currentRadius * 0.9;
            const endX = 0;
            const endY = currentRadius;
            
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, endX, endY);
            ctx.bezierCurveTo(-cp2x, cp2y, -cp1x, cp1y, 0, 0);
            
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Petal edge highlight
            ctx.strokeStyle = hexToRgba(color, alpha * 0.3);
            ctx.lineWidth = 0.5;
            ctx.stroke();
            
            ctx.restore();
        }
        
        function drawCenter(ctx, scale, breathState, palette) {
            const baseRadius = size * 0.06;
            const breathScale = breathingEnabled ?
                (breathState.state === 'inhale' ? 0.8 + breathState.progress * 0.3 :
                 breathState.state === 'hold' ? 1.1 :
                 1.1 - breathState.progress * 0.3) : 1.0;
            
            const radius = baseRadius * breathScale * scale;
            
            // Center gradient
            const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
            gradient.addColorStop(0, hexToRgba(palette.center, 1));
            gradient.addColorStop(0.5, hexToRgba(palette.center, 0.8));
            gradient.addColorStop(1, hexToRgba(palette.center, 0));
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Center glow pulse
            const glowRadius = radius * (1.5 + Math.sin(time * 0.03) * 0.2);
            const glow = ctx.createRadialGradient(cx, cy, radius * 0.5, cx, cy, glowRadius);
            glow.addColorStop(0, hexToRgba(palette.petals[0], 0.3));
            glow.addColorStop(1, hexToRgba(palette.petals[0], 0));
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(cx, cy, glowRadius, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawWaterRipples(ctx, breathState, palette) {
            if (zenMode) return;
            
            const numRipples = 3;
            const breathScale = breathingEnabled ?
                (breathState.state === 'inhale' ? breathState.progress :
                 breathState.state === 'hold' ? 1 :
                 1 - breathState.progress) : 0.5;
            
            for (let i = 0; i < numRipples; i++) {
                const ripplePhase = (time * 0.01 + i * 0.33) % 1;
                const radius = size * 0.2 + ripplePhase * size * 0.4;
                const alpha = (1 - ripplePhase) * 0.1 * breathScale;
                
                ctx.strokeStyle = hexToRgba(palette.petals[2], alpha);
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
        
        function drawParticles(ctx, breathState, palette) {
            if (zenMode) return;
            
            const numParticles = 20;
            const breathScale = breathingEnabled ?
                (breathState.state === 'inhale' ? 0.5 + breathState.progress * 0.5 :
                 breathState.state === 'hold' ? 1 :
                 1 - breathState.progress * 0.5) : 0.7;
            
            for (let i = 0; i < numParticles; i++) {
                const angle = (time * 0.005 + i * (Math.PI * 2 / numParticles)) % (Math.PI * 2);
                const dist = size * 0.25 + Math.sin(time * 0.01 + i) * size * 0.1;
                const x = cx + Math.cos(angle) * dist;
                const y = cy + Math.sin(angle) * dist;
                const size_p = (1 + Math.sin(time * 0.02 + i)) * 1.5 * breathScale;
                
                ctx.beginPath();
                ctx.arc(x, y, size_p, 0, Math.PI * 2);
                ctx.fillStyle = hexToRgba(palette.petals[i % palette.petals.length], 0.4 * breathScale);
                ctx.fill();
            }
        }
        
        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        
        function updateBreathGuide(breathState) {
            const guide = document.getElementById('breathGuide');
            guide.textContent = breathState.state;
            guide.className = 'breath-guide ' + breathState.state;
        }
        
        function draw() {
            const palette = palettes[paletteIndex];
            const breathState = getBreathState(breathPhase);
            
            // Update breath phase
            breathPhase += breathSpeed * speedMultiplier;
            if (breathPhase >= 1) breathPhase = 0;
            
            // Update guide
            if (breathingEnabled) {
                updateBreathGuide(breathState);
            } else {
                document.getElementById('breathGuide').style.opacity = '0';
            }
            
            // Clear canvas
            ctx.fillStyle = zenMode ? palette.bg[0] : 'rgba(13, 13, 18, 0.15)';
            ctx.fillRect(0, 0, size, size);
            
            // Background gradient
            if (!zenMode) {
                const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.8);
                bgGradient.addColorStop(0, hexToRgba(palette.petals[0], 0.03));
                bgGradient.addColorStop(0.5, hexToRgba(palette.petals[1], 0.01));
                bgGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = bgGradient;
                ctx.fillRect(0, 0, size, size);
            }
            
            // Draw water ripples
            drawWaterRipples(ctx, breathState, palette);
            
            // Draw particles
            drawParticles(ctx, breathState, palette);
            
            // Draw petals (back layers first)
            for (let layer = petalLayers - 1; layer >= 0; layer--) {
                const layerRotation = layer * (Math.PI / numPetals);
                for (let i = 0; i < numPetals; i++) {
                    const angle = (i * Math.PI * 2 / numPetals) + layerRotation;
                    const scale = 1 - (layer * 0.08);
                    drawPetal(ctx, angle, layer, scale, breathState, palette);
                }
            }
            
            // Draw center
            drawCenter(ctx, 1, breathState, palette);
            
            // Ambient glow
            const ambientGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.5);
            const glowAlpha = zenMode ? 0.05 : 0.1 + Math.sin(time * 0.02) * 0.03;
            ambientGlow.addColorStop(0, hexToRgba(palette.petals[0], glowAlpha));
            ambientGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = ambientGlow;
            ctx.fillRect(0, 0, size, size);
            
            time++;
            requestAnimationFrame(draw);
        }
        
        function toggleBreathing() {
            breathingEnabled = !breathingEnabled;
            const btn = document.getElementById('breatheBtn');
            btn.textContent = breathingEnabled ? 'Guide: On' : 'Guide: Off';
            btn.classList.toggle('active', breathingEnabled);
            
            const guide = document.getElementById('breathGuide');
            guide.style.opacity = breathingEnabled ? '1' : '0';
        }
        
        function changeSpeed() {
            const speeds = [0.5, 1, 1.5, 2];
            const currentIndex = speeds.indexOf(speedMultiplier);
            speedMultiplier = speeds[(currentIndex + 1) % speeds.length];
        }
        
        function toggleZen() {
            zenMode = !zenMode;
            const btn = document.getElementById('zenBtn');
            btn.textContent = zenMode ? 'Zen: On' : 'Zen Mode';
            btn.classList.toggle('active', zenMode);
            
            // Hide/show UI elements
            document.querySelector('.hint').style.opacity = zenMode ? '0' : '1';
            document.querySelector('.info').style.opacity = zenMode ? '0' : '1';
        }
        
        function changePalette() {
            paletteIndex = (paletteIndex + 1) % palettes.length;
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            const newSize = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.8, 700);
            if (Math.abs(newSize - size) > 50) {
                location.reload();
            }
        });
        
        // Click to reset breath cycle
        canvas.addEventListener('click', () => {
            breathPhase = 0;
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                breathPhase = 0;
            } else if (e.code === 'KeyB') {
                toggleBreathing();
            } else if (e.code === 'KeyZ') {
                toggleZen();
            } else if (e.code === 'KeyP') {
                changePalette();
            }
        });
        
        // Start
        draw();
    </script>
</body>
</html>
