<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quasicrystal Patterns — Nemo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'SF Mono', Monaco, monospace;
            overflow: hidden;
            color: #a0a0b0;
        }
        
        canvas {
            box-shadow: 0 0 60px rgba(100, 80, 200, 0.2);
            border-radius: 4px;
            cursor: crosshair;
        }
        
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
        }
        
        button {
            background: rgba(20, 20, 35, 0.9);
            border: 1px solid rgba(100, 80, 200, 0.4);
            color: #a0a0c0;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            font-family: inherit;
        }
        
        button:hover {
            background: rgba(40, 40, 60, 0.9);
            transform: translateY(-1px);
        }
        
        button.active {
            background: rgba(100, 80, 200, 0.3);
            border-color: rgba(140, 120, 220, 0.8);
            color: #d0c0f0;
        }
        
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(160, 160, 192, 0.5);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .status {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(160, 160, 192, 0.7);
            font-size: 11px;
            letter-spacing: 1px;
            text-align: right;
        }
        
        .parameter-display {
            position: fixed;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            color: rgba(160, 160, 192, 0.5);
            font-size: 10px;
            letter-spacing: 0.5px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="info">Quasicrystal Patterns</div>
    <div class="status" id="status">Click to shift phase<br>Drag to rotate</div>
    <div class="parameter-display" id="params"></div>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <button onclick="regenerate()">Regenerate</button>
        <button onclick="cycleSymmetry()" id="symBtn">Symmetry: 5</button>
        <button onclick="cyclePalette()" id="palBtn">Palette</button>
        <button onclick="toggleAnimation()" id="animBtn">Animate</button>
        <button onclick="toggleMode()" id="modeBtn">Mode: Interference</button>
        <button onclick="exportPNG()">Export</button>
    </div>

    <script>
        // Canvas setup
        const SIZE = 800;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Handle high-DPI displays
        const dpr = window.devicePixelRatio || 1;
        canvas.width = SIZE * dpr;
        canvas.height = SIZE * dpr;
        canvas.style.width = SIZE + 'px';
        canvas.style.height = SIZE + 'px';
        ctx.scale(dpr, dpr);
        
        // Quasicrystal state
        let symmetry = 5;
        let phase = 0;
        let scale = 0.015;
        let animationSpeed = 0.002;
        let isAnimating = true;
        let rotation = 0;
        let renderMode = 'interference'; // 'interference' or 'threshold'
        let thresholdValue = 0.5;
        let paletteIndex = 0;
        
        // Palettes
        const palettes = [
            { name: 'Aurora', colors: ['#0a0a0f', '#1a0a2e', '#2d1b4e', '#4a148c', '#7c43bd', '#b39ddb', '#e1bee7'] },
            { name: 'Golden', colors: ['#0a0a0f', '#1a1200', '#3d2800', '#7a5200', '#b8860b', '#daa520', '#ffd700'] },
            { name: 'Ocean', colors: ['#0a0a0f', '#001020', '#003050', '#006080', '#0099cc', '#00ccff', '#80e5ff'] },
            { name: 'Ember', colors: ['#0a0a0f', '#1a0500', '#3d0f00', '#7a1f00', '#cc3300', '#ff6600', '#ffaa44'] },
            { name: 'Plasma', colors: ['#0a0a0f', '#1a0033', '#330066', '#6600cc', '#9933ff', '#cc66ff', '#ff99ff'] }
        ];
        
        let currentPalette = palettes[0];
        let imageData = null;
        let pixels = null;
        
        // Animation frame ID
        let animationId = null;
        
        // Initialize
        function init() {
            imageData = ctx.createImageData(SIZE, SIZE);
            pixels = imageData.data;
            updateParameterDisplay();
        }
        
        // Calculate quasicrystal intensity at point (x, y)
        // Uses the "cut and project" method: sum of cosines at angles 2πk/n
        function getIntensity(x, y) {
            const cx = x - SIZE / 2;
            const cy = y - SIZE / 2;
            
            // Apply rotation
            const cosR = Math.cos(rotation);
            const sinR = Math.sin(rotation);
            const rx = cx * cosR - cy * sinR;
            const ry = cx * sinR + cy * cosR;
            
            let sum = 0;
            
            // Sum waves at symmetry-fold angles
            for (let k = 0; k < symmetry; k++) {
                const angle = (2 * Math.PI * k) / symmetry;
                const wave = Math.cos(scale * (rx * Math.cos(angle) + ry * Math.sin(angle)) + phase);
                sum += wave;
            }
            
            // Normalize to 0-1 range
            return (sum / symmetry + 1) / 2;
        }
        
        // Render the quasicrystal
        function render() {
            const colors = currentPalette.colors;
            const numColors = colors.length;
            
            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    const intensity = getIntensity(x, y);
                    
                    let colorIndex;
                    if (renderMode === 'interference') {
                        // Smooth color mapping based on intensity
                        colorIndex = Math.floor(intensity * (numColors - 1));
                        colorIndex = Math.max(0, Math.min(numColors - 1, colorIndex));
                    } else {
                        // Threshold mode: sharp boundaries
                        colorIndex = intensity > thresholdValue ? 
                            Math.min(numColors - 1, Math.floor(intensity * numColors)) : 0;
                    }
                    
                    const hex = colors[colorIndex];
                    const r = parseInt(hex.slice(1, 3), 16);
                    const g = parseInt(hex.slice(3, 5), 16);
                    const b = parseInt(hex.slice(5, 7), 16);
                    
                    const idx = (y * SIZE + x) * 4;
                    pixels[idx] = r;
                    pixels[idx + 1] = g;
                    pixels[idx + 2] = b;
                    pixels[idx + 3] = 255;
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
        }
        
        // Animation loop
        function animate() {
            if (isAnimating) {
                phase += animationSpeed * symmetry;
                rotation += animationSpeed * 0.5;
                render();
            }
            animationId = requestAnimationFrame(animate);
        }
        
        // Regenerate with new random parameters
        function regenerate() {
            phase = Math.random() * Math.PI * 2;
            scale = 0.01 + Math.random() * 0.02;
            rotation = Math.random() * Math.PI * 2;
            render();
            updateParameterDisplay();
        }
        
        // Cycle through symmetry values (forbidden in crystals: 5, 7, 8, 9, 10, 11, 12)
        function cycleSymmetry() {
            const symmetries = [5, 7, 8, 9, 10, 11, 12, 13];
            const idx = symmetries.indexOf(symmetry);
            symmetry = symmetries[(idx + 1) % symmetries.length];
            document.getElementById('symBtn').textContent = `Symmetry: ${symmetry}`;
            render();
            updateParameterDisplay();
        }
        
        // Cycle through palettes
        function cyclePalette() {
            paletteIndex = (paletteIndex + 1) % palettes.length;
            currentPalette = palettes[paletteIndex];
            document.getElementById('palBtn').textContent = currentPalette.name;
            render();
        }
        
        // Toggle animation
        function toggleAnimation() {
            isAnimating = !isAnimating;
            document.getElementById('animBtn').textContent = isAnimating ? 'Animate' : 'Paused';
            document.getElementById('animBtn').classList.toggle('active', isAnimating);
        }
        
        // Toggle render mode
        function toggleMode() {
            renderMode = renderMode === 'interference' ? 'threshold' : 'interference';
            document.getElementById('modeBtn').textContent = 
                `Mode: ${renderMode === 'interference' ? 'Interference' : 'Threshold'}`;
            render();
        }
        
        // Export as PNG
        function exportPNG() {
            const link = document.createElement('a');
            link.download = `quasicrystal-s${symmetry}-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Update parameter display
        function updateParameterDisplay() {
            document.getElementById('params').innerHTML = `
                Symmetry: ${symmetry}-fold<br>
                Scale: ${scale.toFixed(4)}<br>
                Phase: ${phase.toFixed(2)}<br>
                Rotation: ${(rotation * 180 / Math.PI).toFixed(1)}°<br>
                <br>
                Quasicrystals have<br>
                long-range order<br>
                but never repeat.<br>
                <br>
                ${symmetry}-fold symmetry<br>
                is forbidden in<br>
                regular crystals.
            `;
        }
        
        // Mouse interaction
        let isDragging = false;
        let lastX = 0;
        
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const delta = e.clientX - lastX;
                rotation += delta * 0.01;
                lastX = e.clientX;
                render();
                updateParameterDisplay();
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        canvas.addEventListener('click', (e) => {
            if (!isDragging) {
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (SIZE / rect.width);
                const y = (e.clientY - rect.top) * (SIZE / rect.height);
                
                // Shift phase based on click position
                phase = (x / SIZE) * Math.PI * 2;
                render();
                updateParameterDisplay();
            }
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    regenerate();
                    break;
                case 'KeyP':
                    toggleAnimation();
                    break;
                case 'KeyS':
                    cycleSymmetry();
                    break;
                case 'KeyM':
                    toggleMode();
                    break;
                case 'ArrowUp':
                    animationSpeed = Math.min(0.02, animationSpeed * 1.2);
                    break;
                case 'ArrowDown':
                    animationSpeed = Math.max(0.0001, animationSpeed / 1.2);
                    break;
            }
        });
        
        // Start
        init();
        render();
        animate();
    </script>
</body>
</html>
