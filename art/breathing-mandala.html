<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathing Mandala — Generative Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'SF Mono', Monaco, monospace;
            overflow: hidden;
        }

        canvas {
            box-shadow: 
                0 0 60px rgba(100, 150, 200, 0.15),
                0 0 120px rgba(100, 150, 200, 0.05);
            border-radius: 50%;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
        }

        button {
            background: rgba(20, 30, 40, 0.9);
            border: 1px solid rgba(100, 150, 200, 0.4);
            color: #a0c0d0;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            font-family: 'SF Mono', Monaco, monospace;
        }

        button:hover {
            background: rgba(40, 60, 80, 0.9);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(100, 150, 200, 0.2);
        }

        button.active {
            background: rgba(100, 150, 200, 0.3);
            border-color: rgba(100, 150, 200, 0.8);
            color: #d0e0f0;
        }

        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(160, 180, 200, 0.6);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(160, 180, 200, 0.8);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .breath-indicator {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(160, 180, 200, 0.5);
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">Breathing Mandala — Generative Art</div>
    <div class="status" id="status">Click to interact</div>
    <div class="breath-indicator" id="breathIndicator">Inhale...</div>
    <div class="controls">
        <button onclick="regenerate()">New Pattern</button>
        <button onclick="togglePause()" id="pauseBtn">Pause</button>
        <button onclick="changePalette()" id="paletteBtn">Palette</button>
        <button onclick="toggleBreathGuide()" id="guideBtn">Guide: On</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        const size = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.8, 700);
        canvas.width = size;
        canvas.height = size;
        
        const cx = size / 2;
        const cy = size / 2;
        
        // Animation state
        let isRunning = true;
        let animationId = null;
        let time = 0;
        let breathPhase = 0; // 0-1 cycle
        let breathSpeed = 0.008; // Slow, meditative breathing
        let showBreathGuide = true;
        
        // Mandala parameters
        let layers = [];
        let particles = [];
        let paletteIndex = 0;
        
        // Color palettes
        const palettes = [
            { // Sunset
                bg: '#0a0a0f',
                primary: ['#ff6b6b', '#feca57', '#ff9ff3', '#54a0ff'],
                secondary: ['#ff8a80', '#ffd54f', '#ce93d8', '#81d4fa'],
                accent: '#ff6b6b'
            },
            { // Ocean
                bg: '#0a0f14',
                primary: ['#00d2d3', '#01a3a4', '#54a0ff', '#5f27cd'],
                secondary: ['#48dbfb', '#0abde3', '#74b9ff', '#a29bfe'],
                accent: '#00d2d3'
            },
            { // Forest
                bg: '#0a0f0a',
                primary: ['#1dd1a1', '#10ac84', '#00d2d3', '#5f27cd'],
                secondary: ['#55efc4', '#26de81', '#81ecec', '#74b9ff'],
                accent: '#1dd1a1'
            },
            { // Warm Earth
                bg: '#0f0a0a',
                primary: ['#e17055', '#fdcb6e', '#e84393', '#6c5ce7'],
                secondary: ['#fab1a0', '#ffeaa7', '#fd79a8', '#a29bfe'],
                accent: '#e17055'
            },
            { // Cosmic
                bg: '#0a0a14',
                primary: ['#a29bfe', '#6c5ce7', '#fd79a8', '#fdcb6e'],
                secondary: ['#dfe6e9', '#b2bec3', '#81ecec', '#fab1a0'],
                accent: '#a29bfe'
            }
        ];
        
        class MandalaLayer {
            constructor(radius, petals, speed, offset) {
                this.radius = radius;
                this.petals = petals;
                this.speed = speed;
                this.offset = offset;
                this.rotation = Math.random() * Math.PI * 2;
                this.pulseOffset = Math.random() * Math.PI * 2;
            }
            
            update(breath) {
                this.rotation += this.speed * (0.5 + breath * 0.5);
            }
            
            draw(ctx, cx, cy, breath, palette) {
                const pulse = 1 + Math.sin(breath * Math.PI * 2 + this.pulseOffset) * 0.15;
                const currentRadius = this.radius * (0.85 + breath * 0.3) * pulse;
                
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(this.rotation);
                
                // Draw petals
                for (let i = 0; i < this.petals; i++) {
                    const angle = (i / this.petals) * Math.PI * 2;
                    const colorIndex = i % palette.primary.length;
                    const alpha = 0.3 + breath * 0.4;
                    
                    ctx.save();
                    ctx.rotate(angle);
                    
                    // Petal shape
                    ctx.beginPath();
                    const petalLength = currentRadius * (0.6 + Math.sin(breath * Math.PI) * 0.2);
                    const petalWidth = currentRadius * 0.15 * (0.8 + breath * 0.4);
                    
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(petalWidth, petalLength * 0.5, 0, petalLength);
                    ctx.quadraticCurveTo(-petalWidth, petalLength * 0.5, 0, 0);
                    
                    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, petalLength);
                    gradient.addColorStop(0, hexToRgba(palette.primary[colorIndex], alpha * 0.5));
                    gradient.addColorStop(0.5, hexToRgba(palette.secondary[colorIndex], alpha * 0.3));
                    gradient.addColorStop(1, hexToRgba(palette.primary[colorIndex], 0));
                    
                    ctx.fillStyle = gradient;
                    ctx.fill();
                    
                    // Inner glow line
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, petalLength * 0.8);
                    ctx.strokeStyle = hexToRgba(palette.accent, alpha * 0.6);
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    
                    ctx.restore();
                }
                
                // Draw connecting ring
                ctx.beginPath();
                ctx.arc(0, 0, currentRadius * 0.3, 0, Math.PI * 2);
                ctx.strokeStyle = hexToRgba(palette.accent, 0.2 + breath * 0.2);
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.restore();
            }
        }
        
        class FloatingParticle {
            constructor() {
                this.reset();
            }
            
            reset() {
                const angle = Math.random() * Math.PI * 2;
                const dist = 50 + Math.random() * (size * 0.35);
                this.x = cx + Math.cos(angle) * dist;
                this.y = cy + Math.sin(angle) * dist;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.life = Math.random() * 200 + 100;
                this.maxLife = this.life;
                this.size = Math.random() * 2 + 0.5;
                this.colorIndex = Math.floor(Math.random() * 4);
            }
            
            update(breath) {
                // Particles drift with the breath
                const dx = this.x - cx;
                const dy = this.y - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                // Gentle orbital drift
                const angle = Math.atan2(dy, dx);
                const drift = breath * 0.02;
                this.vx += Math.cos(angle + Math.PI / 2) * drift;
                this.vy += Math.sin(angle + Math.PI / 2) * drift;
                
                // Damping
                this.vx *= 0.99;
                this.vy *= 0.99;
                
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                
                if (this.life <= 0 || dist > size * 0.45) {
                    this.reset();
                }
            }
            
            draw(ctx, palette) {
                const alpha = (this.life / this.maxLife) * (0.3 + breathPhase * 0.4);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * (0.8 + breathPhase * 0.4), 0, Math.PI * 2);
                ctx.fillStyle = hexToRgba(palette.primary[this.colorIndex % palette.primary.length], alpha);
                ctx.fill();
            }
        }
        
        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        
        function init() {
            layers = [];
            particles = [];
            
            // Create mandala layers (from outside in)
            const layerConfigs = [
                { radius: size * 0.38, petals: 24, speed: 0.001 },
                { radius: size * 0.30, petals: 16, speed: -0.0015 },
                { radius: size * 0.22, petals: 12, speed: 0.002 },
                { radius: size * 0.15, petals: 8, speed: -0.0025 },
                { radius: size * 0.08, petals: 6, speed: 0.003 }
            ];
            
            layerConfigs.forEach((config, i) => {
                layers.push(new MandalaLayer(
                    config.radius,
                    config.petals,
                    config.speed,
                    i * Math.PI / 5
                ));
            });
            
            // Create floating particles
            for (let i = 0; i < 40; i++) {
                particles.push(new FloatingParticle());
            }
            
            time = 0;
            breathPhase = 0;
        }
        
        function draw() {
            if (!isRunning) return;
            
            const palette = palettes[paletteIndex];
            
            // Clear with fade for trails
            ctx.fillStyle = hexToRgba(palette.bg, 0.15);
            ctx.fillRect(0, 0, size, size);
            
            // Update breath phase (4-second cycle: 2s inhale, 2s exhale)
            breathPhase += breathSpeed;
            if (breathPhase >= 1) breathPhase = 0;
            
            // Update breath indicator
            if (showBreathGuide && time % 60 === 0) {
                const indicator = document.getElementById('breathIndicator');
                if (breathPhase < 0.5) {
                    indicator.textContent = 'Inhale...';
                    indicator.style.opacity = 0.3 + breathPhase * 1.4;
                } else {
                    indicator.textContent = 'Exhale...';
                    indicator.style.opacity = 0.3 + (1 - breathPhase) * 1.4;
                }
            }
            
            // Breathing curve (sinusoidal)
            const breath = (Math.sin(breathPhase * Math.PI * 2 - Math.PI / 2) + 1) / 2;
            
            // Draw outer glow
            const glowRadius = size * 0.42 * (0.9 + breath * 0.2);
            const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowRadius);
            glow.addColorStop(0, hexToRgba(palette.accent, 0.05));
            glow.addColorStop(0.5, hexToRgba(palette.accent, 0.02));
            glow.addColorStop(1, hexToRgba(palette.bg, 0));
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, size, size);
            
            // Draw center core
            const coreRadius = size * 0.06 * (0.8 + breath * 0.4);
            const coreGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius);
            coreGradient.addColorStop(0, hexToRgba(palette.accent, 0.8));
            coreGradient.addColorStop(0.5, hexToRgba(palette.accent, 0.3));
            coreGradient.addColorStop(1, hexToRgba(palette.accent, 0));
            ctx.fillStyle = coreGradient;
            ctx.beginPath();
            ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw mandala layers (outside to inside)
            layers.forEach(layer => {
                layer.update(breath);
                layer.draw(ctx, cx, cy, breath, palette);
            });
            
            // Draw floating particles
            particles.forEach(p => {
                p.update(breath);
                p.draw(ctx, palette);
            });
            
            // Draw sacred geometry overlay (subtle)
            drawSacredGeometry(ctx, cx, cy, breath, palette);
            
            time++;
            animationId = requestAnimationFrame(draw);
        }
        
        function drawSacredGeometry(ctx, cx, cy, breath, palette) {
            ctx.save();
            ctx.translate(cx, cy);
            
            // Rotating seed of life pattern (subtle)
            const rotation = time * 0.0005;
            ctx.rotate(rotation);
            
            const seedRadius = size * 0.12 * (1 + breath * 0.1);
            const alpha = 0.05 + breath * 0.1;
            
            ctx.strokeStyle = hexToRgba(palette.accent, alpha);
            ctx.lineWidth = 1;
            
            // Central circle
            ctx.beginPath();
            ctx.arc(0, 0, seedRadius, 0, Math.PI * 2);
            ctx.stroke();
            
            // Surrounding circles (seed of life)
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const sx = Math.cos(angle) * seedRadius;
                const sy = Math.sin(angle) * seedRadius;
                ctx.beginPath();
                ctx.arc(sx, sy, seedRadius, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        function regenerate() {
            cancelAnimationFrame(animationId);
            paletteIndex = Math.floor(Math.random() * palettes.length);
            init();
            draw();
        }
        
        function togglePause() {
            isRunning = !isRunning;
            document.getElementById('pauseBtn').textContent = isRunning ? 'Pause' : 'Resume';
            if (isRunning) draw();
        }
        
        function changePalette() {
            paletteIndex = (paletteIndex + 1) % palettes.length;
        }
        
        function toggleBreathGuide() {
            showBreathGuide = !showBreathGuide;
            document.getElementById('guideBtn').textContent = showBreathGuide ? 'Guide: On' : 'Guide: Off';
            document.getElementById('breathIndicator').style.display = showBreathGuide ? 'block' : 'none';
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            const newSize = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.8, 700);
            if (Math.abs(newSize - size) > 50) {
                location.reload();
            }
        });
        
        // Click to interact
        canvas.addEventListener('click', () => {
            // Create burst of particles at click
            const rect = canvas.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;
            
            for (let i = 0; i < 5; i++) {
                const p = new FloatingParticle();
                p.x = clickX;
                p.y = clickY;
                p.vx = (Math.random() - 0.5) * 3;
                p.vy = (Math.random() - 0.5) * 3;
                p.life = 150;
                p.maxLife = 150;
                particles.push(p);
            }
            
            // Remove excess particles
            if (particles.length > 60) {
                particles.splice(0, particles.length - 60);
            }
        });
        
        // Initialize
        init();
        draw();
    </script>
</body>
</html>
