<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonograph — Pendulum Poetry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'SF Mono', Monaco, monospace;
            overflow: hidden;
        }

        canvas {
            box-shadow: 
                0 0 60px rgba(100, 150, 200, 0.15),
                0 0 120px rgba(100, 150, 200, 0.05);
            border-radius: 4px;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
        }

        button {
            background: rgba(20, 30, 40, 0.9);
            border: 1px solid rgba(100, 150, 200, 0.4);
            color: #a0c0d0;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            font-family: 'SF Mono', Monaco, monospace;
        }

        button:hover {
            background: rgba(40, 60, 80, 0.9);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(100, 150, 200, 0.2);
        }

        button.active {
            background: rgba(100, 150, 200, 0.3);
            border-color: rgba(100, 150, 200, 0.8);
            color: #d0e0f0;
        }

        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(160, 180, 200, 0.6);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .preset-label {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(160, 180, 200, 0.8);
            font-size: 12px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">Harmonograph — Pendulum Poetry</div>
    <div class="preset-label" id="presetLabel">Random</div>
    <div class="controls">
        <button onclick="regenerate()">New Pattern</button>
        <button onclick="togglePause()" id="pauseBtn">Pause</button>
        <button onclick="clearCanvas()">Clear</button>
        <button onclick="cyclePreset()">Preset: <span id="presetName">Random</span></button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        const size = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.8, 800);
        canvas.width = size;
        canvas.height = size;
        
        // Center point
        const cx = size / 2;
        const cy = size / 2;
        
        // Animation state
        let isRunning = true;
        let animationId = null;
        let time = 0;
        let decay = 0.998;
        
        // Pendulum parameters
        let pendulums = [];
        let currentPreset = 0;
        let hue = 200;
        let hueShift = 0.2;
        
        // Presets for different harmonograph patterns
        const presets = [
            {
                name: "Lissajous",
                pendulums: [
                    { freqX: 3, freqY: 2, phase: 0, amp: size * 0.35, decay: 0.9995 },
                    { freqX: 5, freqY: 4, phase: Math.PI / 4, amp: size * 0.15, decay: 0.999 }
                ]
            },
            {
                name: "Butterfly",
                pendulums: [
                    { freqX: 5, freqY: 6, phase: 0, amp: size * 0.3, decay: 0.999 },
                    { freqX: 3, freqY: 4, phase: Math.PI / 3, amp: size * 0.2, decay: 0.998 }
                ]
            },
            {
                name: "Galaxy",
                pendulums: [
                    { freqX: 7, freqY: 5, phase: 0, amp: size * 0.35, decay: 0.9995 },
                    { freqX: 2, freqY: 3, phase: Math.PI / 2, amp: size * 0.1, decay: 0.997 }
                ]
            },
            {
                name: "Rose",
                pendulums: [
                    { freqX: 4, freqY: 5, phase: 0, amp: size * 0.3, decay: 0.999 },
                    { freqX: 6, freqY: 7, phase: Math.PI / 6, amp: size * 0.15, decay: 0.998 }
                ]
            },
            {
                name: "Spiral",
                pendulums: [
                    { freqX: 1, freqY: 1.01, phase: 0, amp: size * 0.4, decay: 0.9998 },
                    { freqX: 3, freqY: 3.02, phase: Math.PI / 4, amp: size * 0.1, decay: 0.995 }
                ]
            },
            {
                name: "Chaos",
                pendulums: [
                    { freqX: Math.PI, freqY: Math.E, phase: 0, amp: size * 0.35, decay: 0.999 },
                    { freqX: Math.sqrt(2), freqY: Math.sqrt(3), phase: Math.PI / 5, amp: size * 0.15, decay: 0.998 }
                ]
            }
        ];
        
        function generateRandomPendulums() {
            const count = 2 + Math.floor(Math.random() * 2);
            const pends = [];
            
            for (let i = 0; i < count; i++) {
                pends.push({
                    freqX: 1 + Math.floor(Math.random() * 8),
                    freqY: 1 + Math.floor(Math.random() * 8),
                    phase: Math.random() * Math.PI * 2,
                    amp: size * (0.15 + Math.random() * 0.25),
                    decay: 0.995 + Math.random() * 0.005
                });
            }
            
            return pends;
        }
        
        function init() {
            // Clear canvas with fade
            ctx.fillStyle = 'rgba(10, 10, 15, 0.1)';
            ctx.fillRect(0, 0, size, size);
            
            time = 0;
            
            if (currentPreset === 0) {
                // Random mode
                pendulums = generateRandomPendulums();
                document.getElementById('presetName').textContent = 'Random';
                document.getElementById('presetLabel').textContent = 'Random';
                hue = Math.random() * 360;
            } else {
                const preset = presets[currentPreset - 1];
                pendulums = preset.pendulums.map(p => ({...p}));
                document.getElementById('presetName').textContent = preset.name;
                document.getElementById('presetLabel').textContent = preset.name;
                
                // Color based on preset
                const hues = [200, 280, 180, 320, 40, 150];
                hue = hues[currentPreset - 1];
            }
            
            hueShift = 0.1 + Math.random() * 0.3;
        }
        
        function calculatePosition(t) {
            let x = 0;
            let y = 0;
            
            for (const p of pendulums) {
                const dampening = Math.pow(p.decay, t * 0.5);
                x += Math.sin(t * p.freqX * 0.01 + p.phase) * p.amp * dampening;
                y += Math.sin(t * p.freqY * 0.01) * p.amp * dampening;
            }
            
            return { x: cx + x, y: cy + y };
        }
        
        function draw() {
            if (!isRunning) return;
            
            // Subtle fade for trails
            ctx.fillStyle = 'rgba(10, 10, 15, 0.02)';
            ctx.fillRect(0, 0, size, size);
            
            // Draw multiple segments per frame for smoother curves
            const segments = 5;
            
            for (let i = 0; i < segments; i++) {
                const t1 = time;
                const t2 = time + 1;
                
                const pos1 = calculatePosition(t1);
                const pos2 = calculatePosition(t2);
                
                // Calculate dampening for opacity
                let avgDecay = pendulums.reduce((sum, p) => sum + p.decay, 0) / pendulums.length;
                const dampening = Math.pow(avgDecay, time * 0.5);
                const alpha = Math.max(0.1, dampening * 0.6);
                
                // Dynamic color
                const currentHue = (hue + time * hueShift) % 360;
                
                ctx.beginPath();
                ctx.moveTo(pos1.x, pos1.y);
                ctx.lineTo(pos2.x, pos2.y);
                ctx.strokeStyle = `hsla(${currentHue}, 70%, 60%, ${alpha})`;
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                ctx.stroke();
                
                // Add glow effect
                ctx.beginPath();
                ctx.moveTo(pos1.x, pos1.y);
                ctx.lineTo(pos2.x, pos2.y);
                ctx.strokeStyle = `hsla(${currentHue}, 70%, 70%, ${alpha * 0.3})`;
                ctx.lineWidth = 4;
                ctx.stroke();
                
                time += 0.5;
            }
            
            // Stop when motion becomes imperceptible
            let avgDecay = pendulums.reduce((sum, p) => sum + p.decay, 0) / pendulums.length;
            if (Math.pow(avgDecay, time * 0.5) < 0.01) {
                // Auto-regenerate after a pause
                setTimeout(() => {
                    if (currentPreset === 0) {
                        regenerate();
                    }
                }, 2000);
                return;
            }
            
            animationId = requestAnimationFrame(draw);
        }
        
        function regenerate() {
            cancelAnimationFrame(animationId);
            init();
            draw();
        }
        
        function togglePause() {
            isRunning = !isRunning;
            document.getElementById('pauseBtn').textContent = isRunning ? 'Pause' : 'Resume';
            if (isRunning) {
                draw();
            }
        }
        
        function clearCanvas() {
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, size, size);
            time = 0;
        }
        
        function cyclePreset() {
            currentPreset = (currentPreset + 1) % (presets.length + 1);
            regenerate();
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            const newSize = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.8, 800);
            if (Math.abs(newSize - size) > 50) {
                location.reload();
            }
        });
        
        // Click to regenerate
        canvas.addEventListener('click', regenerate);
        
        // Initialize
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, size, size);
        init();
        draw();
    </script>
</body>
</html>
