<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Field — Nemo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'SF Mono', Monaco, monospace;
            overflow: hidden;
        }
        canvas {
            box-shadow: 0 0 60px rgba(100, 80, 200, 0.3);
            border-radius: 4px;
        }
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        button {
            background: rgba(20, 20, 35, 0.9);
            border: 1px solid rgba(100, 80, 200, 0.4);
            color: #a0a0c0;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            font-family: inherit;
        }
        button:hover {
            background: rgba(40, 40, 60, 0.9);
            transform: translateY(-1px);
        }
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(160, 160, 192, 0.6);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="info">Flow Field — 3000 particles</div>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <button onclick="regenerate()">Regenerate</button>
        <button onclick="exportPNG()">Export</button>
    </div>

    <script src="lib/nemo-art-kit.js"></script>
    <script>
        // Canvas setup
        const SIZE = 1200;
        const { canvas, ctx } = NemoArt.wrapCanvas('canvas', SIZE, SIZE);
        
        // Parameters
        const SCALE = 0.003;
        const NUM_PARTICLES = 3000;
        const MAX_STEPS = 150;
        const LAYERS = 3;
        
        // Color palette
        const palette = NemoArt.Palette.ethereal;
        
        // Noise function for flow field
        function getFlow(x, y) {
            const n = NemoArt.Noise.simple2D(x, y, SCALE);
            const angle = n * Math.PI * 4;
            return { x: Math.cos(angle), y: Math.sin(angle) };
        }
        
        // Particle class
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * SIZE;
                this.y = Math.random() * SIZE;
                this.vx = 0;
                this.vy = 0;
                this.life = 0;
                this.maxLife = 50 + Math.random() * 100;
                this.color = NemoArt.Palette.random(palette);
                this.hueOffset = Math.random() * 30 - 15;
                this.width = 0.5 + Math.random() * 1.5;
            }
            
            update() {
                const flow = getFlow(this.x, this.y);
                
                this.vx += flow.x * 0.3;
                this.vy += flow.y * 0.3;
                this.vx *= 0.95;
                this.vy *= 0.95;
                
                this.x += this.vx;
                this.y += this.vy;
                this.life++;
                
                if (this.x < 0 || this.x > SIZE || this.y < 0 || this.y > SIZE || this.life > this.maxLife) {
                    this.reset();
                }
            }
            
            draw(ctx, alpha) {
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const lifeRatio = 1 - (this.life / this.maxLife);
                const a = alpha * lifeRatio * Math.min(speed * 2, 1);
                
                const h = (this.color.h + this.hueOffset + speed * 20) % 360;
                const s = this.color.s;
                const l = this.color.l + speed * 10;
                
                ctx.strokeStyle = `hsla(${h}, ${s}%, ${l}%, ${a})`;
                ctx.lineWidth = this.width;
                ctx.beginPath();
                ctx.moveTo(this.x - this.vx, this.y - this.vy);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
            }
        }
        
        // Generate the artwork
        function generate() {
            // Gradient background
            const bg = ctx.createRadialGradient(SIZE/2, SIZE/2, 0, SIZE/2, SIZE/2, SIZE);
            bg.addColorStop(0, '#1a0a2e');
            bg.addColorStop(0.5, '#0d0d1a');
            bg.addColorStop(1, '#050508');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, SIZE, SIZE);
            
            // Create particles
            const particles = Array.from({ length: NUM_PARTICLES }, () => new Particle());
            
            // Pre-warm
            for (let i = 0; i < 50; i++) {
                particles.forEach(p => p.update());
            }
            
            // Draw layers
            for (let layer = 0; layer < LAYERS; layer++) {
                const layerAlpha = 0.3 + (layer * 0.2);
                
                particles.forEach(p => {
                    p.reset();
                    p.x += (Math.random() - 0.5) * 100;
                    p.y += (Math.random() - 0.5) * 100;
                });
                
                for (let step = 0; step < MAX_STEPS; step++) {
                    particles.forEach(p => {
                        p.update();
                        p.draw(ctx, layerAlpha);
                    });
                }
            }
            
            // Glow effect
            ctx.globalCompositeOperation = 'screen';
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
                if (brightness > 50) {
                    const boost = 1 + (brightness / 255) * 0.5;
                    data[i] = Math.min(255, data[i] * boost);
                    data[i+1] = Math.min(255, data[i+1] * boost);
                    data[i+2] = Math.min(255, data[i+2] * boost);
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
            
            // Vignette
            const vignette = ctx.createRadialGradient(SIZE/2, SIZE/2, SIZE * 0.4, SIZE/2, SIZE/2, SIZE * 0.7);
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(1, 'rgba(0,0,0,0.4)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, SIZE, SIZE);
        }
        
        // Controls
        function regenerate() {
            generate();
        }
        
        function exportPNG() {
            NemoArt.Export.png(canvas, 'flow-field-nemo.png');
        }
        
        // Initialize
        generate();
    </script>
</body>
</html>
