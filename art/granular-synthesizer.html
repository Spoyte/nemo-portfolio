<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granular Synthesizer — Microsound Texture Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', monospace;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #a0c0d0;
        }

        .container {
            position: relative;
            width: 90vw;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .title {
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #a0c0d0;
            opacity: 0.8;
            text-align: center;
        }

        canvas {
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(100, 150, 200, 0.15),
                        0 0 120px rgba(100, 150, 200, 0.05);
            max-width: 100%;
            background: #0d1117;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 16px 24px;
            background: rgba(20, 30, 40, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(100, 150, 200, 0.1);
        }

        button {
            padding: 10px 20px;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1px solid rgba(100, 150, 200, 0.3);
            background: rgba(30, 40, 50, 0.8);
            color: #a0c0d0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: rgba(50, 70, 90, 0.9);
            border-color: rgba(100, 150, 200, 0.5);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background: rgba(80, 120, 160, 0.5);
            border-color: rgba(100, 180, 220, 0.6);
            color: #c0e0f0;
        }

        button.danger {
            border-color: rgba(200, 100, 100, 0.4);
            color: #d0a0a0;
        }

        button.danger:hover {
            background: rgba(150, 60, 60, 0.4);
        }

        .sliders {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            background: rgba(15, 25, 35, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(100, 150, 200, 0.1);
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-group label {
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #8090a0;
            display: flex;
            justify-content: space-between;
        }

        .slider-group label span {
            color: #a0c0d0;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(100, 150, 200, 0.2);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #a0c0d0;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(160, 192, 208, 0.4);
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #a0c0d0;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(160, 192, 208, 0.4);
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 10px;
            color: #607080;
            line-height: 1.6;
            pointer-events: none;
        }

        .grain-info {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 10px;
            color: #607080;
            text-align: right;
            line-height: 1.6;
        }

        .status {
            font-size: 10px;
            color: #506070;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .sliders {
                grid-template-columns: 1fr;
            }
            .controls {
                padding: 12px 16px;
            }
            button {
                padding: 8px 14px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Granular Synthesizer — Microsound Texture Explorer</div>
        
        <div style="position: relative;">
            <canvas id="canvas" width="800" height="400"></canvas>
            <div class="info">
                Click canvas to scatter grains<br>
                Drag to spray continuously<br>
                Each dot = one grain
            </div>
            <div class="grain-info">
                <span id="grainCount">0</span> active grains<br>
                <span id="avgFreq">0</span> Hz avg<br>
                <span id="density">0</span> grains/sec
            </div>
        </div>

        <div class="controls">
            <button id="btnStart" class="danger">Start Audio</button>
            <button id="btnClear">Clear Grains</button>
            <button id="btnScatter">Auto Scatter</button>
            <button id="btnFreeze">Freeze</button>
        </div>

        <div class="sliders">
            <div class="slider-group">
                <label>Grain Size <span id="valSize">50ms</span></label>
                <input type="range" id="grainSize" min="5" max="200" value="50">
            </div>
            <div class="slider-group">
                <label>Density <span id="valDensity">30</span></label>
                <input type="range" id="densitySlider" min="5" max="100" value="30">
            </div>
            <div class="slider-group">
                <label>Pitch Scatter <span id="valPitch">±200¢</span></label>
                <input type="range" id="pitchScatter" min="0" max="1200" value="200">
            </div>
            <div class="slider-group">
                <label>Time Scatter <span id="valTime">±100ms</span></label>
                <input type="range" id="timeScatter" min="0" max="500" value="100">
            </div>
            <div class="slider-group">
                <label>Base Frequency <span id="valFreq">220Hz</span></label>
                <input type="range" id="baseFreq" min="55" max="880" value="220">
            </div>
            <div class="slider-group">
                <label>Reverb <span id="valReverb">40%</span></label>
                <input type="range" id="reverb" min="0" max="100" value="40">
            </div>
        </div>

        <div class="status" id="status">Click "Start Audio" to begin</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Audio context
        let audioCtx = null;
        let masterGain = null;
        let reverbNode = null;
        let convolver = null;
        
        // State
        let grains = [];
        let isPlaying = false;
        let isFrozen = false;
        let autoScatter = false;
        let mouseDown = false;
        let lastMousePos = { x: 0, y: 0 };
        let grainIdCounter = 0;
        let grainsSpawned = 0;
        let lastSecond = Date.now();
        let currentDensity = 0;
        
        // Parameters
        const params = {
            grainSize: 50,      // ms
            density: 30,        // grains per second
            pitchScatter: 200,  // cents
            timeScatter: 100,   // ms
            baseFreq: 220,      // Hz
            reverb: 0.4         // 0-1
        };
        
        // Color schemes
        const schemes = [
            { name: 'crystal', hues: [180, 200, 220], sat: 60, light: 70 },
            { name: 'ember', hues: [10, 30, 50], sat: 80, light: 60 },
            { name: 'nebula', hues: [260, 280, 300], sat: 70, light: 65 },
            { name: 'forest', hues: [100, 120, 140], sat: 65, light: 55 },
            { name: 'gold', hues: [40, 50, 60], sat: 90, light: 65 }
        ];
        let currentScheme = schemes[0];
        
        // Grain class
        class Grain {
            constructor(x, y, scheduledTime = null) {
                this.id = grainIdCounter++;
                this.x = x;
                this.y = y;
                this.birth = Date.now();
                this.lifetime = params.grainSize + (Math.random() - 0.5) * params.timeScatter;
                this.lifetime = Math.max(10, this.lifetime);
                
                // Visual properties
                const hue = currentScheme.hues[Math.floor(Math.random() * currentScheme.hues.length)];
                const sat = currentScheme.sat + (Math.random() - 0.5) * 20;
                const light = currentScheme.light + (Math.random() - 0.5) * 20;
                this.color = `hsla(${hue}, ${sat}%, ${light}%, 0.8)`;
                this.size = 2 + Math.random() * 4;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                
                // Audio properties
                const pitchCents = (Math.random() - 0.5) * 2 * params.pitchScatter;
                this.playbackRate = Math.pow(2, pitchCents / 1200);
                this.frequency = params.baseFreq * this.playbackRate;
                
                // Schedule audio
                if (isPlaying && audioCtx && !isFrozen) {
                    this.scheduleAudio(scheduledTime);
                }
            }
            
            scheduleAudio(when = null) {
                const t = when || audioCtx.currentTime;
                const duration = this.lifetime / 1000;
                
                // Create grain envelope
                const gain = audioCtx.createGain();
                const freq = this.frequency;
                
                // Waveform: mix of sine and triangle for texture
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const oscGain = audioCtx.createGain();
                
                osc1.type = 'sine';
                osc1.frequency.value = freq;
                
                osc2.type = 'triangle';
                osc2.frequency.value = freq * 1.01; // slight detune
                oscGain.gain.value = 0.3;
                
                // Envelope: Hann window shape
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.3, t + duration * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                
                // Connect
                osc1.connect(gain);
                osc2.connect(oscGain);
                oscGain.connect(gain);
                
                // To master or reverb
                if (reverbNode && params.reverb > 0) {
                    const dryGain = audioCtx.createGain();
                    const wetGain = audioCtx.createGain();
                    dryGain.gain.value = 1 - params.reverb;
                    wetGain.gain.value = params.reverb;
                    
                    gain.connect(dryGain);
                    gain.connect(wetGain);
                    dryGain.connect(masterGain);
                    wetGain.connect(reverbNode);
                } else {
                    gain.connect(masterGain);
                }
                
                osc1.start(t);
                osc2.start(t);
                osc1.stop(t + duration);
                osc2.stop(t + duration);
                
                // Cleanup
                setTimeout(() => {
                    osc1.disconnect();
                    osc2.disconnect();
                    gain.disconnect();
                }, duration * 1000 + 100);
            }
            
            update() {
                if (!isFrozen) {
                    this.x += this.vx;
                    this.y += this.vy;
                }
                const age = Date.now() - this.birth;
                return age < this.lifetime;
            }
            
            draw(ctx) {
                const age = Date.now() - this.birth;
                const life = age / this.lifetime;
                const alpha = Math.sin(life * Math.PI) * 0.8;
                const size = this.size * (1 - life * 0.5);
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fillStyle = this.color.replace(/[\d.]+%\)$/, `${alpha})`);
                ctx.fill();
                
                // Glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, size * 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color.replace(/[\d.]+%\)$/, `${alpha * 0.2})`);
                ctx.fill();
            }
        }
        
        // Create reverb impulse
        function createReverbImpulse() {
            const rate = audioCtx.sampleRate;
            const length = rate * 2; // 2 seconds
            const impulse = audioCtx.createBuffer(2, length, rate);
            
            for (let channel = 0; channel < 2; channel++) {
                const data = impulse.getChannelData(channel);
                for (let i = 0; i < length; i++) {
                    const decay = Math.pow(1 - i / length, 2);
                    data[i] = (Math.random() * 2 - 1) * decay * 0.5;
                }
            }
            
            return impulse;
        }
        
        // Initialize audio
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.5;
            masterGain.connect(audioCtx.destination);
            
            // Reverb
            convolver = audioCtx.createConvolver();
            convolver.buffer = createReverbImpulse();
            reverbNode = audioCtx.createGain();
            reverbNode.connect(convolver);
            convolver.connect(masterGain);
        }
        
        // Spawn grain
        function spawnGrain(x, y) {
            grains.push(new Grain(x, y));
            grainsSpawned++;
        }
        
        // Auto scatter
        function doAutoScatter() {
            if (!autoScatter || isFrozen) return;
            
            const count = Math.ceil(params.density / 10);
            for (let i = 0; i < count; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                spawnGrain(x, y);
            }
        }
        
        // Update UI
        function updateUI() {
            document.getElementById('grainCount').textContent = grains.length;
            document.getElementById('avgFreq').textContent = 
                grains.length > 0 ? Math.round(params.baseFreq) : 0;
            document.getElementById('density').textContent = currentDensity;
            
            // Calculate density
            const now = Date.now();
            if (now - lastSecond >= 1000) {
                currentDensity = grainsSpawned;
                grainsSpawned = 0;
                lastSecond = now;
            }
        }
        
        // Animation loop
        let lastScatter = 0;
        function animate() {
            ctx.fillStyle = 'rgba(13, 17, 23, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Auto scatter
            if (autoScatter && !isFrozen) {
                const now = Date.now();
                const interval = 1000 / params.density;
                if (now - lastScatter > interval) {
                    doAutoScatter();
                    lastScatter = now;
                }
            }
            
            // Mouse spray
            if (mouseDown && !isFrozen) {
                const count = 3;
                for (let i = 0; i < count; i++) {
                    const offsetX = (Math.random() - 0.5) * 30;
                    const offsetY = (Math.random() - 0.5) * 30;
                    spawnGrain(lastMousePos.x + offsetX, lastMousePos.y + offsetY);
                }
            }
            
            // Update and draw grains
            grains = grains.filter(grain => {
                const alive = grain.update();
                if (alive) grain.draw(ctx);
                return alive;
            });
            
            updateUI();
            requestAnimationFrame(animate);
        }
        
        // Event handlers
        document.getElementById('btnStart').addEventListener('click', async () => {
            if (!audioCtx) {
                initAudio();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            isPlaying = !isPlaying;
            document.getElementById('btnStart').textContent = isPlaying ? 'Stop Audio' : 'Start Audio';
            document.getElementById('btnStart').classList.toggle('danger', !isPlaying);
            document.getElementById('btnStart').classList.toggle('active', isPlaying);
            document.getElementById('status').textContent = isPlaying ? 'Audio active — click canvas to spawn grains' : 'Audio stopped';
        });
        
        document.getElementById('btnClear').addEventListener('click', () => {
            grains = [];
        });
        
        document.getElementById('btnScatter').addEventListener('click', () => {
            autoScatter = !autoScatter;
            document.getElementById('btnScatter').classList.toggle('active', autoScatter);
        });
        
        document.getElementById('btnFreeze').addEventListener('click', () => {
            isFrozen = !isFrozen;
            document.getElementById('btnFreeze').classList.toggle('active', isFrozen);
        });
        
        // Sliders
        document.getElementById('grainSize').addEventListener('input', (e) => {
            params.grainSize = parseInt(e.target.value);
            document.getElementById('valSize').textContent = params.grainSize + 'ms';
        });
        
        document.getElementById('densitySlider').addEventListener('input', (e) => {
            params.density = parseInt(e.target.value);
            document.getElementById('valDensity').textContent = params.density;
        });
        
        document.getElementById('pitchScatter').addEventListener('input', (e) => {
            params.pitchScatter = parseInt(e.target.value);
            document.getElementById('valPitch').textContent = '±' + params.pitchScatter + '¢';
        });
        
        document.getElementById('timeScatter').addEventListener('input', (e) => {
            params.timeScatter = parseInt(e.target.value);
            document.getElementById('valTime').textContent = '±' + params.timeScatter + 'ms';
        });
        
        document.getElementById('baseFreq').addEventListener('input', (e) => {
            params.baseFreq = parseInt(e.target.value);
            document.getElementById('valFreq').textContent = params.baseFreq + 'Hz';
        });
        
        document.getElementById('reverb').addEventListener('input', (e) => {
            params.reverb = parseInt(e.target.value) / 100;
            document.getElementById('valReverb').textContent = Math.round(params.reverb * 100) + '%';
        });
        
        // Canvas interaction
        canvas.addEventListener('mousedown', (e) => {
            mouseDown = true;
            const rect = canvas.getBoundingClientRect();
            lastMousePos.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            lastMousePos.y = (e.clientY - rect.top) * (canvas.height / rect.height);
            
            if (!isFrozen) {
                for (let i = 0; i < 5; i++) {
                    const offsetX = (Math.random() - 0.5) * 40;
                    const offsetY = (Math.random() - 0.5) * 40;
                    spawnGrain(lastMousePos.x + offsetX, lastMousePos.y + offsetY);
                }
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            lastMousePos.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            lastMousePos.y = (e.clientY - rect.top) * (canvas.height / rect.height);
        });
        
        canvas.addEventListener('mouseup', () => mouseDown = false);
        canvas.addEventListener('mouseleave', () => mouseDown = false);
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            mouseDown = true;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            lastMousePos.x = (touch.clientX - rect.left) * (canvas.width / rect.width);
            lastMousePos.y = (touch.clientY - rect.top) * (canvas.height / rect.height);
            
            if (!isFrozen) {
                for (let i = 0; i < 5; i++) {
                    const offsetX = (Math.random() - 0.5) * 40;
                    const offsetY = (Math.random() - 0.5) * 40;
                    spawnGrain(lastMousePos.x + offsetX, lastMousePos.y + offsetY);
                }
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            lastMousePos.x = (touch.clientX - rect.left) * (canvas.width / rect.width);
            lastMousePos.y = (touch.clientY - rect.top) * (canvas.height / rect.height);
        });
        
        canvas.addEventListener('touchend', () => mouseDown = false);
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                document.getElementById('btnStart').click();
            } else if (e.code === 'KeyC') {
                document.getElementById('btnClear').click();
            } else if (e.code === 'KeyA') {
                document.getElementById('btnScatter').click();
            } else if (e.code === 'KeyF') {
                document.getElementById('btnFreeze').click();
            }
        });
        
        // Color scheme rotation
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyS') {
                const idx = schemes.indexOf(currentScheme);
                currentScheme = schemes[(idx + 1) % schemes.length];
                document.getElementById('status').textContent = 'Scheme: ' + currentScheme.name;
                setTimeout(() => {
                    document.getElementById('status').textContent = isPlaying ? 'Audio active' : 'Audio stopped';
                }, 1500);
            }
        });
        
        // Start
        animate();
        document.getElementById('status').textContent = 'Ready — press Space or click Start Audio';
    </script>
</body>
</html>
