<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonant Breath — Nemo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(180deg, #0a0a12 0%, #0d1525 50%, #0a1a2a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'SF Mono', Monaco, monospace;
            overflow: hidden;
            color: #a0c0d0;
        }
        
        canvas {
            box-shadow: 0 0 80px rgba(80, 160, 200, 0.15);
            border-radius: 50%;
            cursor: pointer;
        }
        
        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            background: rgba(20, 35, 50, 0.8);
            border: 1px solid rgba(80, 160, 200, 0.3);
            color: #80b0c0;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-family: inherit;
        }
        
        button:hover {
            background: rgba(40, 60, 80, 0.9);
            border-color: rgba(100, 180, 220, 0.5);
            transform: translateY(-2px);
        }
        
        button.active {
            background: rgba(80, 160, 200, 0.25);
            border-color: rgba(120, 200, 240, 0.6);
            color: #a0e0f0;
        }
        
        .info {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: rgba(160, 200, 220, 0.6);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .phase {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(160, 220, 240, 0.9);
            text-shadow: 0 0 30px rgba(100, 200, 255, 0.5);
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 5;
        }
        
        .instruction {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: rgba(140, 180, 200, 0.5);
            font-size: 13px;
            letter-spacing: 1px;
            max-width: 400px;
            line-height: 1.6;
        }
        
        .pattern-selector {
            position: fixed;
            top: 60px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }
        
        .pattern-btn {
            padding: 8px 16px;
            font-size: 10px;
            opacity: 0.6;
        }
        
        .pattern-btn.active {
            opacity: 1;
        }
        
        .cycle-count {
            position: fixed;
            top: 60px;
            left: 30px;
            color: rgba(140, 180, 200, 0.4);
            font-size: 11px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="info">Resonant Breath</div>
    <div class="cycle-count" id="cycleCount">Cycle 0</div>
    <div class="phase" id="phase">Breathe In</div>
    <canvas id="canvas"></canvas>
    <div class="instruction" id="instruction">
        Follow the circle with your breath<br>
        <span style="font-size: 11px; opacity: 0.7">Inhale as it expands • Exhale as it contracts</span>
    </div>
    <div class="pattern-selector">
        <button class="pattern-btn active" onclick="setPattern('relax')" id="btn-relax">4-7-8 Relax</button>
        <button class="pattern-btn" onclick="setPattern('balance')" id="btn-balance">4-4-4 Balance</button>
        <button class="pattern-btn" onclick="setPattern('energy')" id="btn-energy">4-2-4 Energy</button>
    </div>
    <div class="controls">
        <button onclick="toggleBreathing()" id="breatheBtn">Start</button>
        <button onclick="toggleSound()" id="soundBtn">Sound Off</button>
        <button onclick="toggleGuide()" id="guideBtn">Guide On</button>
    </div>

    <script>
        // Canvas setup
        const SIZE = 400;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Handle high-DPI displays
        const dpr = window.devicePixelRatio || 1;
        canvas.width = SIZE * dpr;
        canvas.height = SIZE * dpr;
        canvas.style.width = SIZE + 'px';
        canvas.style.height = SIZE + 'px';
        ctx.scale(dpr, dpr);
        
        // Breathing patterns (inhale, hold, exhale in seconds)
        const PATTERNS = {
            relax: { inhale: 4, hold: 7, exhale: 8, name: '4-7-8 Relax' },
            balance: { inhale: 4, hold: 4, exhale: 4, name: '4-4-4 Balance' },
            energy: { inhale: 4, hold: 2, exhale: 4, name: '4-2-4 Energy' }
        };
        
        // State
        let currentPattern = 'relax';
        let isRunning = false;
        let phase = 'inhale'; // inhale, hold, exhale, pause
        let phaseStartTime = 0;
        let cycleCount = 0;
        let showGuide = true;
        let soundEnabled = false;
        let breathIntensity = 0; // 0 to 1
        let targetIntensity = 0;
        
        // Audio context for subtle tones
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;
        
        // Animation
        let animationId = null;
        
        // Particles for ambient effect
        const particles = [];
        for (let i = 0; i < 30; i++) {
            particles.push({
                angle: Math.random() * Math.PI * 2,
                radius: 80 + Math.random() * 60,
                speed: 0.002 + Math.random() * 0.003,
                size: 1 + Math.random() * 2,
                opacity: 0.1 + Math.random() * 0.3
            });
        }
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                oscillator = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 110; // A2
                oscillator.type = 'sine';
                gainNode.gain.value = 0;
                oscillator.start();
            }
        }
        
        function updateAudio(intensity) {
            if (!soundEnabled || !audioCtx) return;
            
            // Map intensity to frequency (inhale = higher pitch, exhale = lower)
            const baseFreq = 110;
            const freq = baseFreq + (intensity * 55); // 110-165 Hz
            oscillator.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.1);
            
            // Subtle volume based on phase
            const volume = intensity * 0.05;
            gainNode.gain.setTargetAtTime(volume, audioCtx.currentTime, 0.1);
        }
        
        function setPattern(name) {
            currentPattern = name;
            document.querySelectorAll('.pattern-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + name).classList.add('active');
            
            if (isRunning) {
                phase = 'inhale';
                phaseStartTime = performance.now();
            }
        }
        
        function toggleBreathing() {
            isRunning = !isRunning;
            document.getElementById('breatheBtn').textContent = isRunning ? 'Pause' : 'Start';
            
            if (isRunning) {
                phaseStartTime = performance.now();
                if (soundEnabled) initAudio();
                loop();
            } else {
                cancelAnimationFrame(animationId);
                if (audioCtx) {
                    gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
                }
            }
        }
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').textContent = soundEnabled ? 'Sound On' : 'Sound Off';
            
            if (soundEnabled && isRunning) {
                initAudio();
            } else if (!soundEnabled && audioCtx) {
                gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
            }
        }
        
        function toggleGuide() {
            showGuide = !showGuide;
            document.getElementById('guideBtn').textContent = showGuide ? 'Guide On' : 'Guide Off';
            document.getElementById('phase').style.opacity = showGuide ? '1' : '0';
            document.getElementById('instruction').style.opacity = showGuide ? '1' : '0';
        }
        
        function updatePhase(elapsed) {
            const pattern = PATTERNS[currentPattern];
            const phaseElapsed = (elapsed - phaseStartTime) / 1000;
            
            let phaseDuration;
            switch (phase) {
                case 'inhale': phaseDuration = pattern.inhale; break;
                case 'hold': phaseDuration = pattern.hold; break;
                case 'exhale': phaseDuration = pattern.exhale; break;
                case 'pause': phaseDuration = 1; break;
            }
            
            if (phaseElapsed >= phaseDuration) {
                // Transition to next phase
                phaseStartTime = elapsed;
                switch (phase) {
                    case 'inhale': phase = 'hold'; break;
                    case 'hold': phase = 'exhale'; break;
                    case 'exhale': 
                        phase = 'pause';
                        cycleCount++;
                        document.getElementById('cycleCount').textContent = `Cycle ${cycleCount}`;
                        break;
                    case 'pause': phase = 'inhale'; break;
                }
            }
            
            // Calculate progress within current phase (0-1)
            const progress = Math.min(phaseElapsed / phaseDuration, 1);
            
            // Update target intensity based on phase
            switch (phase) {
                case 'inhale':
                    targetIntensity = progress;
                    document.getElementById('phase').textContent = 'Breathe In';
                    break;
                case 'hold':
                    targetIntensity = 1;
                    document.getElementById('phase').textContent = 'Hold';
                    break;
                case 'exhale':
                    targetIntensity = 1 - progress;
                    document.getElementById('phase').textContent = 'Breathe Out';
                    break;
                case 'pause':
                    targetIntensity = 0;
                    document.getElementById('phase').textContent = 'Rest';
                    break;
            }
            
            // Smooth interpolation for visual
            breathIntensity += (targetIntensity - breathIntensity) * 0.05;
            
            return breathIntensity;
        }
        
        function render(time) {
            // Clear with subtle fade for trails
            ctx.fillStyle = 'rgba(10, 10, 18, 0.15)';
            ctx.fillRect(0, 0, SIZE, SIZE);
            
            const cx = SIZE / 2;
            const cy = SIZE / 2;
            
            // Update breathing state
            let intensity = 0;
            if (isRunning) {
                intensity = updatePhase(time);
                updateAudio(intensity);
            }
            
            // Ambient particles
            particles.forEach((p, i) => {
                p.angle += p.speed * (1 + intensity * 0.5);
                const r = p.radius + intensity * 40;
                const x = cx + Math.cos(p.angle) * r;
                const y = cy + Math.sin(p.angle) * r;
                
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(120, 200, 220, ${p.opacity * (0.5 + intensity * 0.5)})`;
                ctx.fill();
            });
            
            // Main breathing circle
            const baseRadius = 60;
            const maxRadius = 140;
            const radius = baseRadius + (maxRadius - baseRadius) * intensity;
            
            // Outer glow (multiple layers for softness)
            for (let i = 3; i >= 0; i--) {
                const glowRadius = radius + i * 20;
                const glowAlpha = 0.08 - i * 0.015;
                const gradient = ctx.createRadialGradient(cx, cy, radius * 0.5, cx, cy, glowRadius);
                gradient.addColorStop(0, `rgba(100, 200, 230, ${glowAlpha + intensity * 0.05})`);
                gradient.addColorStop(1, 'rgba(100, 200, 230, 0)');
                
                ctx.beginPath();
                ctx.arc(cx, cy, glowRadius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            // Main circle
            const circleGradient = ctx.createRadialGradient(
                cx - radius * 0.3, cy - radius * 0.3, 0,
                cx, cy, radius
            );
            circleGradient.addColorStop(0, `rgba(150, 220, 240, ${0.3 + intensity * 0.3})`);
            circleGradient.addColorStop(0.5, `rgba(80, 180, 210, ${0.2 + intensity * 0.2})`);
            circleGradient.addColorStop(1, `rgba(60, 140, 180, ${0.1 + intensity * 0.1})`);
            
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = circleGradient;
            ctx.fill();
            
            // Inner highlight
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.7, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(200, 240, 255, ${0.1 + intensity * 0.15})`;
            ctx.lineWidth = 1;
            ctx.stroke();
            
            // Breathing rings
            const ringCount = 3;
            for (let i = 0; i < ringCount; i++) {
                const ringOffset = (time * 0.0005 + i / ringCount) % 1;
                const ringRadius = baseRadius + (maxRadius - baseRadius) * ringOffset;
                const ringAlpha = (1 - ringOffset) * 0.2 * (0.5 + intensity * 0.5);
                
                ctx.beginPath();
                ctx.arc(cx, cy, ringRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(100, 200, 230, ${ringAlpha})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
            
            animationId = requestAnimationFrame(render);
        }
        
        // Click to start/pause
        canvas.addEventListener('click', toggleBreathing);
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleBreathing();
            } else if (e.code === 'KeyM') {
                toggleSound();
            } else if (e.code === 'KeyG') {
                toggleGuide();
            }
        });
        
        // Start animation loop (paused state)
        loop();
        
        function loop() {
            render(performance.now());
        }
    </script>
</body>
</html>
