<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coral Growth — Nemo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'SF Mono', Monaco, monospace;
            overflow: hidden;
        }
        canvas {
            box-shadow: 0 0 60px rgba(100, 180, 160, 0.15);
            border-radius: 4px;
        }
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
        }
        button {
            background: rgba(20, 35, 30, 0.9);
            border: 1px solid rgba(100, 180, 160, 0.4);
            color: #80c0a0;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            font-family: 'SF Mono', Monaco, monospace;
        }
        button:hover {
            background: rgba(40, 60, 50, 0.9);
            transform: translateY(-1px);
        }
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(128, 192, 160, 0.6);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <div class="info">Coral Growth — Biological Algorithm</div>
    <div class="controls">
        <button onclick="regenerate()">Regenerate</button>
        <button onclick="togglePause()">Pause/Play</button>
        <button onclick="changePalette()">Palette</button>
        <button onclick="saveImage()">Save</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // High DPI support
        const dpr = window.devicePixelRatio || 1;
        const width = 800, height = 600;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        
        // Palettes inspired by coral reefs
        const palettes = [
            // Coral reef
            ['#ff6b6b', '#feca57', '#ff9ff3', '#54a0ff', '#5f27cd'],
            // Deep ocean
            ['#00d2d3', '#01a3a4', '#10ac84', '#1dd1a1', '#48dbfb'],
            // Sunset coral
            ['#ff9f43', '#ee5a24', '#f368e0', '#ff6348', '#ffa502'],
            // Monochrome algae
            ['#2d3436', '#636e72', '#b2bec3', '#dfe6e9', '#00b894'],
            // Bioluminescent
            ['#a8e6cf', '#dcedc1', '#ffd3b6', '#ffaaa5', '#ff8b94']
        ];
        let paletteIndex = 0;
        
        // Simulation parameters
        const settings = {
            maxNodes: 4000,
            growthRate: 3,
            branchProb: 0.02,
            wanderStrength: 0.3,
            nutrientCount: 200,
            killDist: 8,
            attractDist: 100
        };
        
        let nodes = [];
        let nutrients = [];
        let paused = false;
        let animationId;
        
        class Node {
            constructor(x, y, parent = null) {
                this.x = x;
                this.y = y;
                this.parent = parent;
                this.children = [];
                this.thickness = parent ? parent.thickness * 0.95 : 6;
                this.depth = parent ? parent.depth + 1 : 0;
                this.color = this.getColor();
            }
            
            getColor() {
                const palette = palettes[paletteIndex];
                const colorIndex = Math.min(Math.floor(this.depth / 5), palette.length - 1);
                return palette[colorIndex] || palette[palette.length - 1];
            }
            
            grow() {
                if (this.children.length >= 2) return; // Max 2 branches per node
                if (Math.random() > settings.branchProb + (this.depth * 0.001)) return;
                
                // Find average direction of nearby nutrients
                let avgAngle = 0;
                let count = 0;
                let closestNutrient = null;
                let closestDist = Infinity;
                
                for (let i = nutrients.length - 1; i >= 0; i--) {
                    const n = nutrients[i];
                    const dx = n.x - this.x;
                    const dy = n.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < settings.killDist) {
                        nutrients.splice(i, 1);
                        continue;
                    }
                    
                    if (dist < settings.attractDist && dist < closestDist) {
                        closestDist = dist;
                        closestNutrient = n;
                        avgAngle = Math.atan2(dy, dx);
                        count++;
                    }
                }
                
                if (count === 0) {
                    // Random growth if no nutrients nearby
                    avgAngle = Math.random() * Math.PI * 2;
                }
                
                // Add some randomness
                avgAngle += (Math.random() - 0.5) * settings.wanderStrength;
                
                // Create new node
                const newX = this.x + Math.cos(avgAngle) * settings.growthRate;
                const newY = this.y + Math.sin(avgAngle) * settings.growthRate;
                
                // Keep within bounds with soft boundary
                if (newX < 50 || newX > width - 50 || newY < 50 || newY > height - 50) {
                    return;
                }
                
                const child = new Node(newX, newY, this);
                this.children.push(child);
                nodes.push(child);
            }
        }
        
        function init() {
            nodes = [];
            nutrients = [];
            
            // Create seed nodes at bottom
            const seedCount = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < seedCount; i++) {
                const x = width * 0.2 + (width * 0.6) * (i / (seedCount - 1 || 1));
                const node = new Node(x, height - 30);
                nodes.push(node);
            }
            
            // Create nutrient field
            for (let i = 0; i < settings.nutrientCount; i++) {
                nutrients.push({
                    x: 50 + Math.random() * (width - 100),
                    y: 50 + Math.random() * (height - 150)
                });
            }
        }
        
        function draw() {
            // Fade effect for trails
            ctx.fillStyle = 'rgba(10, 10, 15, 0.1)';
            ctx.fillRect(0, 0, width, height);
            
            // Draw nutrients (faint)
            ctx.fillStyle = 'rgba(100, 180, 160, 0.15)';
            for (const n of nutrients) {
                ctx.beginPath();
                ctx.arc(n.x, n.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Draw connections
            for (const node of nodes) {
                if (node.parent) {
                    ctx.beginPath();
                    ctx.moveTo(node.parent.x, node.parent.y);
                    ctx.lineTo(node.x, node.y);
                    ctx.strokeStyle = node.color;
                    ctx.lineWidth = Math.max(0.5, node.thickness);
                    ctx.lineCap = 'round';
                    ctx.globalAlpha = 0.8;
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
            }
            
            // Draw nodes
            for (const node of nodes) {
                ctx.beginPath();
                ctx.arc(node.x, node.y, Math.max(1, node.thickness * 0.5), 0, Math.PI * 2);
                ctx.fillStyle = node.color;
                ctx.globalAlpha = 0.6;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        
        function update() {
            if (paused) return;
            
            // Grow from random nodes to create organic variation
            const growCount = Math.min(10, Math.floor(nodes.length * 0.1));
            for (let i = 0; i < growCount; i++) {
                const node = nodes[Math.floor(Math.random() * nodes.length)];
                if (node.depth < 50) { // Max depth limit
                    node.grow();
                }
            }
            
            // Replenish nutrients occasionally
            if (nutrients.length < settings.nutrientCount / 2 && Math.random() < 0.1) {
                nutrients.push({
                    x: 50 + Math.random() * (width - 100),
                    y: 50 + Math.random() * (height * 0.5)
                });
            }
        }
        
        function loop() {
            update();
            draw();
            animationId = requestAnimationFrame(loop);
        }
        
        function regenerate() {
            cancelAnimationFrame(animationId);
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, width, height);
            init();
            loop();
        }
        
        function togglePause() {
            paused = !paused;
        }
        
        function changePalette() {
            paletteIndex = (paletteIndex + 1) % palettes.length;
            // Update existing nodes with new colors
            for (const node of nodes) {
                node.color = node.getColor();
            }
        }
        
        function saveImage() {
            const link = document.createElement('a');
            link.download = 'coral-growth-' + Date.now() + '.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Start
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, width, height);
        init();
        loop();
    </script>
</body>
</html>
