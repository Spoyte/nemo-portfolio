<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typographic Waves</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', monospace;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #a0c0d0;
        }
        
        #canvas {
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(100, 150, 200, 0.15),
                        0 0 120px rgba(100, 150, 200, 0.05);
            max-width: 90vw;
            max-height: 70vh;
        }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }
        
        button {
            background: rgba(20, 30, 40, 0.9);
            border: 1px solid rgba(100, 150, 200, 0.3);
            color: #a0c0d0;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        
        button:hover {
            background: rgba(40, 60, 80, 0.9);
            border-color: rgba(100, 150, 200, 0.6);
            transform: translateY(-1px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 11px;
            opacity: 0.7;
            line-height: 1.6;
        }
        
        .title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #c0d0e0;
        }
        
        .stats {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 11px;
            opacity: 0.6;
            text-align: right;
        }
        
        .poem-display {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 14px;
            color: rgba(160, 192, 208, 0.5);
            max-width: 600px;
            padding: 0 20px;
            line-height: 1.8;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="info">
        <div class="title">Typographic Waves</div>
        <div>Characters flow like water</div>
        <div>Click to disturb the field</div>
    </div>
    
    <div class="stats">
        <div id="fps">FPS: --</div>
        <div id="particle-count">Glyphs: --</div>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div class="poem-display" id="poem-text"></div>
    
    <div class="controls">
        <button onclick="regenerate()">🌊 New Wave</button>
        <button onclick="togglePause()">⏯ Pause</button>
        <button onclick="changePoem()">📜 Change Poem</button>
        <button onclick="toggleGlow()">✨ Glow</button>
        <button onclick="clearCanvas()">🗑 Clear</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Configuration
        let width, height;
        let particles = [];
        let isPaused = false;
        let glowEnabled = true;
        let animationId;
        let time = 0;
        let mouseX = 0, mouseY = 0;
        let mouseActive = false;
        
        // Poems to choose from
        const poems = [
            "the ocean breathes in waves of light each ripple holds a story untold silence speaks louder than words",
            "stars fall like letters from the sky spelling dreams across the night we read the universe in motion",
            "time flows through fingers like sand each grain a moment lost forever memory is the ocean we swim in",
            "words dance on the edge of meaning syntax breaks like waves on shore meaning emerges from chaos",
            "the mind is a sea of thoughts currents pull us deep and deeper still we surface gasping for clarity"
        ];
        let currentPoemIndex = 0;
        
        // Character sets for different layers
        const charSets = {
            primary: "abcdefghijklmnopqrstuvwxyz ",
            secondary: "アイウエオカキクケコサシスセソタチツテト",
            accent: "·•◦○●◯◎◐◑◒◓◴◵◶◗◖◕◔",
            wave: "∿≋≈≉~˜˷̴̷̢̨̧̡̛̼̰̮̭̬̫̪̩"
        };
        
        class Glyph {
            constructor(x, y, char, layer) {
                this.x = x;
                this.y = y;
                this.char = char;
                this.layer = layer;
                this.baseX = x;
                this.baseY = y;
                this.vx = 0;
                this.vy = 0;
                this.phase = Math.random() * Math.PI * 2;
                this.frequency = 0.5 + Math.random() * 1.5;
                this.amplitude = 10 + Math.random() * 30;
                this.size = layer === 0 ? 16 : layer === 1 ? 12 : 8;
                this.opacity = layer === 0 ? 0.9 : layer === 1 ? 0.6 : 0.3;
                this.targetX = x;
                this.targetY = y;
            }
            
            update(dt) {
                // Wave motion
                const waveX = Math.sin(time * this.frequency + this.phase) * this.amplitude;
                const waveY = Math.cos(time * this.frequency * 0.7 + this.phase) * (this.amplitude * 0.5);
                
                // Target position with wave offset
                this.targetX = this.baseX + waveX;
                this.targetY = this.baseY + waveY;
                
                // Mouse interaction
                if (mouseActive) {
                    const dx = mouseX - this.x;
                    const dy = mouseY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        const force = (150 - dist) / 150;
                        this.vx -= (dx / dist) * force * 2;
                        this.vy -= (dy / dist) * force * 2;
                    }
                }
                
                // Spring toward target
                const springStrength = 0.05;
                this.vx += (this.targetX - this.x) * springStrength;
                this.vy += (this.targetY - this.y) * springStrength;
                
                // Damping
                this.vx *= 0.92;
                this.vy *= 0.92;
                
                // Update position
                this.x += this.vx * dt;
                this.y += this.vy * dt;
            }
            
            draw(ctx) {
                const hue = (time * 10 + this.x * 0.1 + this.layer * 60) % 360;
                const saturation = 60 + this.layer * 20;
                const lightness = 50 + Math.sin(time + this.phase) * 20;
                
                ctx.save();
                ctx.font = `${this.size}px 'SF Mono', monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                if (glowEnabled && this.layer === 0) {
                    ctx.shadowColor = `hsla(${hue}, ${saturation}%, ${lightness}%, 0.8)`;
                    ctx.shadowBlur = 15;
                }
                
                ctx.fillStyle = `hsla(${hue}, ${saturation}%, ${lightness}%, ${this.opacity})`;
                ctx.fillText(this.char, this.x, this.y);
                ctx.restore();
            }
        }
        
        function resize() {
            const maxWidth = Math.min(800, window.innerWidth * 0.9);
            const maxHeight = Math.min(600, window.innerHeight * 0.7);
            
            canvas.width = maxWidth;
            canvas.height = maxHeight;
            width = canvas.width;
            height = canvas.height;
            
            regenerate();
        }
        
        function createParticlesFromPoem(poem) {
            particles = [];
            const words = poem.split(' ');
            const lines = [];
            let currentLine = [];
            let currentLineLength = 0;
            
            // Word wrap
            for (const word of words) {
                if (currentLineLength + word.length > 25) {
                    lines.push(currentLine.join(' '));
                    currentLine = [word];
                    currentLineLength = word.length;
                } else {
                    currentLine.push(word);
                    currentLineLength += word.length + 1;
                }
            }
            if (currentLine.length > 0) {
                lines.push(currentLine.join(' '));
            }
            
            // Create particles for each character
            const lineHeight = 40;
            const startY = (height - lines.length * lineHeight) / 2;
            
            lines.forEach((line, lineIdx) => {
                const startX = (width - line.length * 14) / 2;
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === ' ') continue;
                    
                    const x = startX + i * 14;
                    const y = startY + lineIdx * lineHeight;
                    
                    // Primary layer - actual poem characters
                    particles.push(new Glyph(x, y, char, 0));
                    
                    // Secondary layer - decorative characters
                    if (Math.random() > 0.5) {
                        const decoChar = charSets.secondary[Math.floor(Math.random() * charSets.secondary.length)];
                        particles.push(new Glyph(x + (Math.random() - 0.5) * 30, y + (Math.random() - 0.5) * 30, decoChar, 1));
                    }
                    
                    // Tertiary layer - ambient particles
                    if (Math.random() > 0.7) {
                        const ambientChar = charSets.accent[Math.floor(Math.random() * charSets.accent.length)];
                        particles.push(new Glyph(x + (Math.random() - 0.5) * 60, y + (Math.random() - 0.5) * 60, ambientChar, 2));
                    }
                }
            });
            
            // Add wave particles at the bottom
            const waveChars = charSets.wave;
            for (let i = 0; i < width; i += 20) {
                const waveChar = waveChars[Math.floor(Math.random() * waveChars.length)];
                particles.push(new Glyph(i, height - 30 + Math.random() * 20, waveChar, 2));
            }
            
            document.getElementById('particle-count').textContent = `Glyphs: ${particles.length}`;
        }
        
        function regenerate() {
            createParticlesFromPoem(poems[currentPoemIndex]);
            document.getElementById('poem-text').textContent = poems[currentPoemIndex];
        }
        
        function togglePause() {
            isPaused = !isPaused;
        }
        
        function changePoem() {
            currentPoemIndex = (currentPoemIndex + 1) % poems.length;
            regenerate();
        }
        
        function toggleGlow() {
            glowEnabled = !glowEnabled;
        }
        
        function clearCanvas() {
            particles = [];
            document.getElementById('particle-count').textContent = 'Glyphs: 0';
        }
        
        // Animation loop
        let lastTime = 0;
        let frameCount = 0;
        let lastFpsTime = 0;
        
        function animate(currentTime) {
            const dt = Math.min((currentTime - lastTime) / 16.67, 2);
            lastTime = currentTime;
            
            // FPS counter
            frameCount++;
            if (currentTime - lastFpsTime > 1000) {
                document.getElementById('fps').textContent = `FPS: ${frameCount}`;
                frameCount = 0;
                lastFpsTime = currentTime;
            }
            
            if (!isPaused) {
                time += 0.016;
                
                // Clear with fade effect
                ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
                ctx.fillRect(0, 0, width, height);
                
                // Update and draw particles
                particles.forEach(p => {
                    p.update(dt);
                    p.draw(ctx);
                });
                
                // Draw connecting lines between nearby primary particles
                ctx.strokeStyle = 'rgba(100, 150, 200, 0.05)';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                
                const primaryParticles = particles.filter(p => p.layer === 0);
                for (let i = 0; i < primaryParticles.length; i++) {
                    for (let j = i + 1; j < primaryParticles.length; j++) {
                        const p1 = primaryParticles[i];
                        const p2 = primaryParticles[j];
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < 50) {
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                        }
                    }
                }
                ctx.stroke();
            }
            
            animationId = requestAnimationFrame(animate);
        }
        
        // Event listeners
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            mouseActive = true;
        });
        
        canvas.addEventListener('mouseleave', () => {
            mouseActive = false;
        });
        
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            
            // Create ripple effect
            particles.forEach(p => {
                const dx = p.x - clickX;
                const dy = p.y - clickY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 200) {
                    const force = (200 - dist) / 200;
                    p.vx += (dx / dist) * force * 10;
                    p.vy += (dy / dist) * force * 10;
                }
            });
        });
        
        window.addEventListener('resize', resize);
        
        // Initialize
        resize();
        animate(0);
    </script>
</body>
</html>
