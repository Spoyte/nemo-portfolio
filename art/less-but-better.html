<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Less, But Better — Nemo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'SF Mono', Monaco, monospace;
            overflow: hidden;
            color: #666;
        }
        
        canvas {
            box-shadow: 0 0 100px rgba(255, 255, 255, 0.03);
            border-radius: 2px;
            cursor: pointer;
        }
        
        .info {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #444;
        }
        
        .info span {
            color: #888;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info"><span>Less</span>, But Better — Click to breathe</div>

    <script>
        // Less, But Better
        // A meditation on Dieter Rams' 10th principle
        // One circle. One motion. One breath.
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const SIZE = 600;
        const dpr = window.devicePixelRatio || 1;
        
        canvas.width = SIZE * dpr;
        canvas.height = SIZE * dpr;
        canvas.style.width = SIZE + 'px';
        canvas.style.height = SIZE + 'px';
        ctx.scale(dpr, dpr);
        
        // State — minimal
        let time = 0;
        let breathPhase = 0;
        let targetBreath = 0;
        let isBreathing = false;
        
        // One circle, perfectly centered
        const centerX = SIZE / 2;
        const centerY = SIZE / 2;
        const baseRadius = 80;
        
        // Easing — smooth as silk
        function ease(t) {
            return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        }
        
        // Draw the circle of purity
        function draw() {
            // Clear with subtle gradient
            const bg = ctx.createRadialGradient(
                centerX, centerY, 0,
                centerX, centerY, SIZE * 0.8
            );
            bg.addColorStop(0, '#0f0f0f');
            bg.addColorStop(1, '#050505');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, SIZE, SIZE);
            
            // Breathing interpolation
            const breath = ease(breathPhase);
            const radius = baseRadius + breath * 60;
            const lineWidth = 2 - breath * 0.5;
            
            // The circle — one perfect form
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            
            // Gradient stroke — white to warm gray
            const stroke = ctx.createLinearGradient(
                centerX - radius, centerY - radius,
                centerX + radius, centerY + radius
            );
            stroke.addColorStop(0, `rgba(255, 255, 255, ${0.9 - breath * 0.3})`);
            stroke.addColorStop(0.5, `rgba(240, 235, 220, ${0.8 - breath * 0.2})`);
            stroke.addColorStop(1, `rgba(255, 255, 255, ${0.9 - breath * 0.3})`);
            
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
            
            // Subtle glow — only when breathing
            if (breath > 0.01) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 250, 240, ${breath * 0.1})`;
                ctx.lineWidth = lineWidth + breath * 20;
                ctx.stroke();
            }
            
            // Four corner marks — restraint, precision
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            const markSize = 4;
            const margin = 40;
            
            // Top left
            ctx.fillRect(margin, margin, markSize, 1);
            ctx.fillRect(margin, margin, 1, markSize);
            
            // Top right
            ctx.fillRect(SIZE - margin - markSize, margin, markSize, 1);
            ctx.fillRect(SIZE - margin - 1, margin, 1, markSize);
            
            // Bottom left
            ctx.fillRect(margin, SIZE - margin - 1, markSize, 1);
            ctx.fillRect(margin, SIZE - margin - markSize, 1, markSize);
            
            // Bottom right
            ctx.fillRect(SIZE - margin - markSize, SIZE - margin - 1, markSize, 1);
            ctx.fillRect(SIZE - margin - 1, SIZE - margin - markSize, 1, markSize);
        }
        
        // Animation loop
        function animate() {
            time += 0.016;
            
            // Smooth breath transition
            if (isBreathing && breathPhase < 1) {
                breathPhase += 0.02;
                if (breathPhase > 1) breathPhase = 1;
            } else if (!isBreathing && breathPhase > 0) {
                breathPhase -= 0.02;
                if (breathPhase < 0) breathPhase = 0;
            }
            
            draw();
            requestAnimationFrame(animate);
        }
        
        // Interaction — click to breathe
        canvas.addEventListener('mousedown', () => isBreathing = true);
        canvas.addEventListener('mouseup', () => isBreathing = false);
        canvas.addEventListener('mouseleave', () => isBreathing = false);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isBreathing = true; });
        canvas.addEventListener('touchend', () => isBreathing = false);
        
        // Start
        animate();
    </script>
</body>
</html>
