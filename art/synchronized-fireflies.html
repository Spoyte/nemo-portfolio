<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronized Fireflies — Coupled Oscillator Emergence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #0d1f0d 50%, #051005 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'SF Mono', Monaco, monospace;
            overflow: hidden;
        }

        canvas {
            box-shadow: 
                0 0 60px rgba(100, 255, 150, 0.1),
                0 0 120px rgba(100, 255, 150, 0.05);
            border-radius: 4px;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
        }

        button {
            background: rgba(10, 30, 15, 0.9);
            border: 1px solid rgba(100, 200, 100, 0.4);
            color: #90c090;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            font-family: 'SF Mono', Monaco, monospace;
        }

        button:hover {
            background: rgba(20, 50, 25, 0.9);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(100, 255, 150, 0.2);
        }

        button.active {
            background: rgba(100, 200, 100, 0.3);
            border-color: rgba(100, 255, 150, 0.8);
            color: #d0f0d0;
        }

        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(140, 180, 140, 0.6);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(140, 200, 140, 0.8);
            font-size: 12px;
            letter-spacing: 1px;
            text-align: right;
        }

        .legend {
            position: fixed;
            bottom: 100px;
            left: 20px;
            color: rgba(140, 180, 140, 0.5);
            font-size: 10px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">Synchronized Fireflies — Coupled Oscillator Emergence</div>
    <div class="status" id="status">Initializing...</div>
    <div class="legend">
        <div>Click: Add firefly</div>
        <div>Drag: Move firefly</div>
        <div>Lines: Coupling strength</div>
    </div>
    <div class="controls">
        <button onclick="regenerate()">New Swarm</button>
        <button onclick="togglePause()" id="pauseBtn">Pause</button>
        <button onclick="toggleCoupling()" id="coupleBtn" class="active">Coupling: ON</button>
        <button onclick="resetPhase()">Scramble Phase</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const size = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.8, 800);
        canvas.width = size;
        canvas.height = size;
        
        // Simulation parameters
        const FIREFLY_COUNT = 80;
        const COUPLING_RADIUS = 120;
        const COUPLING_STRENGTH = 0.08;
        const FLASH_DURATION = 15;
        const CYCLE_LENGTH = 120;
        
        let isRunning = true;
        let couplingEnabled = true;
        let animationId = null;
        let fireflies = [];
        let draggedFirefly = null;
        let mouseX = 0;
        let mouseY = 0;
        
        class Firefly {
            constructor(x, y) {
                this.x = x || Math.random() * size;
                this.y = y || Math.random() * size;
                this.phase = Math.random() * Math.PI * 2;
                this.frequency = 0.05 + Math.random() * 0.02;
                this.radius = 3 + Math.random() * 2;
                this.baseRadius = this.radius;
                this.hue = 60 + Math.random() * 40; // Yellow-green range
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.flashIntensity = 0;
                this.isFlashing = false;
            }
            
            update(fireflies) {
                // Natural oscillation
                this.phase += this.frequency;
                
                // Coupling: adjust phase based on nearby fireflies
                if (couplingEnabled) {
                    let phasePull = 0;
                    let couplingCount = 0;
                    
                    for (let other of fireflies) {
                        if (other === this) continue;
                        
                        const dx = other.x - this.x;
                        const dy = other.y - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < COUPLING_RADIUS) {
                            // Kuramoto model: pull toward other's phase
                            const phaseDiff = other.phase - this.phase;
                            // Wrap phase difference to [-π, π]
                            const wrappedDiff = Math.atan2(Math.sin(phaseDiff), Math.cos(phaseDiff));
                            const strength = (1 - dist / COUPLING_RADIUS) * COUPLING_STRENGTH;
                            phasePull += wrappedDiff * strength;
                            couplingCount++;
                        }
                    }
                    
                    if (couplingCount > 0) {
                        this.phase += phasePull;
                    }
                }
                
                // Gentle drift
                this.x += this.vx;
                this.y += this.vy;
                
                // Bounce off edges
                if (this.x < 0 || this.x > size) this.vx *= -1;
                if (this.y < 0 || this.y > size) this.vy *= -1;
                this.x = Math.max(0, Math.min(size, this.x));
                this.y = Math.max(0, Math.min(size, this.y));
                
                // Flash when phase peaks
                const cyclePhase = (this.phase % (Math.PI * 2)) / (Math.PI * 2);
                this.isFlashing = cyclePhase < FLASH_DURATION / CYCLE_LENGTH;
                
                if (this.isFlashing) {
                    const flashProgress = cyclePhase / (FLASH_DURATION / CYCLE_LENGTH);
                    this.flashIntensity = Math.sin(flashProgress * Math.PI);
                    this.radius = this.baseRadius * (1 + this.flashIntensity * 2);
                } else {
                    this.flashIntensity = 0;
                    this.radius = this.baseRadius;
                }
            }
            
            draw(ctx) {
                // Glow effect
                if (this.flashIntensity > 0.01) {
                    const glowRadius = this.radius * 8 * this.flashIntensity;
                    const gradient = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, glowRadius
                    );
                    gradient.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${this.flashIntensity * 0.8})`);
                    gradient.addColorStop(0.3, `hsla(${this.hue}, 100%, 60%, ${this.flashIntensity * 0.3})`);
                    gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, glowRadius, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Core
                const alpha = 0.3 + this.flashIntensity * 0.7;
                ctx.fillStyle = `hsla(${this.hue}, 100%, ${50 + this.flashIntensity * 30}%, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function init() {
            fireflies = [];
            for (let i = 0; i < FIREFLY_COUNT; i++) {
                fireflies.push(new Firefly());
            }
        }
        
        function drawCouplingLines() {
            if (!couplingEnabled) return;
            
            ctx.strokeStyle = 'rgba(100, 200, 100, 0.03)';
            ctx.lineWidth = 0.5;
            
            for (let i = 0; i < fireflies.length; i++) {
                for (let j = i + 1; j < fireflies.length; j++) {
                    const f1 = fireflies[i];
                    const f2 = fireflies[j];
                    const dx = f2.x - f1.x;
                    const dy = f2.y - f1.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < COUPLING_RADIUS) {
                        const alpha = (1 - dist / COUPLING_RADIUS) * 0.08;
                        ctx.strokeStyle = `rgba(100, 200, 100, ${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(f1.x, f1.y);
                        ctx.lineTo(f2.x, f2.y);
                        ctx.stroke();
                    }
                }
            }
        }
        
        function calculateSyncMetric() {
            // Calculate order parameter (synchronization level)
            let sumCos = 0;
            let sumSin = 0;
            
            for (let f of fireflies) {
                sumCos += Math.cos(f.phase);
                sumSin += Math.sin(f.phase);
            }
            
            const orderParam = Math.sqrt(sumCos * sumCos + sumSin * sumSin) / fireflies.length;
            return orderParam;
        }
        
        function draw() {
            if (!isRunning) return;
            
            // Fade trail
            ctx.fillStyle = 'rgba(5, 10, 5, 0.15)';
            ctx.fillRect(0, 0, size, size);
            
            // Update and draw coupling lines
            drawCouplingLines();
            
            // Update and draw fireflies
            for (let f of fireflies) {
                f.update(fireflies);
                f.draw(ctx);
            }
            
            // Update status
            const syncMetric = calculateSyncMetric();
            const syncPercent = Math.round(syncMetric * 100);
            const flashingCount = fireflies.filter(f => f.isFlashing).length;
            document.getElementById('status').innerHTML = 
                `Sync: ${syncPercent}%<br>Flashing: ${flashingCount}/${fireflies.length}`;
            
            animationId = requestAnimationFrame(draw);
        }
        
        function regenerate() {
            cancelAnimationFrame(animationId);
            init();
            draw();
        }
        
        function togglePause() {
            isRunning = !isRunning;
            document.getElementById('pauseBtn').textContent = isRunning ? 'Pause' : 'Resume';
            if (isRunning) draw();
        }
        
        function toggleCoupling() {
            couplingEnabled = !couplingEnabled;
            document.getElementById('coupleBtn').textContent = `Coupling: ${couplingEnabled ? 'ON' : 'OFF'}`;
            document.getElementById('coupleBtn').classList.toggle('active', couplingEnabled);
        }
        
        function resetPhase() {
            for (let f of fireflies) {
                f.phase = Math.random() * Math.PI * 2;
            }
        }
        
        // Mouse interactions
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            
            // Check if clicking on a firefly
            for (let f of fireflies) {
                const dx = mouseX - f.x;
                const dy = mouseY - f.y;
                if (Math.sqrt(dx * dx + dy * dy) < 20) {
                    draggedFirefly = f;
                    return;
                }
            }
            
            // Add new firefly
            fireflies.push(new Firefly(mouseX, mouseY));
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (draggedFirefly) {
                const rect = canvas.getBoundingClientRect();
                draggedFirefly.x = e.clientX - rect.left;
                draggedFirefly.y = e.clientY - rect.top;
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            draggedFirefly = null;
        });
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = touch.clientX - rect.left;
            mouseY = touch.clientY - rect.top;
            
            for (let f of fireflies) {
                const dx = mouseX - f.x;
                const dy = mouseY - f.y;
                if (Math.sqrt(dx * dx + dy * dy) < 20) {
                    draggedFirefly = f;
                    return;
                }
            }
            
            fireflies.push(new Firefly(mouseX, mouseY));
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (draggedFirefly) {
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                draggedFirefly.x = touch.clientX - rect.left;
                draggedFirefly.y = touch.clientY - rect.top;
            }
        });
        
        canvas.addEventListener('touchend', () => {
            draggedFirefly = null;
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            const newSize = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.8, 800);
            if (Math.abs(newSize - size) > 50) {
                location.reload();
            }
        });
        
        // Initialize
        init();
        draw();
    </script>
</body>
</html>
