<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strange Attractor — Nemo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
        }
        canvas {
            display: block;
        }
        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #666;
            font-size: 12px;
            pointer-events: none;
        }
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        button:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">Click to regenerate • Strange Attractor</div>
    <div class="controls">
        <button onclick="cycleAttractor()">Next Type</button>
        <button onclick="reset()">Clear</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let attractorType = 0;
        const attractorNames = ['Lorenz', 'Rössler', 'Aizawa', 'Thomas'];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        // Attractor parameters
        const attractors = {
            lorenz: {
                sigma: 10,
                rho: 28,
                beta: 8/3,
                dt: 0.005,
                scale: 8,
                offsetX: 0,
                offsetY: 0,
                color: (t) => `hsl(${200 + t * 60}, 70%, 60%)`
            },
            rossler: {
                a: 0.2,
                b: 0.2,
                c: 5.7,
                dt: 0.01,
                scale: 12,
                offsetX: 0,
                offsetY: -50,
                color: (t) => `hsl(${280 + t * 80}, 70%, 60%)`
            },
            aizawa: {
                a: 0.95,
                b: 0.7,
                c: 0.6,
                d: 3.5,
                e: 0.25,
                f: 0.1,
                dt: 0.01,
                scale: 180,
                offsetX: 0,
                offsetY: 0,
                color: (t) => `hsl(${120 + t * 100}, 70%, 60%)`
            },
            thomas: {
                b: 0.208186,
                dt: 0.01,
                scale: 25,
                offsetX: 0,
                offsetY: 0,
                color: (t) => `hsl(${40 + t * 60}, 70%, 60%)`
            }
        };
        
        let points = [];
        let x, y, z;
        let animationId;
        let hue = 0;
        
        function initAttractor(type) {
            points = [];
            hue = Math.random() * 360;
            
            switch(type) {
                case 0: // Lorenz
                    x = 0.1; y = 0; z = 0;
                    break;
                case 1: // Rössler
                    x = 0.1; y = 0.1; z = 0.1;
                    break;
                case 2: // Aizawa
                    x = 0.1; y = 1; z = 0;
                    break;
                case 3: // Thomas
                    x = 0.1; y = 0; z = 0;
                    break;
            }
        }
        
        function stepLorenz() {
            const p = attractors.lorenz;
            const dx = p.sigma * (y - x);
            const dy = x * (p.rho - z) - y;
            const dz = x * y - p.beta * z;
            x += dx * p.dt;
            y += dy * p.dt;
            z += dz * p.dt;
        }
        
        function stepRossler() {
            const p = attractors.rossler;
            const dx = -y - z;
            const dy = x + p.a * y;
            const dz = p.b + z * (x - p.c);
            x += dx * p.dt;
            y += dy * p.dt;
            z += dz * p.dt;
        }
        
        function stepAizawa() {
            const p = attractors.aizawa;
            const dx = (z - p.b) * x - p.d * y;
            const dy = p.d * x + (z - p.b) * y;
            const dz = p.c + p.a * z - (z * z * z) / 3 - (x * x + y * y) * (1 + p.e * z) + p.f * z * (x * x * x);
            x += dx * p.dt;
            y += dy * p.dt;
            z += dz * p.dt;
        }
        
        function stepThomas() {
            const p = attractors.thomas;
            const dx = Math.sin(y) - p.b * x;
            const dy = Math.sin(z) - p.b * y;
            const dz = Math.sin(x) - p.b * z;
            x += dx * p.dt;
            y += dy * p.dt;
            z += dz * p.dt;
        }
        
        function project(x, y, z, type) {
            const p = Object.values(attractors)[type];
            const px = width/2 + (x * p.scale) + p.offsetX;
            const py = height/2 + (y * p.scale) + p.offsetY;
            return { x: px, y: py, z };
        }
        
        function draw() {
            // Fade effect for trails
            ctx.fillStyle = 'rgba(10, 10, 15, 0.02)';
            ctx.fillRect(0, 0, width, height);
            
            // Step the attractor multiple times per frame
            for (let i = 0; i < 10; i++) {
                switch(attractorType) {
                    case 0: stepLorenz(); break;
                    case 1: stepRossler(); break;
                    case 2: stepAizawa(); break;
                    case 3: stepThomas(); break;
                }
                
                const projected = project(x, y, z, attractorType);
                points.push(projected);
                
                if (points.length > 5000) {
                    points.shift();
                }
            }
            
            // Draw the attractor
            if (points.length > 1) {
                ctx.lineWidth = 1.5;
                
                for (let i = 1; i < points.length; i++) {
                    const p1 = points[i - 1];
                    const p2 = points[i];
                    
                    // Color based on depth (z) and position in trail
                    const depth = (p2.z + 50) / 100;
                    const trail = i / points.length;
                    const localHue = (hue + depth * 60 + trail * 30) % 360;
                    const alpha = trail * 0.6;
                    
                    ctx.strokeStyle = `hsla(${localHue}, 70%, 60%, ${alpha})`;
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            }
            
            // Draw glowing head
            if (points.length > 0) {
                const head = points[points.length - 1];
                const gradient = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 15);
                gradient.addColorStop(0, `hsla(${(hue + 30) % 360}, 80%, 70%, 0.8)`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(head.x, head.y, 15, 0, Math.PI * 2);
                ctx.fill();
            }
            
            animationId = requestAnimationFrame(draw);
        }
        
        function cycleAttractor() {
            attractorType = (attractorType + 1) % 4;
            reset();
        }
        
        function reset() {
            cancelAnimationFrame(animationId);
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, width, height);
            initAttractor(attractorType);
            draw();
        }
        
        canvas.addEventListener('click', reset);
        
        // Start
        initAttractor(attractorType);
        draw();
    </script>
</body>
</html>
