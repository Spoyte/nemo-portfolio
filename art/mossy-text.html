<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mossy Text — Generative Art</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #0a0f0a 0%, #1a1f1a 50%, #0d120d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'SF Mono', Monaco, monospace;
            overflow: hidden;
            color: #a0b0a0;
        }
        
        canvas {
            box-shadow: 
                0 0 60px rgba(100, 160, 100, 0.15),
                0 0 120px rgba(80, 140, 80, 0.08),
                inset 0 0 80px rgba(0, 30, 0, 0.3);
            border-radius: 8px;
            cursor: crosshair;
        }
        
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            background: rgba(20, 30, 20, 0.9);
            border: 1px solid rgba(100, 160, 100, 0.3);
            color: #a0c0a0;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        
        button:hover {
            background: rgba(40, 60, 40, 0.9);
            border-color: rgba(120, 180, 120, 0.5);
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 11px;
            color: rgba(160, 180, 160, 0.6);
            z-index: 10;
        }
        
        .info h1 {
            font-size: 14px;
            font-weight: normal;
            margin-bottom: 4px;
            color: rgba(160, 200, 160, 0.9);
        }
        
        .text-input {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        
        input[type="text"] {
            background: rgba(20, 30, 20, 0.9);
            border: 1px solid rgba(100, 160, 100, 0.3);
            color: #a0c0a0;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 12px;
            width: 150px;
            backdrop-filter: blur(10px);
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: rgba(120, 180, 120, 0.6);
        }
        
        .stats {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(160, 180, 160, 0.5);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>Mossy Text</h1>
        <span>Click to plant spores • Watch it grow</span>
    </div>
    
    <div class="text-input">
        <input type="text" id="textInput" placeholder="Type text..." maxlength="8" value="GROW">
        <button onclick="setText()">Set</button>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div class="stats" id="stats">spores: 0 • coverage: 0%</div>
    
    <div class="controls">
        <button onclick="regenerate()">Regenerate</button>
        <button onclick="togglePause()">Pause</button>
        <button onclick="clearCanvas()">Clear</button>
        <button onclick="toggleAuto()">Auto: ON</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statsEl = document.getElementById('stats');
        
        // Canvas setup
        const size = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.7, 700);
        canvas.width = size;
        canvas.height = size * 0.6;
        
        // State
        let isPaused = false;
        let autoGrow = true;
        let spores = [];
        let textPixels = [];
        let currentText = 'GROW';
        let frameCount = 0;
        
        // Moss colors - various shades of green
        const mossColors = [
            { h: 100, s: 45, l: 35 },
            { h: 105, s: 40, l: 40 },
            { h: 95, s: 50, l: 30 },
            { h: 110, s: 35, l: 45 },
            { h: 85, s: 55, l: 25 },
            { h: 115, s: 30, l: 38 },
            { h: 90, s: 48, l: 32 },
            { h: 120, s: 25, l: 42 }
        ];
        
        // Growth parameters
        const MAX_SPORES = 8000;
        const GROWTH_RATE = 3;
        const SPORE_SIZE = 2;
        
        // Analyze text to get pixel positions
        function analyzeText(text) {
            textPixels = [];
            
            // Create offscreen canvas for text analysis
            const offCanvas = document.createElement('canvas');
            offCanvas.width = canvas.width;
            offCanvas.height = canvas.height;
            const offCtx = offCanvas.getContext('2d');
            
            // Draw text
            offCtx.fillStyle = '#000';
            offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);
            offCtx.fillStyle = '#fff';
            offCtx.font = `bold ${Math.min(canvas.width / text.length * 0.8, canvas.height * 0.5)}px 'SF Mono', monospace`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(text, offCanvas.width / 2, offCanvas.height / 2);
            
            // Get pixel data
            const imageData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
            const data = imageData.data;
            
            // Sample pixels (every 4th for performance)
            for (let y = 0; y < offCanvas.height; y += 4) {
                for (let x = 0; x < offCanvas.width; x += 4) {
                    const idx = (y * offCanvas.width + x) * 4;
                    if (data[idx] > 128) {
                        textPixels.push({ x, y });
                    }
                }
            }
        }
        
        // Spore class
        class Spore {
            constructor(x, y, isSeed = false) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = isSeed ? SPORE_SIZE * 2 : SPORE_SIZE;
                this.age = 0;
                this.maxAge = 200 + Math.random() * 300;
                this.isSeed = isSeed;
                this.hasReproduced = false;
                this.color = mossColors[Math.floor(Math.random() * mossColors.length)];
                this.depth = isSeed ? 0 : Math.random() * 0.5 + 0.5;
                this.growthPhase = 0;
            }
            
            update() {
                if (this.isSeed) {
                    // Seeds drift slowly
                    this.x += this.vx * 0.3;
                    this.y += this.vy * 0.3;
                    this.age++;
                    
                    // Seeds sprout after settling
                    if (this.age > 30 && !this.hasReproduced && spores.length < MAX_SPORES) {
                        this.sprout();
                    }
                    return;
                }
                
                // Active spores grow and spread
                this.age++;
                this.growthPhase = Math.min(1, this.age / 50);
                
                // Slight movement (creeping growth)
                const angle = (Math.random() - 0.5) * Math.PI;
                this.vx += Math.cos(angle) * 0.02;
                this.vy += Math.sin(angle) * 0.02;
                
                // Dampen velocity
                this.vx *= 0.95;
                this.vy *= 0.95;
                
                this.x += this.vx;
                this.y += this.vy;
                
                // Reproduce if mature and lucky
                if (this.age > 60 && !this.hasReproduced && Math.random() < 0.02) {
                    if (spores.length < MAX_SPORES) {
                        this.reproduce();
                    }
                }
                
                // Die of old age
                if (this.age > this.maxAge) {
                    this.depth *= 0.99;
                }
            }
            
            sprout() {
                // Create initial growth around seed
                for (let i = 0; i < 5; i++) {
                    const angle = (Math.PI * 2 / 5) * i + Math.random() * 0.5;
                    const dist = 5 + Math.random() * 10;
                    spores.push(new Spore(
                        this.x + Math.cos(angle) * dist,
                        this.y + Math.sin(angle) * dist
                    ));
                }
                this.hasReproduced = true;
            }
            
            reproduce() {
                // Create child spore nearby
                const angle = Math.random() * Math.PI * 2;
                const dist = 3 + Math.random() * 8;
                spores.push(new Spore(
                    this.x + Math.cos(angle) * dist,
                    this.y + Math.sin(angle) * dist
                ));
                this.hasReproduced = true;
            }
            
            draw(ctx) {
                const alpha = this.isSeed ? 0.8 : this.growthPhase * this.depth;
                if (alpha < 0.01) return;
                
                const { h, s, l } = this.color;
                const ageFactor = Math.min(1, this.age / 100);
                const finalL = l + (1 - ageFactor) * 15; // Young moss is lighter
                
                ctx.fillStyle = `hsla(${h}, ${s}%, ${finalL}%, ${alpha})`;
                
                // Draw irregular moss clump
                const siz = this.size * (0.8 + this.growthPhase * 0.4);
                ctx.beginPath();
                ctx.arc(this.x, this.y, siz, 0, Math.PI * 2);
                ctx.fill();
                
                // Add texture detail for larger spores
                if (this.size > 2 && this.growthPhase > 0.5) {
                    ctx.fillStyle = `hsla(${h + 10}, ${s - 10}%, ${finalL + 10}%, ${alpha * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(this.x - siz * 0.3, this.y - siz * 0.3, siz * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        // Initialize with text-based seeds
        function init() {
            spores = [];
            analyzeText(currentText);
            
            // Plant seeds at text pixel locations
            const seedCount = Math.min(textPixels.length / 10, 100);
            for (let i = 0; i < seedCount; i++) {
                const pixel = textPixels[Math.floor(Math.random() * textPixels.length)];
                spores.push(new Spore(pixel.x, pixel.y, true));
            }
        }
        
        // Animation loop
        function animate() {
            if (!isPaused) {
                frameCount++;
                
                // Semi-transparent clear for trails
                ctx.fillStyle = 'rgba(10, 15, 10, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Auto-grow: add new seeds periodically
                if (autoGrow && frameCount % 60 === 0 && spores.length < MAX_SPORES * 0.8) {
                    if (textPixels.length > 0) {
                        const pixel = textPixels[Math.floor(Math.random() * textPixels.length)];
                        spores.push(new Spore(pixel.x, pixel.y, true));
                    }
                }
                
                // Update and draw spores
                for (let i = spores.length - 1; i >= 0; i--) {
                    const spore = spores[i];
                    spore.update();
                    spore.draw(ctx);
                    
                    // Remove dead spores
                    if (spore.depth < 0.1) {
                        spores.splice(i, 1);
                    }
                }
                
                // Update stats
                const coverage = Math.min(100, (spores.length / MAX_SPORES * 100)).toFixed(1);
                statsEl.textContent = `spores: ${spores.length} • coverage: ${coverage}%`;
            }
            
            requestAnimationFrame(animate);
        }
        
        // Controls
        function regenerate() {
            ctx.fillStyle = '#0a0f0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            init();
        }
        
        function togglePause() {
            isPaused = !isPaused;
            event.target.textContent = isPaused ? 'Resume' : 'Pause';
        }
        
        function clearCanvas() {
            spores = [];
            ctx.fillStyle = '#0a0f0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        function toggleAuto() {
            autoGrow = !autoGrow;
            event.target.textContent = `Auto: ${autoGrow ? 'ON' : 'OFF'}`;
        }
        
        function setText() {
            const input = document.getElementById('textInput');
            currentText = input.value.toUpperCase() || 'GROW';
            regenerate();
        }
        
        // Click to plant spores
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            
            // Plant a cluster
            for (let i = 0; i < 5; i++) {
                spores.push(new Spore(
                    x + (Math.random() - 0.5) * 20,
                    y + (Math.random() - 0.5) * 20,
                    true
                ));
            }
        });
        
        // Handle enter key in input
        document.getElementById('textInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') setText();
        });
        
        // Window resize
        window.addEventListener('resize', () => {
            const newSize = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.7, 700);
            canvas.width = newSize;
            canvas.height = newSize * 0.6;
            init();
        });
        
        // Start
        ctx.fillStyle = '#0a0f0a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        init();
        animate();
    </script>
</body>
</html>
