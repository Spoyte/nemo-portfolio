<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Flow — Peak Shift Principle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #050508;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .info {
            position: fixed;
            bottom: 30px;
            left: 30px;
            color: rgba(200, 200, 220, 0.6);
            font-size: 12px;
            letter-spacing: 0.05em;
            pointer-events: none;
            z-index: 10;
        }
        
        .title {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.1em;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="title">NEURAL FLOW — Peak Shift Principle</div>
    <div class="info">click to regenerate • move to influence</div>
    <canvas id="canvas"></canvas>
    
    <script>
        /*
         * NEURAL FLOW
         * 
         * Applying the Peak Shift Principle from neuroscience research:
         * If the brain responds to flow patterns, exaggerate the flow-ness
         * until it becomes a super-stimulus — more "flow-like" than real flow.
         * 
         * This piece mimics the visual cortex's hierarchical processing:
         * - Edge detection (simple cells)
         * - Motion detection (complex cells)
         * - Pattern completion (hypercomplex cells)
         * 
         * The result tickles the same neural circuits evolved to track 
         * water, wind, and predator movement — but amplified.
         * 
         * Rams Principles:
         * - Innovative: Neuroscience-informed generative art
         * - Useful: Demonstrates peak shift in visual form
         * - Aesthetic: High complexity, low randomness (beauty signal)
         * - Understandable: Organic flow patterns feel natural
         * - Unobtrusive: Full immersion, minimal UI
         * - Honest: Code reveals the algorithm
         * - Long-lasting: Mathematical truth, not trends
         * - Thorough: Multi-scale detail rewards attention
         * - Minimal: Only what serves the concept
         */
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, dpr;
        let time = 0;
        let mouse = { x: 0.5, y: 0.5, active: false };
        let particles = [];
        let flowField = [];
        let fieldResolution = 20;
        
        // Neural-inspired color palette
        // Based on research: curves + specific hues activate reward circuits
        const palettes = [
            { name: 'synapse', colors: ['#ff006e', '#8338ec', '#3a86ff', '#06ffa5', '#ffbe0b'] },
            { name: 'cortex', colors: ['#ff9f1c', '#ffbf69', '#ffffff', '#cbf3f0', '#2ec4b6'] },
            { name: 'deep', colors: ['#7209b7', '#560bad', '#480ca8', '#3a0ca3', '#3f37c9'] },
            { name: 'aurora', colors: ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93'] }
        ];
        let currentPalette = palettes[0];
        
        function resize() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr);
            initFlowField();
        }
        
        // Multi-octave simplex-like noise function
        // Creates the high-complexity, low-randomness signal the brain prefers
        function noise(x, y, t) {
            let value = 0;
            let amplitude = 1;
            let frequency = 1;
            let maxValue = 0;
            
            // 4 octaves = fractal dimension ~1.3-1.5 (optimal per research)
            for (let i = 0; i < 4; i++) {
                value += amplitude * Math.sin(x * frequency + t * 0.5) * 
                         Math.cos(y * frequency * 0.7 + t * 0.3);
                value += amplitude * Math.sin((x + y) * frequency * 0.5 + t * 0.2);
                maxValue += amplitude;
                amplitude *= 0.5;
                frequency *= 2;
            }
            
            return value / maxValue;
        }
        
        function initFlowField() {
            flowField = [];
            const cols = Math.ceil(width / fieldResolution) + 1;
            const rows = Math.ceil(height / fieldResolution) + 1;
            
            for (let y = 0; y < rows; y++) {
                flowField[y] = [];
                for (let x = 0; x < cols; x++) {
                    flowField[y][x] = 0;
                }
            }
        }
        
        function updateFlowField() {
            const cols = flowField[0]?.length || 0;
            const rows = flowField.length;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const px = x * fieldResolution;
                    const py = y * fieldResolution;
                    
                    // Multi-layered flow calculation
                    // Peak shift: exaggerate the curliness
                    let angle = noise(px * 0.003, py * 0.003, time * 0.0003) * Math.PI * 4;
                    
                    // Add secondary flow for complexity
                    angle += noise(px * 0.007 + 100, py * 0.007, time * 0.0005) * Math.PI * 2;
                    
                    // Mouse influence (attractor/repeller)
                    if (mouse.active) {
                        const mx = mouse.x * width;
                        const my = mouse.y * height;
                        const dx = mx - px;
                        const dy = my - py;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const maxDist = 300;
                        
                        if (dist < maxDist) {
                            const strength = (1 - dist / maxDist) * 0.5;
                            const mouseAngle = Math.atan2(dy, dx);
                            // Vortex around mouse
                            angle += mouseAngle * strength + Math.PI / 2 * strength;
                        }
                    }
                    
                    flowField[y][x] = angle;
                }
            }
        }
        
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = 0;
                this.vy = 0;
                this.speed = 1 + Math.random() * 2;
                this.life = 1;
                this.decay = 0.002 + Math.random() * 0.003;
                this.color = currentPalette.colors[Math.floor(Math.random() * currentPalette.colors.length)];
                this.size = 0.5 + Math.random() * 1.5;
                this.history = [];
                this.maxHistory = 20 + Math.floor(Math.random() * 30);
            }
            
            update() {
                // Store history for trail effect
                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > this.maxHistory) {
                    this.history.shift();
                }
                
                // Get flow field angle at current position
                const col = Math.floor(this.x / fieldResolution);
                const row = Math.floor(this.y / fieldResolution);
                
                let angle = 0;
                if (flowField[row] && flowField[row][col] !== undefined) {
                    angle = flowField[row][col];
                }
                
                // Apply flow force with momentum (inertia feels organic)
                const targetVx = Math.cos(angle) * this.speed;
                const targetVy = Math.sin(angle) * this.speed;
                
                this.vx += (targetVx - this.vx) * 0.1;
                this.vy += (targetVy - this.vy) * 0.1;
                
                // Update position
                this.x += this.vx;
                this.y += this.vy;
                
                // Decay life
                this.life -= this.decay;
                
                // Reset if dead or out of bounds
                if (this.life <= 0 || 
                    this.x < -50 || this.x > width + 50 ||
                    this.y < -50 || this.y > height + 50) {
                    this.reset();
                }
            }
            
            draw() {
                if (this.history.length < 2) return;
                
                ctx.beginPath();
                ctx.moveTo(this.history[0].x, this.history[0].y);
                
                // Smooth curve through history points
                for (let i = 1; i < this.history.length; i++) {
                    const point = this.history[i];
                    ctx.lineTo(point.x, point.y);
                }
                
                // Gradient alpha based on life and position in trail
                const alpha = this.life * 0.6;
                ctx.strokeStyle = this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                ctx.lineWidth = this.size * this.life;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }
        }
        
        function initParticles() {
            particles = [];
            const count = Math.min(800, Math.floor((width * height) / 2000));
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }
        
        function drawBackground() {
            // Subtle gradient background
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, Math.max(width, height)
            );
            gradient.addColorStop(0, '#0a0a15');
            gradient.addColorStop(1, '#050508');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }
        
        function drawConnections() {
            // Draw subtle connections between nearby particles
            // This activates the brain's grouping/Gestalt circuits
            ctx.globalCompositeOperation = 'screen';
            
            for (let i = 0; i < particles.length; i += 5) { // Sample for performance
                const p1 = particles[i];
                if (p1.life < 0.3) continue;
                
                for (let j = i + 1; j < Math.min(i + 20, particles.length); j++) {
                    const p2 = particles[j];
                    if (p2.life < 0.3) continue;
                    
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 80) {
                        const alpha = (1 - dist / 80) * 0.03 * p1.life * p2.life;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(100, 150, 255, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            
            ctx.globalCompositeOperation = 'source-over';
        }
        
        function animate() {
            // Fade effect for trails
            ctx.fillStyle = 'rgba(5, 5, 8, 0.08)';
            ctx.fillRect(0, 0, width, height);
            
            // Update flow field periodically (not every frame for performance)
            if (time % 3 === 0) {
                updateFlowField();
            }
            
            // Draw connections first (background layer)
            drawConnections();
            
            // Update and draw particles
            ctx.globalCompositeOperation = 'lighter';
            for (const p of particles) {
                p.update();
                p.draw();
            }
            ctx.globalCompositeOperation = 'source-over';
            
            time++;
            requestAnimationFrame(animate);
        }
        
        function regenerate() {
            // Cycle through palettes
            const paletteIndex = (palettes.indexOf(currentPalette) + 1) % palettes.length;
            currentPalette = palettes[paletteIndex];
            
            // Reinitialize with new colors
            particles.forEach(p => {
                p.color = currentPalette.colors[Math.floor(Math.random() * currentPalette.colors.length)];
                p.reset();
            });
            
            // Clear canvas with new background
            drawBackground();
        }
        
        // Event listeners
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });
        
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX / width;
            mouse.y = e.clientY / height;
            mouse.active = true;
        });
        
        window.addEventListener('mouseleave', () => {
            mouse.active = false;
        });
        
        window.addEventListener('click', regenerate);
        
        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            mouse.x = touch.clientX / width;
            mouse.y = touch.clientY / height;
            mouse.active = true;
        });
        
        window.addEventListener('touchend', () => {
            mouse.active = false;
        });
        
        // Initialize
        resize();
        drawBackground();
        initParticles();
        animate();
    </script>
</body>
</html>
