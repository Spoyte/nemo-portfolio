<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-Body Particle Physics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        canvas {
            display: block;
            cursor: crosshair;
        }
        
        .ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
        
        .ui h1 {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .ui p {
            margin: 4px 0;
            color: rgba(255, 255, 255, 0.4);
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        
        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
        }
        
        button.active {
            background: rgba(100, 200, 255, 0.2);
            border-color: rgba(100, 200, 255, 0.4);
            color: rgba(100, 200, 255, 0.9);
        }
        
        .stats {
            position: fixed;
            top: 20px;
            right: 20px;
            text-align: right;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="ui">
        <h1>N-Body Particle Physics</h1>
        <p>Click & drag to attract</p>
        <p>Right-click to repel</p>
        <p>Space to pause</p>
    </div>
    
    <div class="stats" id="stats">
        Particles: 0<br>
        FPS: 0
    </div>
    
    <div class="controls">
        <button onclick="setMode('galaxy')" class="active" id="btn-galaxy">Galaxy</button>
        <button onclick="setMode('attract')" id="btn-attract">Attract</button>
        <button onclick="setMode('repel')" id="btn-repel">Repel</button>
        <button onclick="setMode('orbit')" id="btn-orbit">Orbit</button>
        <button onclick="setMode('chaos')" id="btn-chaos">Chaos</button>
        <button onclick="reset()">Reset</button>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statsEl = document.getElementById('stats');
        
        let width, height;
        let particles = [];
        let mouse = { x: 0, y: 0, down: false, rightDown: false };
        let mode = 'galaxy';
        let paused = false;
        let frameCount = 0;
        let lastTime = performance.now();
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resize);
        resize();
        
        // Particle class
        class Particle {
            constructor(x, y, vx, vy, mass, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.mass = mass;
                this.color = color;
                this.radius = Math.sqrt(mass) * 1.5;
                this.trail = [];
                this.maxTrail = 20;
            }
            
            update() {
                // Store trail
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.maxTrail) {
                    this.trail.shift();
                }
                
                // Update position
                this.x += this.vx;
                this.y += this.vy;
                
                // Boundary wrap
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }
            
            draw() {
                // Draw trail
                if (this.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) {
                        const alpha = i / this.trail.length * 0.3;
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                    ctx.strokeStyle = this.color.replace(')', `, ${0.2})`).replace('rgb', 'rgba');
                    ctx.lineWidth = this.radius * 0.5;
                    ctx.stroke();
                }
                
                // Draw particle
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // Glow
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius * 3
                );
                gradient.addColorStop(0, this.color.replace(')', ', 0.3)').replace('rgb', 'rgba'));
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Physics functions
        function applyGravity() {
            const G = 0.5;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];
                    
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq);
                    
                    if (dist < 5) continue; // Prevent singularity
                    
                    const force = G * p1.mass * p2.mass / distSq;
                    const fx = force * dx / dist;
                    const fy = force * dy / dist;
                    
                    p1.vx += fx / p1.mass;
                    p1.vy += fy / p1.mass;
                    p2.vx -= fx / p2.mass;
                    p2.vy -= fy / p2.mass;
                }
            }
        }
        
        function applyMouseForce() {
            if (!mouse.down && !mouse.rightDown) return;
            
            const force = mouse.rightDown ? -2 : 2;
            
            for (const p of particles) {
                const dx = mouse.x - p.x;
                const dy = mouse.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 300 && dist > 5) {
                    const f = force * 50 / (dist + 10);
                    p.vx += f * dx / dist;
                    p.vy += f * dy / dist;
                }
            }
        }
        
        function applyDamping() {
            for (const p of particles) {
                p.vx *= 0.999;
                p.vy *= 0.999;
            }
        }
        
        // Mode initializers
        function initGalaxy() {
            particles = [];
            const centerX = width / 2;
            const centerY = height / 2;
            
            // Central massive body
            particles.push(new Particle(centerX, centerY, 0, 0, 100, 'rgb(255, 200, 100)'));
            
            // Orbiting particles
            const count = 400;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 50 + Math.random() * 300;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                
                // Orbital velocity for circular orbit
                const orbitalSpeed = Math.sqrt(50 / radius);
                const vx = -Math.sin(angle) * orbitalSpeed * (0.8 + Math.random() * 0.4);
                const vy = Math.cos(angle) * orbitalSpeed * (0.8 + Math.random() * 0.4);
                
                const hue = 180 + Math.random() * 60;
                const color = `rgb(${100 + Math.random() * 100}, ${150 + Math.random() * 105}, 255)`;
                
                particles.push(new Particle(x, y, vx, vy, 1 + Math.random() * 2, color));
            }
        }
        
        function initAttract() {
            particles = [];
            for (let i = 0; i < 300; i++) {
                particles.push(new Particle(
                    Math.random() * width,
                    Math.random() * height,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2,
                    2 + Math.random() * 3,
                    `hsl(${180 + Math.random() * 60}, 80%, 60%)`
                ));
            }
        }
        
        function initRepel() {
            particles = [];
            for (let i = 0; i < 250; i++) {
                particles.push(new Particle(
                    width / 2 + (Math.random() - 0.5) * 100,
                    height / 2 + (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 10,
                    2 + Math.random() * 2,
                    `hsl(${300 + Math.random() * 60}, 80%, 60%)`
                ));
            }
        }
        
        function initOrbit() {
            particles = [];
            const cx = width / 2;
            const cy = height / 2;
            
            // Multiple attractors
            const attractors = [
                { x: cx - 150, y: cy, mass: 80 },
                { x: cx + 150, y: cy, mass: 80 },
                { x: cx, y: cy - 100, mass: 60 }
            ];
            
            for (const a of attractors) {
                particles.push(new Particle(a.x, a.y, 0, 0, a.mass, 'rgb(255, 100, 100)'));
            }
            
            for (let i = 0; i < 350; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = 80 + Math.random() * 250;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                
                const speed = Math.sqrt(100 / r) * (0.7 + Math.random() * 0.6);
                const vx = -Math.sin(angle) * speed;
                const vy = Math.cos(angle) * speed;
                
                particles.push(new Particle(x, y, vx, vy, 1.5, `hsl(${120 + Math.random() * 80}, 70%, 60%)`));
            }
        }
        
        function initChaos() {
            particles = [];
            // Random massive bodies
            for (let i = 0; i < 5; i++) {
                particles.push(new Particle(
                    Math.random() * width,
                    Math.random() * height,
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5,
                    30 + Math.random() * 50,
                    `hsl(${Math.random() * 360}, 70%, 50%)`
                ));
            }
            
            // Many small particles
            for (let i = 0; i < 200; i++) {
                particles.push(new Particle(
                    Math.random() * width,
                    Math.random() * height,
                    (Math.random() - 0.5) * 3,
                    (Math.random() - 0.5) * 3,
                    1 + Math.random(),
                    `hsl(${Math.random() * 360}, 60%, 70%)`
                ));
            }
        }
        
        // Controls
        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${newMode}`)?.classList.add('active');
            reset();
        }
        
        function reset() {
            switch (mode) {
                case 'galaxy': initGalaxy(); break;
                case 'attract': initAttract(); break;
                case 'repel': initRepel(); break;
                case 'orbit': initOrbit(); break;
                case 'chaos': initChaos(); break;
            }
        }
        
        // Input handling
        canvas.addEventListener('mousedown', e => {
            if (e.button === 0) mouse.down = true;
            if (e.button === 2) mouse.rightDown = true;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        canvas.addEventListener('mouseup', () => {
            mouse.down = false;
            mouse.rightDown = false;
        });
        
        canvas.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        canvas.addEventListener('contextmenu', e => e.preventDefault());
        
        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                paused = !paused;
                e.preventDefault();
            }
        });
        
        // Main loop
        function animate() {
            // Fade effect
            ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
            ctx.fillRect(0, 0, width, height);
            
            if (!paused) {
                // Physics
                if (mode !== 'repel') {
                    applyGravity();
                }
                applyMouseForce();
                applyDamping();
                
                // Update particles
                for (const p of particles) {
                    p.update();
                }
            }
            
            // Draw particles
            for (const p of particles) {
                p.draw();
            }
            
            // Stats
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                const fps = Math.round(frameCount * 1000 / (now - lastTime));
                statsEl.innerHTML = `Particles: ${particles.length}<br>FPS: ${fps}`;
                frameCount = 0;
                lastTime = now;
            }
            
            requestAnimationFrame(animate);
        }
        
        // Start
        initGalaxy();
        animate();
    </script>
</body>
</html>
