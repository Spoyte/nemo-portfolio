<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Field Traces - Generative Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        canvas {
            box-shadow: 0 0 60px rgba(100, 80, 200, 0.3);
            border-radius: 4px;
        }
        .info {
            position: absolute;
            bottom: 20px;
            color: #444;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">Flow Field Traces | Perlin Noise + Particle System | Click to regenerate</div>
    
    <script>
        // Simple Perlin Noise implementation
        class PerlinNoise {
            constructor() {
                this.perm = new Uint8Array(512);
                this.p = new Uint8Array(256);
                for (let i = 0; i < 256; i++) this.p[i] = i;
                for (let i = 255; i > 0; i--) {
                    const n = Math.floor(Math.random() * (i + 1));
                    [this.p[i], this.p[n]] = [this.p[n], this.p[i]];
                }
                for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
            }
            
            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(t, a, b) { return a + t * (b - a); }
            grad(hash, x, y) {
                const h = hash & 15;
                const u = h < 8 ? x : y;
                const v = h < 4 ? y : h === 12 || h === 14 ? x : 0;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }
            
            noise(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                x -= Math.floor(x);
                y -= Math.floor(y);
                const u = this.fade(x);
                const v = this.fade(y);
                const A = this.perm[X] + Y, B = this.perm[X + 1] + Y;
                return this.lerp(v, 
                    this.lerp(u, this.grad(this.perm[A], x, y), this.grad(this.perm[B], x - 1, y)),
                    this.lerp(u, this.grad(this.perm[A + 1], x, y - 1), this.grad(this.perm[B + 1], x - 1, y - 1))
                );
            }
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        const size = 800;
        canvas.width = size;
        canvas.height = size;
        
        const noise = new PerlinNoise();
        
        // Configuration
        const config = {
            scale: 0.003,
            step: 2,
            numParticles: 1500,
            maxSteps: 150,
            lineWidth: 0.5,
            opacity: 0.08
        };
        
        // Color palettes inspired by natural phenomena
        const palettes = [
            // Aurora - greens and purples
            [
                { h: 140, s: 80, l: 60 },
                { h: 160, s: 90, l: 50 },
                { h: 280, s: 70, l: 55 },
                { h: 320, s: 60, l: 50 }
            ],
            // Sunset - oranges and pinks
            [
                { h: 20, s: 90, l: 60 },
                { h: 340, s: 80, l: 55 },
                { h: 10, s: 85, l: 65 },
                { h: 30, s: 75, l: 50 }
            ],
            // Ocean - blues and teals
            [
                { h: 200, s: 80, l: 50 },
                { h: 180, s: 70, l: 55 },
                { h: 220, s: 75, l: 45 },
                { h: 190, s: 85, l: 60 }
            ],
            // Ember - reds and oranges
            [
                { h: 10, s: 90, l: 55 },
                { h: 30, s: 85, l: 50 },
                { h: 0, s: 80, l: 45 },
                { h: 45, s: 70, l: 55 }
            ]
        ];
        
        function getFlowAngle(x, y, time = 0) {
            const n = noise.noise(x * config.scale, y * config.scale + time * 0.0001);
            return n * Math.PI * 4;
        }
        
        function lerpColor(c1, c2, t) {
            return {
                h: c1.h + (c2.h - c1.h) * t,
                s: c1.s + (c2.s - c1.s) * t,
                l: c1.l + (c2.l - c1.l) * t
            };
        }
        
        function draw() {
            // Clear with dark background
            ctx.fillStyle = '#080810';
            ctx.fillRect(0, 0, size, size);
            
            // Add subtle gradient background
            const bgGradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size);
            bgGradient.addColorStop(0, '#0a0a18');
            bgGradient.addColorStop(1, '#050508');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, size, size);
            
            // Select random palette
            const palette = palettes[Math.floor(Math.random() * palettes.length)];
            
            // Create particles at random positions
            const particles = [];
            for (let i = 0; i < config.numParticles; i++) {
                particles.push({
                    x: Math.random() * size,
                    y: Math.random() * size,
                    color: palette[Math.floor(Math.random() * palette.length)],
                    life: Math.random() * config.maxSteps
                });
            }
            
            // Draw flow lines
            particles.forEach((p, idx) => {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                
                let x = p.x;
                let y = p.y;
                let steps = 0;
                
                // Follow the flow field
                while (steps < p.life && x >= 0 && x < size && y >= 0 && y < size) {
                    const angle = getFlowAngle(x, y, idx);
                    x += Math.cos(angle) * config.step;
                    y += Math.sin(angle) * config.step;
                    ctx.lineTo(x, y);
                    steps++;
                }
                
                // Vary color based on position and particle index
                const colorPos = (p.x / size + p.y / size + idx / config.numParticles) / 3;
                const c1 = palette[Math.floor(colorPos * palette.length) % palette.length];
                const c2 = palette[(Math.floor(colorPos * palette.length) + 1) % palette.length];
                const finalColor = lerpColor(c1, c2, (colorPos * palette.length) % 1);
                
                ctx.strokeStyle = `hsla(${finalColor.h}, ${finalColor.s}%, ${finalColor.l}%, ${config.opacity})`;
                ctx.lineWidth = config.lineWidth + Math.random() * 0.5;
                ctx.stroke();
            });
            
            // Add some "seed points" - brighter dots where particles started
            particles.slice(0, 200).forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 1 + Math.random() * 2, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${p.color.h}, ${p.color.s}%, ${p.color.l + 20}%, 0.3)`;
                ctx.fill();
            });
        }
        
        // Initial draw
        draw();
        
        // Regenerate on click
        canvas.addEventListener('click', () => {
            // Re-seed noise
            for (let i = 255; i > 0; i--) {
                const n = Math.floor(Math.random() * (i + 1));
                [noise.p[i], noise.p[n]] = [noise.p[n], noise.p[i]];
            }
            for (let i = 0; i < 512; i++) noise.perm[i] = noise.p[i & 255];
            draw();
        });
    </script>
</body>
</html>
