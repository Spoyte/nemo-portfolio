<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Nebula — Volumetric Cosmic Clouds</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(20px);
            padding: 25px 35px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-width: 400px;
            max-width: 500px;
        }
        
        .control-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .control-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #888;
            min-width: 100px;
            font-weight: 500;
        }
        
        input[type="range"] {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }
        
        select {
            flex: 1;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
        }
        
        select option {
            background: #1a1a2e;
            color: #fff;
        }
        
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .stats {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 20, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: #888;
            line-height: 1.6;
        }
        
        .stats span {
            color: #fff;
            font-weight: 600;
        }
        
        .title {
            position: fixed;
            top: 20px;
            right: 20px;
            text-align: right;
        }
        
        .title h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .title p {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            letter-spacing: 2px;
        }
        
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .toggle-controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: grid;
            place-items: center;
        }
        
        .toggle-controls:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="title">
        <h1>NEBULA</h1>
        <p>VOLUMETRIC COSMIC CLOUDS</p>
    </div>
    
    <div class="stats" id="stats">
        FPS: <span id="fps">0</span><br>
        Samples: <span id="samples">64</span><br>
        Stars: <span id="starCount">0</span>
    </div>
    
    <div class="controls" id="controls">
        <div class="control-row">
            <span class="control-label">Nebula Type</span>
            <select id="nebulaType">
                <option value="emission">Emission Nebula</option>
                <option value="reflection">Reflection Nebula</option>
                <option value="dark">Dark Nebula</option>
                <option value="planetary">Planetary Nebula</option>
                <option value="supernova">Supernova Remnant</option>
            </select>
        </div>
        
        <div class="control-row">
            <span class="control-label">Density</span>
            <input type="range" id="density" min="0.1" max="2.0" step="0.1" value="0.8">
        </div>
        
        <div class="control-row">
            <span class="control-label">Turbulence</span>
            <input type="range" id="turbulence" min="0.5" max="3.0" step="0.1" value="1.5">
        </div>
        
        <div class="control-row">
            <span class="control-label">Evolution</span>
            <input type="range" id="evolution" min="0" max="1" step="0.01" value="0.3">
        </div>
        
        <div class="control-row">
            <span class="control-label">Star Density</span>
            <input type="range" id="starDensity" min="0" max="200" step="10" value="100">
        </div>
        
        <div class="btn-group">
            <button class="btn" id="regenerate">Regenerate</button>
            <button class="btn" id="toggleAnimation">Pause</button>
            <button class="btn" id="saveImage">Save</button>
        </div>
    </div>
    
    <button class="toggle-controls" id="toggleControls">⚙️</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let animationId;
        let isAnimating = true;
        let frameCount = 0;
        let lastTime = performance.now();
        
        // Nebula parameters
        let params = {
            type: 'emission',
            density: 0.8,
            turbulence: 1.5,
            evolution: 0.3,
            starDensity: 100
        };
        
        // Color palettes for different nebula types
        const palettes = {
            emission: {
                name: 'Emission',
                colors: [
                    { r: 255, g: 100, b: 100 },   // Red
                    { r: 255, g: 150, b: 50 },    // Orange
                    { r: 255, g: 200, b: 100 },   // Yellow
                    { r: 200, g: 100, b: 255 },   // Purple
                    { r: 100, g: 100, b: 255 }    // Blue
                ],
                background: { r: 5, g: 5, b: 15 }
            },
            reflection: {
                name: 'Reflection',
                colors: [
                    { r: 100, g: 150, b: 255 },   // Blue
                    { r: 150, g: 200, b: 255 },   // Light blue
                    { r: 200, g: 220, b: 255 },   // Pale blue
                    { r: 255, g: 255, b: 255 },   // White
                    { r: 180, g: 200, b: 255 }    // Periwinkle
                ],
                background: { r: 5, g: 8, b: 20 }
            },
            dark: {
                name: 'Dark',
                colors: [
                    { r: 30, g: 20, b: 40 },      // Dark purple
                    { r: 50, g: 40, b: 60 },      // Darker
                    { r: 20, g: 15, b: 30 },      // Very dark
                    { r: 60, g: 50, b: 70 },      // Edge
                    { r: 40, g: 30, b: 50 }       // Mid
                ],
                background: { r: 8, g: 6, b: 12 }
            },
            planetary: {
                name: 'Planetary',
                colors: [
                    { r: 50, g: 255, b: 150 },    // Green
                    { r: 100, g: 255, b: 200 },   // Cyan
                    { r: 200, g: 255, b: 255 },   // Light cyan
                    { r: 255, g: 255, b: 200 },   // Yellow-white
                    { r: 255, g: 200, b: 100 }    // Gold
                ],
                background: { r: 5, g: 15, b: 12 }
            },
            supernova: {
                name: 'Supernova',
                colors: [
                    { r: 255, g: 255, b: 200 },   // White-yellow
                    { r: 255, g: 200, b: 100 },   // Gold
                    { r: 255, g: 100, b: 50 },    // Orange
                    { r: 255, g: 50, b: 50 },     // Red
                    { r: 150, g: 50, b: 255 }     // Purple
                ],
                background: { r: 10, g: 5, b: 8 }
            }
        };
        
        // Star field
        let stars = [];
        
        // Noise function (simplex-like)
        function noise(x, y, z) {
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;
            const Z = Math.floor(z) & 255;
            
            x -= Math.floor(x);
            y -= Math.floor(y);
            z -= Math.floor(z);
            
            const u = fade(x);
            const v = fade(y);
            const w = fade(z);
            
            const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z;
            const B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
            
            return lerp(w, lerp(v, lerp(u, grad(p[AA], x, y, z),
                grad(p[BA], x - 1, y, z)),
                lerp(u, grad(p[AB], x, y - 1, z),
                grad(p[BB], x - 1, y - 1, z))),
                lerp(v, lerp(u, grad(p[AA + 1], x, y, z - 1),
                grad(p[BA + 1], x - 1, y, z - 1)),
                lerp(u, grad(p[AB + 1], x, y - 1, z - 1),
                grad(p[BB + 1], x - 1, y - 1, z - 1))));
        }
        
        function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        function lerp(t, a, b) { return a + t * (b - a); }
        function grad(hash, x, y, z) {
            const h = hash & 15;
            const u = h < 8 ? x : y;
            const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
            return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
        }
        
        // Permutation table
        const p = new Uint8Array(512);
        const permutation = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
        for (let i = 0; i < 256; i++) p[i] = p[i + 256] = permutation[i];
        
        // FBM (Fractal Brownian Motion)
        function fbm(x, y, z, octaves = 4, persistence = 0.5) {
            let total = 0;
            let amplitude = 1;
            let frequency = 1;
            let maxValue = 0;
            
            for (let i = 0; i < octaves; i++) {
                total += noise(x * frequency, y * frequency, z * frequency) * amplitude;
                maxValue += amplitude;
                amplitude *= persistence;
                frequency *= 2;
            }
            
            return total / maxValue;
        }
        
        // Generate star field
        function generateStars() {
            stars = [];
            const count = params.starDensity;
            
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    brightness: Math.random() * 0.8 + 0.2,
                    twinkle: Math.random() * Math.PI * 2,
                    twinkleSpeed: Math.random() * 0.02 + 0.01
                });
            }
            
            document.getElementById('starCount').textContent = count;
        }
        
        // Get nebula density at position
        function getNebulaDensity(x, y, time) {
            const scale = 0.003 * params.turbulence;
            const evolution = time * params.evolution * 0.0001;
            
            // Multiple layers of noise for cloud-like structure
            let density = 0;
            
            // Large-scale structure
            density += fbm(x * scale + evolution, y * scale, evolution, 3, 0.5) * 0.5;
            
            // Medium detail
            density += fbm(x * scale * 2 - evolution * 0.5, y * scale * 2 + 100, evolution * 0.7, 3, 0.5) * 0.3;
            
            // Fine detail
            density += fbm(x * scale * 4, y * scale * 4 - evolution * 0.3, evolution * 0.5, 2, 0.5) * 0.2;
            
            // Apply density multiplier and shape it
            density = (density + 1) * 0.5; // Normalize to 0-1
            density = Math.pow(density, 2); // Sharpen
            density *= params.density;
            
            // Add some "pillars" or structure based on position
            const centerX = width * 0.5;
            const centerY = height * 0.5;
            const distFromCenter = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);
            const maxDist = Math.min(width, height) * 0.4;
            
            // Falloff from center
            const falloff = Math.max(0, 1 - distFromCenter / maxDist);
            density *= falloff;
            
            return Math.max(0, Math.min(1, density));
        }
        
        // Get color from palette based on density and position
        function getNebulaColor(x, y, density, time) {
            const palette = palettes[params.type].colors;
            
            // Use position and noise to determine which color to sample
            const colorNoise = fbm(x * 0.002, y * 0.002, time * 0.0001, 2, 0.5);
            const colorIndex = ((colorNoise + 1) * 0.5 * (palette.length - 1));
            const index1 = Math.floor(colorIndex);
            const index2 = Math.min(index1 + 1, palette.length - 1);
            const t = colorIndex - index1;
            
            const c1 = palette[index1];
            const c2 = palette[index2];
            
            // Interpolate between colors
            const r = Math.floor(c1.r + (c2.r - c1.r) * t);
            const g = Math.floor(c1.g + (c2.g - c1.g) * t);
            const b = Math.floor(c1.b + (c2.b - c1.b) * t);
            
            return { r, g, b };
        }
        
        // Render the nebula
        function render(time) {
            const bg = palettes[params.type].background;
            
            // Create image data for pixel manipulation
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;
            
            // Sample at lower resolution for performance
            const sampleScale = 0.5;
            const sampleWidth = Math.floor(width * sampleScale);
            const sampleHeight = Math.floor(height * sampleScale);
            
            // Render nebula clouds
            for (let sy = 0; sy < sampleHeight; sy++) {
                for (let sx = 0; sx < sampleWidth; sx++) {
                    const x = sx / sampleScale;
                    const y = sy / sampleScale;
                    
                    // Get density at this position
                    const density = getNebulaDensity(x, y, time);
                    
                    if (density > 0.01) {
                        const color = getNebulaColor(x, y, density, time);
                        
                        // Apply density as alpha
                        const alpha = density * 255;
                        
                        // Scale up to actual resolution
                        for (let dy = 0; dy < 1 / sampleScale; dy++) {
                            for (let dx = 0; dx < 1 / sampleScale; dx++) {
                                const px = Math.floor(x + dx);
                                const py = Math.floor(y + dy);
                                
                                if (px < width && py < height) {
                                    const idx = (py * width + px) * 4;
                                    
                                    // Alpha blend with background
                                    const a = alpha / 255;
                                    data[idx] = data[idx] * (1 - a) + color.r * a;
                                    data[idx + 1] = data[idx + 1] * (1 - a) + color.g * a;
                                    data[idx + 2] = data[idx + 2] * (1 - a) + color.b * a;
                                    data[idx + 3] = 255;
                                }
                            }
                        }
                    }
                }
            }
            
            // Fill background
            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] === 0) {
                    data[i] = bg.r;
                    data[i + 1] = bg.g;
                    data[i + 2] = bg.b;
                    data[i + 3] = 255;
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            // Render stars on top
            renderStars(time);
        }
        
        // Render stars
        function renderStars(time) {
            for (const star of stars) {
                const twinkle = Math.sin(time * 0.001 * star.twinkleSpeed + star.twinkle);
                const brightness = star.brightness * (0.7 + twinkle * 0.3);
                
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
                ctx.fill();
                
                // Glow for larger stars
                if (star.size > 1.5) {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size * 3, 0, Math.PI * 2);
                    const gradient = ctx.createRadialGradient(
                        star.x, star.y, 0,
                        star.x, star.y, star.size * 3
                    );
                    gradient.addColorStop(0, `rgba(255, 255, 255, ${brightness * 0.3})`);
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = gradient;
                    ctx.fill();
                }
            }
        }
        
        // Animation loop
        function animate() {
            if (!isAnimating) return;
            
            const currentTime = performance.now();
            const deltaTime = currentTime - lastTime;
            
            render(currentTime);
            
            // Update FPS
            frameCount++;
            if (frameCount % 30 === 0) {
                const fps = Math.round(1000 / deltaTime);
                document.getElementById('fps').textContent = fps;
            }
            
            lastTime = currentTime;
            animationId = requestAnimationFrame(animate);
        }
        
        // Resize handler
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            generateStars();
        }
        
        // Event listeners
        window.addEventListener('resize', resize);
        
        document.getElementById('nebulaType').addEventListener('change', (e) => {
            params.type = e.target.value;
        });
        
        document.getElementById('density').addEventListener('input', (e) => {
            params.density = parseFloat(e.target.value);
        });
        
        document.getElementById('turbulence').addEventListener('input', (e) => {
            params.turbulence = parseFloat(e.target.value);
        });
        
        document.getElementById('evolution').addEventListener('input', (e) => {
            params.evolution = parseFloat(e.target.value);
        });
        
        document.getElementById('starDensity').addEventListener('input', (e) => {
            params.starDensity = parseInt(e.target.value);
            generateStars();
        });
        
        document.getElementById('regenerate').addEventListener('click', () => {
            generateStars();
        });
        
        document.getElementById('toggleAnimation').addEventListener('click', (e) => {
            isAnimating = !isAnimating;
            e.target.textContent = isAnimating ? 'Pause' : 'Resume';
            if (isAnimating) animate();
        });
        
        document.getElementById('saveImage').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `nebula-${params.type}-${Date.now()}.png`;
            link.href = canvas.toImageData ? canvas.toDataURL() : canvas.toDataURL('image/png');
            link.click();
        });
        
        document.getElementById('toggleControls').addEventListener('click', () => {
            document.getElementById('controls').classList.toggle('hidden');
        });
        
        // Initialize
        resize();
        generateStars();
        animate();
    </script>
</body>
</html>
